    '<button type="button" class="btn-edit" data-rvsync="1">重新同步</button></div>';
}

/* 同步本体：force = 用决策阶段的内容覆盖复盘里已有的内容 */
function applyReviewSync(force) {
  if (!rvInFlow(values)) return;
  const v = rvV();
  rvViewNorm(v);
  const sel = selOf(values);
  const ss = (values.mods && values.mods.ss) || {};
  const pm = (values.mods && values.mods.pm) || {};
  const pvv = (values.mods && values.mods.pv) || {};
  const done = values._rvsync || (values._rvsync = {});
  const blank = x => x == null || (typeof x === "string" && !x.trim()) || (Array.isArray(x) && !x.length);
  let changed = false;
  /* 源里有内容、且（目标为空 或 force）时才写入；写过的规则不再重复写 */
  const put = (k, val, ready) => {
    if (!force && done[k]) return;
    if (blank(val)) return;
    if (!force && !blank(v[k])) { done[k] = 1; return; }
    done[k] = 1;
    v[k] = (val && typeof val === "object") ? JSON.parse(JSON.stringify(val)) : val;
    changed = true;
  };

  /* ① 事项名称 */
  put("title", String(values.title || "").trim());
  /* ② 决策清单 → 第 1 步「决策 → 实际结果」的决策侧（实际结果留给复盘时填）。
     决策清单变了（例如新增了第 4 个决策）就自动补齐，已有结果按决策文字保留。 */
  const list = rvSyncDecisionList();
  const pairsSig = JSON.stringify(list.map(x => x.t));
  if (list.length && (force || done["pairsSig"] !== pairsSig)) {
    const rows = Array.isArray(v.pairs) ? v.pairs : [];
    const next = mergeReviewPairs(rows, list, force);
    if (JSON.stringify(next) !== JSON.stringify(rows)) {
      v.pairs = next;
      changed = true;
    }
    done["pairs"] = 1;
    done["pairsSig"] = pairsSig;
  }
  /* ②b 六步决策的潜在结果 + 概率 → 复盘决策树（alts_i）。
     实际结果已在 pairs[i].r / 决策树的实际分支里，不再作为潜在结果重复同步。
     自动同步只做一次，之后可自由删除 / 改概率；需要刷新时点「重新同步」。 */
  const normTxt = s => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
  const probText = value => {
    const s = String(value == null ? "" : value).replace(/[^\d.]/g, "").replace(/\.$/, "");
    return s ? s + "%" : "";
  };
  const pairRows = Array.isArray(v.pairs) ? v.pairs : [];
  list.forEach((x, i) => {
    if (x.si < 0) return;
    const opts = Array.isArray(ss["options_d" + x.si]) ? ss["options_d" + x.si] : [];
    if (!opts.some(o => o && (o.t || "").trim())) return;
    let pairIdx = i;
    if (!pairRows[pairIdx] || normTxt(pairRows[pairIdx].d) !== normTxt(x.t)) {
      const hit = pairRows.findIndex(p => normTxt(p && p.d) === normTxt(x.t));
      if (hit >= 0) pairIdx = hit;
    }
    const pair = pairRows[pairIdx];
    if (!pair) return;
    const actual = normTxt(pair.r);
    /* 实际结果还没填时先不同步：等填了再排除它，避免把「实际发生」又当成潜在结果 */
    if (!actual) return;
    const src = opts.map((o, j) => ({
      t: String((o && o.t) || "").trim(),
      p: probText(ss["prob_d" + x.si + "_" + j])
    })).filter(o => o.t && normTxt(o.t) !== actual);
    if (!src.length) return;
    const doneKey = "alts_" + pairIdx;
    if (!force && done[doneKey]) return;
    const key = "alts_" + pairIdx;
    const rows = (Array.isArray(v[key]) ? v[key] : []).filter(r => r && typeof r === "object");
    let rowChanged = false;
    src.forEach(s => {
      const hit = rows.find(r => normTxt(r.t) === normTxt(s.t));
      if (hit) {
        const curP = String(hit.p == null ? "" : hit.p).trim();
        if (s.p && (force || !curP) && curP !== s.p) { hit.p = s.p; rowChanged = true; }
      } else {
        rows.push({ t: s.t, p: s.p });
        rowChanged = true;
      }
    });
    if (rowChanged) { v[key] = rows; changed = true; }
    done[doneKey] = 1;
  });
  /* ③ 最初的期待 ← 事前验尸要验的计划（没有就退回六步决策的结论陈述） */
  put("expectation", String(pm.goal_desc || "").trim() || String(ss.conclusion || "").trim());
  /* ④ 做决策前就知道的事 ← 六步决策「你知道的信息」（按决策逐条对齐） */
  list.forEach((x, i) => {
    if (x.si < 0) return;
    const src = (Array.isArray(ss["know_d" + x.si]) ? ss["know_d" + x.si] : []).filter(r => (r.t || "").trim());
    put("known_before_" + i, src.map(r => ({ t: r.t })));
  });
  /* ⑤ 观点追踪 ← 内外视角模块的多组观点；⑥ 视角校准 ← 多组校准（整次复盘一套） */
  put("vt", rvPvGroups(pvv));
  put("cal", rvPvCals(pvv));
  /* ⑦⑧ 预先承诺 / 对冲 ← 事前验尸的承诺表与对冲表 */
  put("keep_0", rvStrategyText(pm, "fail_ctrl", "commit"));
  put("hedge_0", rvStrategyText(pm, "fail_unctrl", "hedge"));

  if (changed) saveDraft();
}

/* 复盘报告：按四个阶段逐步骤重绘向导那套字段（只读态），逐决策的步骤一张卡一个决策 */
function rvReportSections(v) {
  /* 字段渲染统一从 values.rv 取值：渲染报告时先把它临时指向报告里的数据（与复盘工具箱同一做法） */
  const saved = values.rv;
  values.rv = v;
  try {
    return rvReportSectionsHtml(v);
  } finally {
    values.rv = saved;
  }
}
function rvReportSectionsHtml(v) {
  let sections = "";
  RV_PHASES.forEach((ph, pi) => {
    const stepsHtml = RV_STEPS.map((st, si) => ({ st: st, si: si })).filter(x => x.st.phase === pi).map(x => {
      const keep = f => f.type !== "note" && f.type !== "dtex";
      const isDec = DEC_STEP_IDS.indexOf(x.st.id) >= 0;
      const isView = x.st.id === "s8" || x.st.id === "s9";
      const nDec = isDec ? decPairs(v).length : 0;
      let cards;
      if (isDec && nDec > 1) {
        /* 逐决策的步骤：一张卡一个决策 */
        cards = decPairs(v).map((p, di) => ({ di: di, gi: null, fs: RV_FIELDS(x.st.id, v, di).filter(keep) }));
      } else if (isView) {
        /* 内外视角 / 视角校准：多组观点追踪时一张卡一组（录入时按组页签切换） */
        rvViewNorm(v);
        const groups = Array.isArray(v.vt) ? v.vt : [];
        cards = groups.length > 1
          ? groups.map((g, gi) => ({ di: null, gi: gi, gname: rvGrpName(g, gi), fs: RV_FIELDS(x.st.id, v).filter(keep) }))
          : [{ di: null, gi: null, fs: RV_FIELDS(x.st.id, v).filter(keep) }];
      } else {
        cards = [{ di: null, gi: null, fs: RV_FIELDS(x.st.id, v).filter(keep) }];
      }
      const valid = cards.filter(c => c.fs.some(f => !f.showIf || f.showIf(v)) || c.di != null || c.gi != null);
      if (!valid.length) return "";
      return valid.map(c =>
        '<div class="step-card report-step">' +
          '<div class="step-head">' +
            '<span class="tag">第 ' + (x.si + 1) + ' 步 · ' + esc(x.st.tag) + '</span>' +
            '<h2>' + esc(x.st.title) +
              (c.di != null ? '<span class="dec-chip">决策 ' + (c.di + 1) + ' / ' + nDec + '</span>' : "") +
              (c.gi != null ? '<span class="dec-chip">' + esc(c.gname) + '</span>' : "") +
            '</h2>' +
          '</div>' +
          '<div class="step-body">' + rvRenderFields(c.fs, true, c.gi) + '</div>' +
        '</div>').join("");
    }).join("");
    if (stepsHtml) sections += '<div class="report-phase"><span class="pdot" style="background:' + ph.color + ';"></span>' + esc(ph.name) + '</div>' + stepsHtml;
  });
  return sections;
}
/* 复盘阶段的章（报告视图） */
function rvChapterHtml(rvv, ci) {
  const body = rvReportSections(rvv);
  if (!body) return "";
  const vd = rvVerdict(rvv);
  /* 外层 report-flow 网格由 renderReport 统一提供，这里只出章标题与页卡 */
  return '<div class="report-phase"><span class="pdot" style="background:' + RV_COLOR + ';"></span>第' + CN_NUM[ci] + '章 · 复盘' +
    (vd && vd.t ? ' · ' + esc(vd.t) : "") + '</div>' + body;
}

/* ---------- 基准库（决策阶段与复盘阶段共用一份） ---------- */
function migrateBaselineNow() {
  let has = null;
  try { has = localStorage.getItem(LS_BASE); } catch (e) { return; }
  if (has) return;
  const read = k => { try { return JSON.parse(localStorage.getItem(k)) || null; } catch (e) { return null; } };
  const merged = {};
  const pvOld = read("pv_baseline");
  if (pvOld && Object.keys(pvOld).length) merged.pv = pvOld;
  const drb = read("dr_baseline");
  if (drb) {
    if (!merged.pv && drb.pv) merged.pv = drb.pv;
    if (drb.lb) merged.lb = drb.lb;
    if (drb.kt) merged.kt = drb.kt;
  }
  const lbOld = read("luckbox_myex");
  if (!merged.lb && lbOld && Object.keys(lbOld).length) merged.lb = lbOld;
  const ktOld = read("kt_examples");
  if (!merged.kt && ktOld && (ktOld.ktex_knew || ktOld.ktex_should)) merged.kt = { knew: ktOld.ktex_knew || "", should: ktOld.ktex_should || "" };
  if (!Object.keys(merged).length) return;
  baseline = merged;
  saveBaseline();
}

/* ---------- 旧工具的报告：只读导入（可手动重跑，永不改动旧工具的数据） ---------- */
function importLegacyReports(force) {
  let done = null;
  try { done = localStorage.getItem(LS_MIGRATED2); } catch (e) { done = null; }
  if (!force && done) return 0;
  const read = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } };
  /* 已经在列表里的就不再导入：优先按来源 id 认，其次按「标题 + 时间」兜底 */
  const already = rec => reports.some(r =>
    (r.src && rec.src && r.src === rec.src) ||
    (String(r.title || "") === String(rec.title || "") && String(r.date || "") === String(rec.date || "")));
  let added = 0, seq = 0;
  const push = rec => {
    if (already(rec)) return;
    if (!(typeof rec.id === "number" && rec.id > 0)) rec.id = Date.now() + (++seq);
    reports.push(rec);
    added++;
  };
  /* ① 辅助决策工具箱的组合报告 */
  read("ad_reports").forEach(r => {
    if (!r || typeof r !== "object" || !r.mods) return;
    push({
      src: "ad:" + r.id, id: r.id, date: r.date || "", updated: r.updated || "",
      title: String(r.title || "").trim() || "未命名",
      flowmode: r.flowmode === "default" ? "default" : "custom",
      sel: Array.isArray(r.sel) ? r.sel : [], mods: r.mods, doReview: "yes"
    });
  });
  /* ② 决策复盘工具箱的复盘报告 */
  read("dr_reports").forEach(r => {
    if (!r || typeof r !== "object" || !r.values) return;
    push({
      src: "dr:" + r.id, id: r.id, date: r.date || "",
      title: String(r.values.title || "").trim() || "未命名",
      flowmode: "custom", sel: [], mods: {}, doReview: "yes", rv: r.values
    });
  });
  /* ③ 四个单文件工具各自的报告（辅助决策工具箱里合并过一次，这里直接读原件，避免二道转手） */
  [["dp2", "dp"], ["ss2", "ss"], ["pv", "pv"], ["pm", "pm"]].forEach(pair => {
    const prefix = pair[0], m = pair[1];
    read(prefix + "_reports").forEach(r => {
      if (!r || typeof r !== "object" || !r.values) return;
      const mods = {};
      mods[m] = r.values;
      push({
        src: prefix + ":" + r.id, id: r.id, date: r.date || "",
        title: m === "pm" ? pmReportTitle(r.values) : (String(r.values[MODS[m].titleKey] || "").trim() || "未命名"),
        flowmode: "custom", sel: [m], mods: mods, doReview: "yes"
      });
    });
  });
  if (added) {
    reports.sort((a, b) => (b.id || 0) - (a.id || 0));
    persistReports();
  }
  try { localStorage.setItem(LS_MIGRATED2, "1"); } catch (e) {}
  return added;
}

/* 报告保存前清洗复盘阶段的空行 */
function cleanRvValues(rvv) {
  if (!rvv || typeof rvv !== "object") return {};
  const clean = JSON.parse(JSON.stringify(rvv));
  /* 旧的逐决策观点/校准数据先合并成 vt / cal，再清洗 */
  rvViewNorm(clean);
  const rowHas = row => Object.keys(row).some(k => {
    const val = row[k];
    if (Array.isArray(val)) return val.some(y => (y && typeof y === "object")
      ? Object.keys(y).some(z => String(y[z] == null ? "" : y[z]).trim())
      : String(y == null ? "" : y).trim());
    return val != null && String(val).trim() !== "";
  });
  Object.keys(clean).forEach(k => {
    if (k.charAt(0) === "_") { delete clean[k]; return; }
    const arr = clean[k];
    /* vt / cal 必须保持逐组对齐，不能单独过滤空项 */
    if (k !== "vt" && k !== "cal" && Array.isArray(arr) && arr.length && arr.every(x => x && typeof x === "object")) {
      clean[k] = arr.filter(rowHas);
    }
  });
  Object.keys(clean).forEach(k => { if (Array.isArray(clean[k]) && !clean[k].length) delete clean[k]; });
  return clean;
}


/* =====================================================================
 * 进行中的记录：任意阶段都能停下来，首页列出所有没走完的会话
 *   · 每处填写、每步跳转都会把当前会话写进 drafts（可多条并存）
 *   · 走完流程生成报告时，对应的那条记录自动移入「已完成的报告」
 * ===================================================================== */

const LS_DRAFTS = "dfr_drafts";
let drafts = loadDraftsCache();
let DRAFT_ID = null;          // 当前向导会话对应的「进行中记录」id（null = 还没落盘）

function nowStr() {
  return new Date().toLocaleString("zh-CN");
}
function loadDraftsCache() {
  try { return JSON.parse(localStorage.getItem(LS_DRAFTS)) || []; } catch (e) { return []; }
}
function persistDrafts() {
  try { localStorage.setItem(LS_DRAFTS, JSON.stringify(drafts)); } catch (e) {}
}
function findDraft(id) {
  return drafts.filter(d => d.id === id)[0] || null;
}
/* 记录 id：同毫秒内连开两条也不会撞（撞了就会互相覆盖） */
function newDraftId() {
  let id = Date.now();
  while (drafts.some(d => d.id === id)) id++;
  return id;
}
function draftHasContent(v) {
  if (!v || typeof v !== "object") return false;
  if (String(v.title || "").trim()) return true;
  if (Array.isArray(v.sel) && v.sel.length) return true;
  const has = x => Array.isArray(x) ? x.length > 0 : (x != null && String(x).trim() !== "");
  if (v.mods && Object.keys(v.mods).some(m => Object.keys(v.mods[m] || {}).some(k => k.charAt(0) !== "_" && has(v.mods[m][k])))) return true;
  return Object.keys(v.rv || {}).some(k => has(v.rv[k]));
}
/* 进度描述：当前在哪一阶段/模块、组内第几步、全流程第几步 */
function progressLabel(v, c) {
  const entries = buildPath(v || {});
  if (!entries.length) return "";
  const keyOf = e => e.rv ? "rv" + e.step.phase : (e.mod || "s0");
  const i = Math.max(0, Math.min(Number(c) || 0, entries.length - 1));
  const e = entries[i];
  const key = keyOf(e);
  const sameKey = entries.map((x, k) => keyOf(x) === key ? k : -1).filter(k => k >= 0);
  const where = e.rv
    ? ("复盘阶段 · " + RV_PHASES[e.step.phase].short)
    : (e.mod ? ("决策阶段 · " + MODS[e.mod].name) : "起始步");
  const stepTitle = (!e.rv && !e.mod && v && v.mode === "rv") ? "起始 · 起名" : e.step.title;
  return where + " · 第 " + (sameKey.indexOf(i) + 1) + "/" + sameKey.length + " 步「" + stepTitle + "」" +
    "（全流程 " + (i + 1) + "/" + entries.length + "）";
}
/* saveDraft 的落点：新增或更新当前这条「进行中的记录」 */
function saveDraftToList() {
  if (!values || typeof values !== "object") return;
  let d = DRAFT_ID != null ? findDraft(DRAFT_ID) : null;
  if (!d) {
    if (!draftHasContent(values)) return;      /* 空白会话不落盘 */
    DRAFT_ID = newDraftId();
    d = { id: DRAFT_ID, created: nowStr() };
    drafts.unshift(d);
  }
  d.title = String(values.title || "").trim() || "未命名";
  d.updated = nowStr();
  d.c = cur;
  d.r = pmRound;
  d.e = editingReport ? editingReport.id : null;
  d.etitle = editingReport ? String(editingReport.title || "") : "";
  d.v = values;
  persistDrafts();
}
/* 当前会话不再「进行中」（已存档成报告，或放弃编辑） */
function dropCurrentDraft() {
  if (DRAFT_ID == null) return;
  drafts = drafts.filter(d => d.id !== DRAFT_ID);
  DRAFT_ID = null;
  persistDrafts();
}
/* 从首页继续一条进行中的记录 */
function resumeDraft(id) {
  const d = findDraft(id);
  if (!d) return;
  resetNavState();
  DRAFT_ID = d.id;
  values = JSON.parse(JSON.stringify(d.v || {}));
  pmRound = Number(d.r) || 0;
  cur = Number(d.c) || 0;
  if (pmRound > 0) resolveScope("m:pm@" + pmRound, true);
  editingReport = d.e ? (reports.filter(r => r.id === d.e)[0] || null) : null;
  view = "wizard";
  goRender();
}
/* 开始一次新会话（旧会话若已有内容，仍留在「进行中的记录」里） */
/* 开始一次新会话（旧会话若已有内容，仍留在「进行中的记录」里）
   kind = "dec"：辅助决策入口——s0 起名 + 勾选模块，路径只有决策模块，保存后待复盘
   kind = "rv" ：决策复盘入口——s0 只起名，直接走复盘 12 步 */
function startNewSession(kind) {
  resetNavState();
  DRAFT_ID = null;
  values = { mode: kind === "rv" ? "rv" : "dec", doReview: kind === "rv" ? "yes" : "no" };
  editingReport = null;
  saveDraft();
  view = "wizard";
  goRender();
}
/* 旧版只有一个草稿位（dfr_draft）：一次性搬进「进行中的记录」 */
function migrateSingleDraftOnce() {
  let raw = null;
  try { raw = localStorage.getItem(LS_DRAFT); } catch (e) { return; }
  if (!raw) return;
  const d = loadDraft();
  try { localStorage.removeItem(LS_DRAFT); } catch (e) {}
  if (!d || !d.v || !draftHasContent(d.v)) return;
  drafts.unshift({
    id: newDraftId(), created: nowStr(), updated: nowStr(),
    title: String(d.v.title || "").trim() || "未命名",
    c: Number(d.c) || 0, r: Number(d.r) || 0,
    e: d.e || null, etitle: "", v: d.v
  });
  persistDrafts();
}


/* ---------- 启动：把旧单草稿搬进记录列表，导入旧报告与基准库（只读旧 key，不写不改） ---------- */
migrateSingleDraftOnce();
importLegacyReports(false);
migrateBaselineNow();
dropLegacyFollowups();
render();

</script>
