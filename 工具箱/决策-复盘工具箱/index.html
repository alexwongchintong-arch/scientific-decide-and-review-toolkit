<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>决策-复盘工具箱 · 决策到复盘全流程 — 基于《对赌（实践版）》</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f4;
    --surface: #ffffff;
    --border: #e6e3dd;
    --text: #1a1a1a;
    --text-secondary: #55534f;
    --text-muted: #999590;
    --accent: #1a56db;
    --accent-soft: #eaf0fd;
    --success: #1a7f3f;
    --success-soft: #e9f5ec;
    --warning: #b85415;
    --warning-soft: #fdf1e7;
    --danger: #c02a2a;
    --radius: 8px;
    --radius-sm: 5px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    min-height: 100vh;
  }

  .container { max-width: none; margin: 0 auto; padding: 24px 32px 80px; }
  .narrow { max-width: 1280px; margin-left: auto; margin-right: auto; }

  .hero, .report-list {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 30px 32px; box-shadow: var(--shadow); margin-bottom: 22px;
  }
  .hero .kicker { font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 8px; }
  .hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 14px; }
  .hero p { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; }
  .report-list h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }

  /* 首页默认流程示意卡 */
  .flow-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 14px 0 4px; }
  .flow-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px;
               background: #fcfbfa; border-top: 3px solid var(--accent); }
  .flow-card h4 { font-size: 13px; margin-bottom: 4px; }
  .flow-card .fc-src { font-size: 11px; color: var(--accent); margin-bottom: 4px; }
  .flow-card .fc-desc { font-size: 12px; color: var(--text-secondary); }

  /* 首页两个入口：两个带框区块并排，框内各自 2×2 田字；
     subgrid 让两框共享父网格行轨道——8 张卡跨框等高等宽 */
  .entry-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr);
                gap: 12px; margin: 16px 0 4px; }
  .entry-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: subgrid;
               gap: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
               background: #fcfbfa; padding: 14px 16px 16px; }
  .entry-col.dec { grid-area: 1 / 1 / 4 / 3; }
  .entry-col.rev { grid-area: 1 / 3 / 4 / 5; }
  .entry-col .ec-head { grid-column: 1 / -1; }
  .entry-col .ec-head h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .entry-col .ec-desc { font-size: 12.5px; color: var(--text-secondary); }

  /* 首页两区（进行中 / 已完成）横置并排，窄屏回退上下堆叠 */
  .lists-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }

  /* 进行中记录的来源色条：决策来源（蓝）/ 复盘来源（青） */
  .report-item.src-dec { border-left: 3px solid var(--accent); padding-left: 12px; }
  .report-item.src-rv { border-left: 3px solid #0e7490; padding-left: 12px; }

  /* 报告页头部：决策 / 复盘进度左右并列 */
  .rep-prog { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
  .rp-col { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; background: #fcfbfa; }
  .rp-col h4 { font-size: 13px; margin-bottom: 8px; }
  .rp-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-secondary); padding: 3px 0; flex-wrap: wrap; }
  .rp-row .pdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .rp-row .rp-num { color: var(--text-muted); margin-left: auto; }
  .rp-row .rp-vd { flex-basis: 100%; color: var(--text-muted); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border: none; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; transition: background 0.12s;
  }
  .btn:hover { background: #1646b0; }
  .btn.secondary { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); }
  .btn.secondary:hover { background: #f0efec; }
  .btn.danger-ghost { background: transparent; color: var(--danger); border: 1px solid #e5b8b8; font-weight: 500; padding: 6px 12px; }
  .btn.danger-ghost:hover { background: #fbeaea; border-color: var(--danger); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .report-item { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                 padding: 12px 0; border-bottom: 1px solid var(--border); }
  .report-item:last-child { border-bottom: none; }
  .report-item .ri-main { flex: 1; cursor: pointer; min-width: 0; }
  .report-item .ri-title { font-size: 14px; font-weight: 600; }
  .report-item .ri-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ri-tag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; color: #fff; }
  .empty-hint { font-size: 13px; color: var(--text-muted); }

  /* 首页：流式全宽（左右留白交给 .container 的 padding），条目在半栏内整行拉满 */
  .home-full { width: 100%; }
  .ri-grid { display: block; }

  /* 两层步骤条：上层模块阶段条，下层当前模块内步骤胶囊 */
  .phase-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .phase-chip {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: 12.5px; color: var(--text-muted); cursor: pointer;
    transition: all 0.12s; white-space: nowrap;
  }
  .phase-chip .pdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .phase-chip.active { font-weight: 700; color: var(--text); }
  .phase-chip.done { color: var(--text-secondary); }

  .stepper { display: flex; align-items: center; gap: 4px; margin-bottom: 22px; flex-wrap: wrap; }
  .step-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: 12px; color: var(--text-muted); cursor: pointer;
    transition: all 0.12s; white-space: nowrap;
  }
  .step-chip .num { width: 17px; height: 17px; border-radius: 50%; background: #eceae6;
                    display: inline-flex; align-items: center; justify-content: center;
                    font-size: 10.5px; font-weight: 700; color: var(--text-muted); }
  .step-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .step-chip.active .num { background: var(--accent); color: #fff; }
  .step-chip.done { color: var(--success); }
  .step-chip.done .num { background: var(--success); color: #fff; }
  .step-sep { color: #d4d1cb; font-size: 11px; }

  .step-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
               box-shadow: var(--shadow); overflow: hidden; }
  .step-head { padding: 24px 32px 18px; border-bottom: 1px solid var(--border); }
  .step-head .tag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--accent);
                    background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
  .step-head h2 { font-size: 20px; font-weight: 700; }
  .step-body { padding: 24px 32px 32px; }

  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .review-col { display: flex; flex-direction: column; gap: 16px; }
  .review-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                 box-shadow: var(--shadow); overflow: hidden; }
  .review-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                 padding: 12px 18px; border-bottom: 1px solid var(--border); background: #faf9f7; }
  .review-head h3 { font-size: 13px; font-weight: 700; color: var(--text-secondary); }
  .btn-edit { border: 1px solid var(--border); background: #fff; color: var(--accent); font-size: 12px;
              font-weight: 600; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
  .btn-edit:hover { border-color: var(--accent); }
  .btn-edit.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* 危险操作（放弃草稿 / 放弃编辑 / 删除报告等）：常态实心红，hover 更深 */
  .btn-edit.danger { color: #fff; background: var(--danger); border-color: var(--danger); }
  .btn-edit.danger:hover { background: #9e2222; border-color: #9e2222; }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.danger:hover { background: #9e2222; }
  .rv-nav { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .rv-nav h3 { font-size: 13px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rv-arrow { border: 1px solid var(--border); background: #fff; color: var(--text-secondary); font-size: 14px; line-height: 1; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; flex-shrink: 0; }
  .rv-arrow:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .rv-arrow:disabled { opacity: 0.35; cursor: not-allowed; }
  .review-body { padding: 16px 18px 20px; font-size: 13.5px; }
  /* 右侧辅助信息框：斜角页签（回顾过往步骤 / 判断基准），活动页签与下方卡片连成一体 */
  /* 编辑已保存报告时的提示条 */
  .edit-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px;
              background: var(--accent-soft); border: 1px solid #c9d8f8; color: var(--accent);
              border-radius: var(--radius-sm); padding: 8px 14px; font-size: 12.5px; margin-bottom: 12px; }
  .aux-tabs { display: flex; align-items: flex-end; gap: 3px; padding-left: 12px; margin-bottom: -1px; position: relative; z-index: 1; }
  .aux-tab { transform: skewX(-14deg); border: 1px solid var(--border); border-bottom: none; background: #f2f0ec;
             color: var(--text-muted); font-family: inherit; font-size: 12.5px; font-weight: 600;
             padding: 6px 15px; border-radius: 7px 7px 0 0; cursor: pointer; transition: background 0.12s, color 0.12s; }
  .aux-tab > span { display: inline-block; transform: skewX(14deg); }
  .aux-tab:hover { color: var(--accent); }
  .aux-tab.on { background: var(--surface); color: var(--accent); }
  /* 第二行（工具切换）更小一档，配色由各工具的主题色内联给出；上面还有一行时不与卡片相连 */
  .aux-tab.sub { font-size: 11.5px; padding: 4px 12px; }
  .aux-tab.sub.on { font-weight: 700; }
  .review-body .field { margin-bottom: 16px; }
  .review-body textarea { min-height: 54px; font-size: 13px; }
  .locked { opacity: 0.82; }
  .locked input, .locked textarea { background: #faf9f7; border-color: transparent; color: var(--text-secondary);
                                    box-shadow: none !important; }
  .locked .yn-btn, .locked .as-btn, .locked .radio-option, .locked .list-add, .locked .row-remove,
  .locked .score-btn, .locked .chip, .locked .sq-check, .locked .mp-card { pointer-events: none; }

  .field { margin-bottom: 26px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { font-size: 13.5px; font-weight: 600; margin-bottom: 7px; display: block; }
  .field-label .opt-name { color: var(--accent); }
  .field-hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
  .meta-note { background: #faf9f7; border: 1px dashed var(--border); border-radius: var(--radius-sm);
               padding: 8px 12px; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 14px; }
  input[type="text"], textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,86,219,0.12); }
  textarea { resize: vertical; min-height: 72px; line-height: 1.6; }

  /* s0 起始步：模块勾选卡 */
  .mp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .mp-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px;
             background: #fff; cursor: pointer; transition: all 0.12s; }
  .mp-card:hover { border-color: var(--accent); }
  .mp-card.on { border-color: var(--accent); background: var(--accent-soft); }
  .mp-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .mp-check { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 6px; background: #fff;
              color: transparent; font-size: 13px; line-height: 1; flex-shrink: 0;
              display: inline-flex; align-items: center; justify-content: center; transition: all 0.12s; }
  .mp-card.on .mp-check { border-color: var(--accent); background: var(--accent); color: #fff; }
  .mp-name { font-size: 14.5px; font-weight: 700; flex: 1; }
  .mp-ord { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
            font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mp-src { font-size: 11.5px; color: var(--accent); margin-bottom: 4px; }
  .mp-desc { font-size: 12.5px; color: var(--text-secondary); }
  .mp-card.mp-default { border-style: dashed; }
  .mp-card.mp-default.on { border-style: solid; }

  /* s0 已选模块词条列表：⠿ 手柄 + 序号 + 模块名，HTML5 拖拽排序 */
  .sel-list { margin-top: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; overflow: hidden; }
  .sel-row { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .sel-row:last-child { border-bottom: none; }
  .sel-row.dragging { opacity: 0.4; }
  .sel-row.drag-over { border-top: 2px solid var(--accent); }
  .sel-drag { cursor: grab; color: var(--text-muted); font-size: 14px; user-select: none; flex-shrink: 0; padding: 0 2px; }
  .sel-drag:hover { color: var(--accent); }
  .sel-drag:active { cursor: grabbing; }
  .sel-drag.off { cursor: default; opacity: 0.4; }
  .sel-ord { width: 18px; height: 18px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
             font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sel-name { font-weight: 600; }

  .radio-group { display: flex; flex-direction: column; gap: 8px; }
  .radio-group.inline { flex-direction: row; }
  .radio-group.inline .radio-option { flex: 1; }
  .radio-option {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
    transition: all 0.12s; font-size: 13.5px;
  }
  .radio-option:hover { border-color: var(--accent); }
  .radio-option.checked { border-color: var(--accent); background: var(--accent-soft); }
  .radio-option input { margin-top: 3px; accent-color: var(--accent); }
  .radio-option .opt-desc { color: var(--text-muted); font-size: 12px; display: block; }

  .score-row { display: flex; gap: 8px; align-items: center; }
  .score-btn {
    width: 42px; height: 42px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--text-secondary);
    transition: all 0.12s;
  }
  .score-btn:hover { border-color: var(--accent); }
  .score-btn.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .score-endlabel { font-size: 11.5px; color: var(--text-muted); width: 74px; line-height: 1.4; }
  .score-endlabel.right { text-align: right; color: var(--accent); }

  .list-rows { display: flex; flex-direction: column; gap: 10px; }
  .list-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: #fcfbfa;
              display: flex; gap: 10px; align-items: flex-start; }
  .list-row .idx { font-size: 12px; color: var(--text-muted); font-weight: 700; padding-top: 9px; flex-shrink: 0; }
  .list-row textarea { flex: 1; resize: none; overflow: hidden; min-height: 40px; padding: 7px 10px; font-size: 13.5px; }
  .row-cmp { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 4px; }
  .row-cmp .chip { padding: 4px 12px; font-size: 12px; border: 1px solid var(--border); border-radius: 999px;
                   cursor: pointer; background: #fff; color: var(--text-secondary); user-select: none; }
  .row-cmp .chip:hover { border-color: var(--accent); }
  .row-cmp .chip.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row-remove { flex-shrink: 0; border: none; background: transparent; color: var(--text-muted);
                cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 4px; line-height: 1; }
  .row-remove:hover { color: var(--danger); background: #fbeaea; }
  .list-add { border: 1px dashed var(--border); background: transparent; color: var(--accent);
              padding: 9px; width: 100%; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; margin-top: 10px; }
  .list-add:hover { border-color: var(--accent); background: var(--accent-soft); }
  .list-empty-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }

  .as-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; background: #fff; }
  .as-item { font-size: 13.5px; margin-bottom: 8px; }
  .as-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .as-btn { padding: 4px 16px; font-size: 12.5px; border: 1px solid var(--border); border-radius: 999px;
            cursor: pointer; background: #fff; color: var(--text-secondary); user-select: none; }
  .as-btn:hover { border-color: var(--accent); }
  .as-btn.picked-1 { background: var(--accent); border-color: var(--accent); color: #fff; }
  .as-btn.picked-2 { background: #7a86a8; border-color: #7a86a8; color: #fff; }
  .as-btn.picked-3 { background: #eceae6; border-color: #d4d1cb; color: var(--text-secondary); }

  /* ---------- decision-pacing 特有：唯一选择测验 ---------- */
  .cl-list { border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; overflow: hidden; }
  .cl-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .cl-row:last-child { border-bottom: none; }
  .cl-item { flex: 1; min-width: 0; font-size: 13.5px; }
  .sq-check { width: 26px; height: 26px; border: 2px solid var(--border); border-radius: 6px; background: #fff;
              color: transparent; font-size: 15px; line-height: 1; cursor: pointer; flex-shrink: 0;
              display: inline-flex; align-items: center; justify-content: center; transition: all 0.12s; }
  .sq-check:hover:not(:disabled) { border-color: var(--success); }
  .radio-option .sq-check { margin-top: 1px; font-size: 14px; }
  .sq-check.checked { border-color: var(--success); background: var(--success-soft); color: var(--success); }
  .locked .sq-check { pointer-events: none; }

  /* ---------- six-step 特有：决策树 / 页签 / 组内比较 / 半栏 ---------- */
  .dt-branches { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: #fff; min-width: 0; }
  .dt-branch-head { font-size: 12.5px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 8px; font-weight: 700; }
  .dt-branch { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
  .dt-branch:last-of-type { margin-bottom: 4px; }
  .dt-arrow { color: var(--text-muted); font-size: 16px; flex-shrink: 0; padding-top: 4px; }
  .dt-branch-body { flex: 1; min-width: 0; }
  .dt-branch-body textarea { width: 100%; border: none; border-bottom: 1px dashed var(--border); border-radius: 0; background: transparent; font-size: 13px; padding: 4px 2px; resize: none; overflow: hidden; min-height: 0; }
  .dt-branch-body textarea:focus { outline: none; border-bottom-color: var(--accent); box-shadow: none; }
  .dt-sorthint { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .dt-drag { cursor: grab; color: var(--text-muted); font-size: 14px; padding: 3px 2px 0; user-select: none; flex-shrink: 0; }
  .dt-drag:hover { color: var(--accent); }
  .dt-drag:active { cursor: grabbing; }
  .dt-branch.dragging { opacity: 0.4; }
  .dt-branch.drag-over { border-top: 2px solid var(--accent); padding-top: 4px; }
  .locked .dt-branch { cursor: default; }

  .half-row { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 26px; }
  .half-row .field.half { flex: 1; min-width: 0; margin-bottom: 0; }

  .otabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .otab { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 12.5px; color: var(--text-secondary); cursor: pointer; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: all 0.12s; }
  .otab:hover { border-color: var(--accent); color: var(--accent); }
  .otab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  /* 右侧回顾卡里的 ss 环节页签：与主编辑区同款，只负责切换当前环节 */
  .rv-subtabs { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed var(--border); }

  .sum-list { border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; overflow: hidden; }
  .sum-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); }
  .sum-row:last-child { border-bottom: none; }
  .sum-rank { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
              font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sum-text { flex: 1; min-width: 0; font-size: 13.5px; }
  .sum-prob { font-size: 12px; color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .sum-prob.none { color: var(--text-muted); font-weight: 400; }

  /* ---------- perspective 特有：基准条 / 基准数三联行 / 内外视角双栏 ---------- */
  .tri-sub { display: flex; gap: 8px; }
  .tri-sub input { flex: 1; min-width: 0; }
  .vt-title { text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .vt-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .vt-col { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; background: #fff; min-width: 0; }
  .vt-col h4 { font-size: 13.5px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 6px; }
  .vt-col .vt-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; text-align: center; }
  .vt-inside h4 { color: var(--warning); }
  .vt-outside h4 { color: var(--accent); }
  /* 多组观点追踪：组卡片（简约款，与复盘工具箱一致）+ 组页签条 */
  .vt-group { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; background: #fcfbfa; margin-bottom: 14px; }
  .vt-group-head { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 12px; }
  .vt-group-name { flex: 1; min-width: 0; font-weight: 600; }
  .vt-group .vt-grid { gap: 10px; }
  .vt-group .bs-cap { font-size: 12.5px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .pv-grp-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .rv-grp-head { font-size: 13px; font-weight: 700; color: var(--text); border-left: 3px solid var(--accent);
    padding-left: 8px; margin: 14px 0 8px; }
  .rv-grp-head:first-child { margin-top: 0; }

  /* ---------- pre-mortem 特有：决策表 / 策略表 / 多轮回顾 ---------- */
  .dt-title { text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .dt-group { display: grid; grid-template-columns: 58px minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 22px; align-items: start; }
  .dt-group:last-child { margin-bottom: 0; }
  .dt-glabel { font-size: 13px; font-weight: 700; color: var(--text-secondary); text-align: center; padding-top: 36px; line-height: 1.6; }
  .dt-table { border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; overflow: hidden; }
  .dt-thead { display: flex; justify-content: center; gap: 24px; font-size: 12.5px; font-weight: 700; color: var(--text-secondary); padding: 7px 10px; border-bottom: 1px solid var(--border); background: #faf9f7; }
  .dt-row { display: flex; border-bottom: 1px solid var(--border); min-height: 46px; }
  .dt-row:last-child { border-bottom: none; }
  .dt-reason { flex: 1; display: flex; gap: 6px; padding: 9px 10px; font-size: 13px; line-height: 1.55; min-width: 0; word-break: break-word; }
  .dt-reason .idx { font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
  .dt-pct { width: 66px; flex-shrink: 0; border-left: 1px solid var(--border); display: flex; align-items: stretch; }
  .dt-pct input { width: 100%; border: none; border-radius: 0; text-align: center; font-size: 13px; padding: 6px 4px; background: transparent; }
  .dt-pct input:focus { box-shadow: none; background: var(--accent-soft); }
  .locked .dt-pct input { background: transparent; color: var(--text-secondary); }
  .dt-empty { padding: 14px; font-size: 12.5px; color: var(--text-muted); text-align: center; }

  .loop-recap { border: 1px dashed var(--border); border-radius: var(--radius-sm); background: #faf9f7; padding: 16px 18px; margin: 8px 0 18px; }
  .lr-step { margin-bottom: 12px; }
  .lr-step:last-child { margin-bottom: 0; }
  .lr-step > b { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 700; }

  .st-table { border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; overflow: hidden; }
  .st-thead { display: flex; font-size: 12.5px; font-weight: 700; color: var(--text-secondary); border-bottom: 1px solid var(--border); background: #faf9f7; }
  .st-thead > div { padding: 7px 12px; }
  .st-thead .st-h-input { border-left: 1px solid var(--border); }
  .st-row { display: flex; border-bottom: 1px solid var(--border); }
  .st-row:last-child { border-bottom: none; }
  .st-reason { flex: 0 0 50%; padding: 10px 12px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; min-width: 0; line-height: 1.55; }
  .st-reason .idx { font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
  .st-pctbadge { flex-shrink: 0; font-size: 11.5px; font-weight: 700; color: var(--warning); background: var(--warning-soft); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
  .st-pctbadge.none { color: var(--text-muted); background: #efedea; }
  .st-input { flex: 0 0 50%; border-left: 1px solid var(--border); display: flex; min-width: 0; }
  .st-input textarea { width: 100%; border: none; border-radius: 0; min-height: 46px; resize: none; overflow: hidden; font-size: 13px; padding: 9px 12px; background: transparent; }
  .st-input textarea:focus { box-shadow: none; background: var(--accent-soft); }
  .locked .st-input textarea { background: transparent; color: var(--text-secondary); }
  .st-empty { padding: 12px; font-size: 12.5px; color: var(--text-muted); text-align: center; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; gap: 12px; }
  .nav-note { font-size: 12px; color: var(--text-muted); }

  /* ---------- 组合报告 ---------- */
  /* 报告页用满屏幕宽度：正文区不再限宽，小节卡片网格控制单块可读宽度 */
  .report-head { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                 padding: 28px 32px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .report-head h1 { font-size: 21px; margin-bottom: 6px; }
  .report-head .meta { font-size: 12.5px; color: var(--text-muted); margin-bottom: 14px; }
  .vb-row { display: flex; flex-direction: column; gap: 8px; }
  .vb-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .vb-mod { font-size: 12px; font-weight: 700; color: var(--text-secondary); }
  .verdict-banner { display: inline-block; padding: 8px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; }
  .vb-success { background: var(--success-soft); color: var(--success); }
  .vb-warning { background: var(--warning-soft); color: var(--warning); }
  .vb-accent { background: var(--accent-soft); color: var(--accent); }
  .vb-neutral { background: #efedea; color: var(--text-secondary); }
  .lesson-banner { margin-top: 14px; background: #fffbeb; border: 1px solid #f2e3b3; border-radius: var(--radius-sm);
                   padding: 12px 16px; font-size: 14px; }
  .lesson-banner .lb-label { font-size: 11px; font-weight: 700; color: #a07d1c; display: block; margin-bottom: 3px; }
  .report-phase { margin: 24px 0 12px; font-size: 15px; font-weight: 700;
                  display: flex; align-items: center; gap: 8px; }
  .report-phase .pdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .report-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                    padding: 22px 28px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .report-section h3 { font-size: 14px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .report-section h3 .sn { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
                           font-size: 11px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
  .rv-item { margin-bottom: 12px; }
  .rv-item:last-child { margin-bottom: 0; }
  .rv-label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .rv-value { font-size: 13.5px; white-space: pre-wrap; }
  .rv-value.empty { color: var(--text-muted); font-style: italic; }
  .rv-list { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; }
  .rv-list li { margin-bottom: 3px; }
  .rv-as { font-size: 13.5px; margin-bottom: 6px; }
  .rv-as b { font-weight: 600; }
  .actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

  /* 半屏 / 竖长窗口：左右两栏会被压窄，直接改为上方左栏、下方回顾 */
  @media (max-width: 1280px), (max-aspect-ratio: 6/5) {
    .split { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 920px) {
    .split { grid-template-columns: minmax(0, 1fr); }
    .dt-group { grid-template-columns: 1fr; }
    .dt-glabel { padding-top: 0; text-align: left; }
    .half-row { flex-direction: column; gap: 0; }
    .half-row .field.half { margin-bottom: 26px; }
    .flow-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    /* 首页：入口两框回退上下堆叠（框内 2 列卡），两区回退上下堆叠，进度块单列 */
    .entry-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; }
    .entry-col.dec, .entry-col.rev { grid-area: auto; grid-template-rows: none; }
    .lists-cols { grid-template-columns: 1fr; }
    .rep-prog { grid-template-columns: 1fr; }
  }
  /* 报告页小节网格：中等宽度回退单列 */
  @media (max-width: 1100px) {
    .report-flow { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .container { padding: 20px 14px 60px; }
    .hero, .report-list, .step-head, .step-body, .report-head, .report-section { padding-left: 18px; padding-right: 18px; }
    .score-btn { width: 36px; height: 36px; }
    .score-endlabel { width: 56px; }
    .vt-grid { grid-template-columns: 1fr; }
    .tri-sub { flex-direction: column; gap: 6px; }
    .mp-grid { grid-template-columns: 1fr; }
    .flow-grid { grid-template-columns: 1fr; }
    .entry-grid { grid-template-columns: 1fr; }
    .entry-col { grid-template-columns: 1fr; }
    /* 报告条目：窄屏时标题独占一行，操作按钮换到下一行，避免标题被挤成细条 */
    .report-item { flex-wrap: wrap; align-items: flex-start; }
    .report-item .ri-main { flex: 1 1 100%; }
  }
  @media print {
    body { background: #fff; }
    /* 隐藏一切按钮与交互/导航件，只留内容 */
    .actions-row, .no-print, .btn, .btn-edit, .edit-bar, .phase-bar, .stepper,
    .aux-tabs, .dec-bar, .rv-jump, .list-foot, .rv-arrow, .row-remove, .list-add { display: none !important; }
    /* 分章分页：阶段/章标题另起一页并避免与下文断开，小节卡片不跨页 */
    .report-head { box-shadow: none; border: none; padding-left: 0; padding-right: 0; }
    .report-phase { break-before: page; break-after: avoid; }
    .report-head + .report-phase { break-before: auto; }
    .report-section, .report-step, .base-section, .lesson-banner { box-shadow: none; break-inside: avoid; }
    /* 网格在打印下回退单列（!important 压过后面才定义的基础网格样式） */
    .report-flow { display: block !important; }
    .report-flow .report-step { margin-bottom: 14px; }
    /* 黑白友好：彩色标签/横幅转为描边样式 */
    .ri-tag, .verdict-banner, .eval-tag, .pdot { background: none !important; }
    .ri-tag, .verdict-banner, .eval-tag { color: #000 !important; border: 1px solid #666 !important; }
    .lesson-banner { border: 1px solid #999; background: none; }
    .step-card { box-shadow: none; border: 1px solid var(--border); }
    .report-flow { max-width: none; }
  }

  /* ===================================================================== */
  /* 以下样式从 决策复盘工具箱 移植（决策工具箱里没有的部分） */
  /* ===================================================================== */
.question-box { background: var(--accent-soft); border-left: 3px solid var(--accent);
                  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 12px 16px; margin: 16px 0; font-size: 14px; }
.question-box strong { color: var(--accent); }
.report-item .ri-concl { color: var(--text-secondary); }
.report-item .ri-concl.empty { color: var(--text-muted); font-style: italic; }
/* 编辑已保存报告时的提示条：说明会覆盖哪一份，并给一个随时退出的出口 */
  .edit-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
                 background: var(--accent-soft); border: 1px solid #c9d9f8; border-radius: var(--radius-sm);
                 padding: 9px 14px; margin-bottom: 12px; font-size: 13px; color: #1b3f9e; }
.edit-banner .btn { padding: 5px 14px; font-size: 12.5px; }
/* 决策切换器（逐决策步骤顶部） */
  .dec-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dashed var(--border); }
.dec-bar.sm { margin-bottom: 12px; padding-bottom: 10px; }
.dec-bar.sm .dec-pill { max-width: 200px; padding: 4px 10px; font-size: 11.5px; }
.dec-pill { max-width: 320px; }
.dec-pill-txt { overflow: hidden; text-overflow: ellipsis; }
/* 斜角切换键（页签 / 阶段键）统一造型：向左倾的斜角标签 + 1px 同色描边 + 上圆角。
     斜边用 skewX 实现（竖边倾斜、上下边仍水平，底边贴着面板线不动），
     内层 span 反向 skew 把文字摆正。 */
  .bevel-btn {
    border: 1px solid var(--bc); border-radius: 6px 6px 0 0; background: var(--bf, #fff);
    color: var(--bc); cursor: pointer; font-family: inherit; padding: 0;
    transform: skewX(-16deg); transform-origin: bottom left;
    transition: background 0.12s, color 0.12s;
  }
.bevel-btn > span {
    display: block; font-size: 13px; font-weight: 600; padding: 4px 15px 5px;
    transform: skewX(16deg); transform-origin: bottom left;
  }
.aux-subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
.review-col.aux { gap: 0; }
/* 右侧回顾栏：阶段 / 环节两级快速定位。沿用斜切角按键，配色取对应板块主题色 */
  .rv-jump { padding: 10px 14px 9px; background: #fcfbfa; border-bottom: 1px dashed var(--border); }
.rv-jump-row { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
.rv-jump-row + .rv-jump-row { margin-top: 6px; }
.rv-jump-cap { flex: 0 0 24px; font-size: 10.5px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.04em; }
.rv-phase { --bc: var(--pc); --bt: var(--pt); }
.rv-phase > span { font-size: 12px; font-weight: 600; padding: 4px 13px 5px; }
.rv-stage > span { font-size: 11.5px; padding: 4px 12px 5px; }
.rv-sec > span { font-size: 11px; padding: 3px 10px 4px; }
.rv-phase:hover:not(:disabled), .rv-phase.active { --bf: var(--bt); }
.rv-phase:disabled { --bc: #b9b5af; --bf: #f3f2f0; cursor: not-allowed; }
.rv-phase:disabled > span { color: var(--text-muted); }
.locked .yn-btn, .locked .as-btn, .locked .radio-option, .locked .list-add, .locked .row-remove,
  .locked .score-btn, .locked .chip, .locked .qcell-pick, .locked .eval-sel { pointer-events: none; }
.sub-title { font-size: 13.5px; font-weight: 700; color: var(--text); border-left: 3px solid var(--accent); padding-left: 8px; padding-top: 2px; }
.field-label-row { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
.help-btn { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border); background: #fff; color: var(--accent); font-size: 11px; font-weight: 700; cursor: pointer; line-height: 1; flex-shrink: 0; padding: 0; }
.help-btn:hover { border-color: var(--accent); }
/* 判定后就地展开的追问清单：两条并排，只有一条时占满整宽 */
  .as-notes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px;
              margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.as-notes > .as-note:only-child { grid-column: 1 / -1; }
.as-note-cap { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
/* ---------- luck-box 特有：四象限坐标图 ---------- */
  .quad-chart {
    display: grid;
    grid-template-columns: 26px 1fr 1fr;
    grid-template-rows: 1fr 1fr 26px;
    gap: 8px;
  }
.q-yaxis {
    grid-column: 1; grid-row: 1 / 3;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 4px 0;
  }
.q-yaxis .ylab { font-size: 11px; font-weight: 700; color: var(--text-muted); }
.q-yaxis .ytitle { writing-mode: vertical-rl; font-size: 11.5px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.15em; }
.q-xaxis {
    grid-column: 2 / 4; grid-row: 3;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px;
  }
.q-xaxis .xlab { font-size: 11px; font-weight: 700; color: var(--text-muted); }
.q-xaxis .xtitle { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.15em; }
.qcell {
    border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px;
    background: #fcfbfa; min-height: 150px; display: flex; flex-direction: column;
  }
.qc-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 4px; flex-wrap: wrap; }
.qc-num { font-size: 11px; font-weight: 700; color: var(--text-muted); }
.qc-name { font-size: 14.5px; font-weight: 700; }
.qc-axis { font-size: 10.5px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
.qc-def { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.qc-ex { font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px; }
.qc-ex b { color: var(--text-secondary); font-weight: 600; }
.qcell textarea { min-height: 52px; font-size: 12.5px; flex: none; resize: none; overflow: hidden; }
.cell-deserved .qc-name { color: var(--success); }
.cell-goodluck .qc-name { color: var(--warning); }
.cell-badluck .qc-name { color: var(--accent); }
.cell-fault .qc-name { color: var(--danger); }
.qcell-pick { cursor: pointer; position: relative; transition: all 0.12s; justify-content: flex-start; }
.qcell-pick:hover { border-color: var(--accent); }
.qcell-pick.checked { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px rgba(26,86,219,0.18); }
.qcell-pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.qc-pickmark { font-size: 11px; color: var(--accent); font-weight: 700; margin-top: auto; padding-top: 6px; visibility: hidden; }
.qcell-pick.checked .qc-pickmark { visibility: visible; }
/* 只读矩阵（右栏基准页签）：紧凑适配窄栏 */

.yn-btn.picked-yes { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- knowledge-tracker 特有：概念卡 / 四栏知识流程 ---------- */
  .concept-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 26px; }

.kt-col .list-empty-hint { font-size: 11.5px; }
/* ---------- counterfactual 特有：决策树 / 概率徽标 / 好坏标注 ---------- */
  .prob-badge { display: inline-block; font-size: 11px; color: var(--text-muted); border: 1px solid var(--border);
                border-radius: 999px; padding: 0 8px; margin-left: 6px; white-space: nowrap; }
.dtflow { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.9fr); gap: 14px; align-items: start; }
.dt-decision, .dt-branches { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: #fff; min-width: 0; }
.dt-decision h5, .dt-branch-head { font-size: 12.5px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 8px; font-weight: 700; }
.dt-decision .dt-text { font-size: 13px; color: var(--text-secondary); }
.dt-actual { margin-top: 10px; border: 1px solid #f2e3b3; background: #fffbeb; border-radius: var(--radius-sm); padding: 8px 10px; font-size: 12.5px; color: var(--text-secondary); display: flex; gap: 10px; align-items: flex-start; }
.dt-actual .dt-actual-main { flex: 1; min-width: 0; }

/* 实际分支文本与潜在结果行的 textarea 同款样式（虚线下划线、同字号内边距），保持两行版式一致 */

  .dt-actual { margin-right: -11px; }

.dt-actual .dt-actual-text { padding-left: 13px; }
.eval-tag { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-top: 1px; white-space: nowrap; }

.dt-input-row { display: flex; gap: 8px; align-items: flex-start; }
/* s5 合并区块：标注更好的潜在结果 + 该决策评分 */
  .bs-block { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; background: #fff; }

.dt-input-row textarea { flex: 1; min-width: 0; width: auto; }

.pair-rows { display: flex; flex-direction: column; gap: 14px; }

.pair-arrow { display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 18px; padding-top: 18px; }
.kt-syncnote { font-size: 11.5px; color: var(--text-muted); margin-bottom: 6px; }
/* ---------- 基准库 ---------- */
  .base-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                  padding: 24px 28px; box-shadow: var(--shadow); margin-bottom: 18px; }
.base-section h2 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.base-section .base-src { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
.quadrant-banner { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.qb-deserved { background: var(--success-soft); color: var(--success); }
.qb-goodluck { background: var(--warning-soft); color: var(--warning); }
.qb-badluck { background: var(--accent-soft); color: var(--accent); }
.qb-fault { background: #fbeaea; color: var(--danger); }
/* 全屏回顾：一步一栏、左右成对（左 1 右 2、左 3 右 4…），阶段标题横跨两栏。
     同一排的两张卡片等高，较短的那张用下方留白补齐，整页看起来才齐整；窄屏与打印仍是单列 */
  .report-flow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
.report-flow > .report-phase { grid-column: 1 / -1; }
.report-flow > .report-step { break-inside: avoid; }

  @media (max-width: 1364px) {
  .report-flow { grid-template-columns: 1fr; }
}
/* 报告里每一步沿用向导的字段（locked 只读），只把留白收紧，便于快速回看 */
  .report-step { margin-bottom: 0; }
/* 间距交给 .report-flow 的 grid gap */
  .report-step .step-head { padding: 14px 20px 12px; }
.report-step .step-head h2 { font-size: 17px; }
.report-step .step-head .tag { margin-bottom: 6px; }
/* 拆成逐决策卡片时，标题后面挂一个决策编号，两张并排也能一眼分清是哪一条 */
  .dec-chip { display: inline-block; margin-left: 8px; vertical-align: 2px; font-size: 11.5px; font-weight: 600;
              color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }
.report-step .step-body { padding: 14px 20px 16px; }
.report-step .field { margin-bottom: 14px; }
.report-step .half-row { gap: 16px; margin-bottom: 14px; }
.report-step .meta-note { margin-bottom: 10px; padding: 7px 10px; }
.report-step .sub-title { font-size: 13px; margin-bottom: 8px; }
.report-step .list-row { padding: 8px 10px; }
.report-step .as-row { padding: 10px 12px; margin-bottom: 8px; }
.report-step .as-notes { margin-top: 8px; padding-top: 8px; }
.report-step .bs-block { padding: 12px 14px; }
.report-step .bs-sec { margin-top: 10px; padding-top: 10px; }
.report-step .dec-bar { display: none; }
/* 报告里逐决策全展开，不需要切换 pill */
  /* 增删按钮只读态用不上，隐掉更干净也省空间 */
  .report-step .list-add, .report-step .row-remove { display: none; }
/* 回顾时不要“磨砂”式的淡化：字段按正常对比度直接呈现内容 */
  .report-step .locked { opacity: 1; }
.report-step .locked input, .report-step .locked textarea {
    background: #fcfbfa; border-color: var(--border); color: var(--text); box-shadow: none !important;
  }
/* 过程提示文字（步骤说明、填写提示、“已带入·只读”）在回顾里是噪音，直接去掉 */
  .report-step .meta-note, .report-step .field-hint, .report-step .kt-cap,
  .report-step .kt-syncnote, .report-step .list-empty-hint { display: none; }
.report-step .qcell { min-height: 96px; }
.report-step .kt-col { padding: 8px 10px; }
.report-step .radio-option { padding: 8px 12px; }
.report-step .score-btn { width: 34px; height: 34px; font-size: 14px; }
.report-step .field-hint { margin-top: 3px; }
.report-step .review-body { padding: 12px 14px 14px; }
.rv-sub { font-size: 13px; font-weight: 700; color: var(--text); border-left: 3px solid var(--accent);
            padding-left: 8px; margin: 16px 0 10px; }
.rv-as-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.6; }
.rv-yn { font-size: 13.5px; margin-bottom: 6px; }
.rv-yn b { font-weight: 600; }

  @media (max-width: 920px) {
  .ktflow { grid-template-columns: 1fr; }
  .kt-arrow { transform: rotate(90deg); height: 18px; }
}

  @media (max-width: 640px) {
  .hero, .report-list, .step-head, .step-body, .report-head, .report-section, .base-section { padding-left: 18px; padding-right: 18px; }
  .dtflow { grid-template-columns: 1fr; }
  .concept-grid { grid-template-columns: 1fr; }
  .as-notes { grid-template-columns: 1fr; gap: 10px; }
  .pair-row { grid-template-columns: 1fr; }
  .pair-arrow { transform: rotate(90deg); padding: 0; justify-content: flex-start; }
}

  /* ---------- 全流程新增：两阶段阶段条 / 同步提示 ---------- */
  .pg-label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.04em; }
  .pg-label:not(:first-child) { margin-left: 10px; }
  .flow-cap { font-size: 12.5px; color: var(--text-secondary); margin: 14px 0 8px; }
  .sync-note { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
               background: #e6f4f7; border: 1px dashed #9ec9d4; color: #0e7490;
               border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12.5px; margin-bottom: 14px; }
  .sync-note .sn-txt { flex: 1 1 auto; min-width: 62%; line-height: 1.6; }
  .sync-note .sn-txt b { font-weight: 700; }
  .sync-note .btn-edit { flex: 0 0 auto; margin-left: auto; background: #fff; color: #0e7490; border-color: #9ec9d4; }
  .sync-note .btn-edit:hover { border-color: #0e7490; }
  .list-note { font-size: 12.5px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.7; }
  .list-foot { display: flex; align-items: flex-start; gap: 14px; justify-content: space-between; flex-wrap: wrap;
               margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border);
               font-size: 12.5px; color: var(--text-muted); line-height: 1.7; }
  .list-foot > span:first-child { flex: 1 1 320px; min-width: 280px; }
  .list-foot code { background: #f2f0ec; border-radius: 3px; padding: 1px 5px; font-size: 11.5px; }
  .edit-bar .eb-txt { flex: 1; min-width: 0; line-height: 1.7; }
  .edit-bar.auto { background: var(--success-soft); border-color: #bfe0c8; color: var(--success); }
  .edit-bar.auto .btn-edit { color: var(--success); border-color: #bfe0c8; }
  .edit-bar.auto .btn-edit:hover { border-color: var(--success); }

  .edit-bar.auto .btn-edit.danger:hover { background: #9e2222; border-color: #9e2222; }

<div class="container" id="app"></div>

<script>
"use strict";

/* =====================================================================
 * 一、决策阶段 · 模块配置
 *   （四个源工具的 TOOL 配置近乎原样移植自 辅助决策工具箱，读写落点仍是模块作用域）
 * ===================================================================== */

/* ---------- 模块一：决策速度（移植自 decision-pacing，第七章，原 ls 前缀 dp2） ---------- */
const MOD_DP = {
  id: "dp",
  name: "决策速度",
  chapter: "第七章",
  src: "《对赌（实践版）》第七章 · 时间与准确性的权衡",
  desc: "源自第七章「快速决策指南」。沿分支树逐题判断这个决策该快还是该慢：结果对幸福感影响有多大、是否可逆、放弃的代价高不高。影响力有限、可逆、可重复的决策不值得反复纠结——快速决定，把时间省下来。只有真正重要又难以回头的决策，才值得进入后面的慢流程。",
  color: "#1a56db",
  reportName: "快速决策指南报告",
  titleKey: "title",
  titleStep: "s1",
  titleNote: "请先陈述这个决策",
  conclusionKey: "conclusion",
  conclusionLabel: "一句话结论",
  skipEmptySection: true,
  steps: [
    { id: "s1", title: "锚定决策", tag: "明确对象", need: "title", needHint: "请先陈述这个决策", desc: "陈述要判断节奏的决策，并描述当前处境。" },
    { id: "q1", title: "这个决策是否通过了幸福感测验？", tag: "图1 · 低影响力", need: "hap_pass", needHint: "请先回答：是否通过了幸福感测验", desc: "" },
    { id: "q2", title: "它属于重复性决策吗？", tag: "图1 · 重复性选择", need: "repeat", needHint: "请先回答这个问题", desc: "" },
    { id: "q3", title: "它属于“但试无妨”的情况吗？", tag: "图1 · 下行风险", need: "freeway", needHint: "请先回答这个问题", desc: "" },
    { id: "q4", title: "这个决策是“披着狼皮的羊”吗？", tag: "图1 · 相近选项", need: "sheep", needHint: "请先回答这个问题", desc: "" },
    { id: "q6", title: "你能以合理的代价放弃这个决策吗？", tag: "图1 · 主动放弃", need: "exit", needHint: "请先回答这个问题", desc: "" },
    { id: "q5", title: "你可以同时做出多个选择吗？", tag: "图1 · 同时多选", need: "parallel", needHint: "请先回答这个问题", desc: "" },
    { id: "q7", title: "你可以进行渐进式决策吗？", tag: "图1 · 渐进式", need: "gradual", needHint: "请先回答这个问题", desc: "" },
    { id: "t_fast", title: "终点：快速决策", tag: "图1 · 结论", desc: "" },
    { id: "t_soon", title: "终点：尽快作出决定", tag: "图1 · 结论", desc: "" },
    { id: "t_gradual", title: "终点：先做一些影响小的决策", tag: "图1 · 结论", desc: "" },
    { id: "t_slow", title: "终点：放慢速度！", tag: "图1 · 结论", desc: "" },
    { id: "q8", title: "有没有什么信息能让你改变决定？", tag: "图2 · 决策最后一步", need: "info", needHint: "请先回答这个问题", desc: "" },
    { id: "q9", title: "我负担得起吗？", tag: "图2 · 信息的代价", need: "afford", needHint: "请先回答这个问题", desc: "" },
    { id: "s_end", title: "一句话结论", tag: "收尾", desc: "" }
  ],
  // 快速决策指南（图1）分支树 + 决策最后一步（图2）。
  // 路径只延伸到第一个未回答的分支问题为止；不在路径上的答案保留在 values 中。
  pathIds: function (v) {
    const answered = k => v[k] === "yes" || v[k] === "no";
    const p = ["s1"];
    if (!String(v.title || "").trim()) return p;
    p.push("q1");
    if (!answered("hap_pass")) return p;
    if (v.hap_pass === "yes") {
      p.push("q2");
      if (!answered("repeat")) return p;
      // 通过幸福感测验：重复性选择 → 快速决策；非重复性 → 直接闭环，尽快作出决定
      p.push(v.repeat === "yes" ? "t_fast" : "t_soon");
    } else {
      p.push("q3");
      if (!answered("freeway")) return p;
      if (v.freeway === "yes") {
        p.push("t_fast");
      } else {
        p.push("q4");
        if (!answered("sheep")) return p;
        if (v.sheep === "yes") {
          p.push("q5");
          if (!answered("parallel")) return p;
          p.push(v.parallel === "yes" ? "t_fast" : "t_soon");
        } else {
          p.push("q6");
          if (!answered("exit")) return p;
          if (v.exit === "yes") {
            p.push("q5");
            if (!answered("parallel")) return p;
            p.push(v.parallel === "yes" ? "t_fast" : "t_soon");

/* ---------- 模块二：六步决策（移植自 six-step，第四章，原 ls 前缀 ss2） ---------- */
/* 决策清单 = 第 1 个“本次决策” + 其余候选：
   第 1 个决策由决策速度第 1 步的决策陈述同步而来（存在 title，见 syncDecisionText），不进候选数组；
   decisions 只放用户在本步追加、或从决策速度“披着狼皮的羊”环节带入的候选决策。 */
function decisionsOf(vals) {
  const head = String(vals.title || "").trim();
  const rest = (Array.isArray(vals.decisions) ? vals.decisions : [])
    .filter(d => (d && (d.t || "").trim()) && String(d.t).trim() !== head);
  return head ? [{ t: head }].concat(rest) : rest;
}
/* 最终选择支持多选：值存成 { d0: "yes", d2: "yes" }；旧的单选值（"d1"）照旧能读 */
function finalPicks(v) {
  const raw = v ? v.final_pick : null;
  const keys = (raw && typeof raw === "object")
    ? Object.keys(raw).filter(k => raw[k] === "yes")
    : (typeof raw === "string" && raw ? [raw] : []);
  return keys.map(k => Number((/^d(\d+)$/.exec(k) || [])[1])).filter(i => i >= 0).sort((a, b) => a - b);
}
/* 多选字段里已勾选的选项文字（兼容旧的单选字符串值） */
function pickedOptionTexts(f, val) {
  const on = (val && typeof val === "object") ? val : (typeof val === "string" && val ? { [val]: "yes" } : {});
  return (f.options || []).filter(o => on[o[0]] === "yes").map(o => o[1]);
}
function optListD(vals, di) { return (Array.isArray(vals["options_d" + di]) ? vals["options_d" + di] : []).filter(o => (o && (o.t || "").trim())); }
function trunc(s, n) {
  s = String(s || "").replace(/\s+/g, " ").trim();
  return s.length > n ? s.slice(0, n) + "…" : s;
}

/* ---------- 模块三：内外视角（移植自 perspective，第六章，原 ls 前缀 pv） ---------- */
/* ---------- 内外视角：多组观点追踪（vt_groups 与 cal_groups 索引对齐） ---------- */
function pvNorm(v) {
  if (!v || typeof v !== "object") return v;
  /* 旧结构兼容：单组的外/内视角与校准结论包装成第 1 组（不丢历史数据） */
  if (!Array.isArray(v.vt_groups)) {
    const out = Array.isArray(v.outside_views) ? v.outside_views : [];
    const ins = Array.isArray(v.inside_views) ? v.inside_views : [];
    const cal = { same_way: v.same_way || "", deviate: v.deviate || "", calibrated: v.calibrated || "", conclusion: v.conclusion || "" };
    const hasVt = out.length || ins.length;
    const hasCal = Object.keys(cal).some(k => String(cal[k] || "").trim());
    v.vt_groups = hasVt ? [{ name: "", outside_views: out, inside_views: ins }] : [];
    v.cal_groups = hasCal ? [cal] : [];
    delete v.outside_views; delete v.inside_views;
    delete v.same_way; delete v.deviate; delete v.calibrated; delete v.conclusion;
  }
  if (!Array.isArray(v.cal_groups)) v.cal_groups = [];
  if (!v.vt_groups.length) v.vt_groups.push({ name: "", outside_views: [], inside_views: [] });
  v.vt_groups = v.vt_groups.map(g => (g && typeof g === "object") ? g : {});
  v.vt_groups.forEach(g => {
    if (!Array.isArray(g.outside_views)) g.outside_views = [];
    if (!Array.isArray(g.inside_views)) g.inside_views = [];
    if (g.name == null) g.name = "";
  });
  v.cal_groups = v.cal_groups.map(g => (g && typeof g === "object") ? g : {});
  while (v.cal_groups.length < v.vt_groups.length) v.cal_groups.push({});
  if (v.cal_groups.length > v.vt_groups.length) v.cal_groups.length = v.vt_groups.length;
  return v;
}
function pvVtGroups(v) { pvNorm(v); return Array.isArray(v.vt_groups) ? v.vt_groups : []; }
function pvGroupName(g, i) {
  const n = String((g && g.name) || "").trim();
  return n || ("观点 " + (i + 1));
}
/* 取某一组的数据对象（kind: "vt" | "cal"），create=false 时不存在则返回空对象 */
function pvGroupObj(mv, kind, i, create) {
  if (!mv || typeof mv !== "object") return {};
  pvNorm(mv);
  const arr = kind === "cal" ? mv.cal_groups : mv.vt_groups;
  const idx = Number(i) || 0;
  if (arr[idx] && typeof arr[idx] === "object") return arr[idx];
  if (!create) return {};
  arr[idx] = kind === "cal" ? {} : { name: "", outside_views: [], inside_views: [] };
  return arr[idx];
}
/* 各组结论汇总（报告章末用） */
function pvConclusions(mv) {
  pvNorm(mv);
  const parts = [];
  mv.cal_groups.forEach((g, i) => {
    const c = String((g && g.conclusion) || "").trim();
    if (c) parts.push(pvGroupName(mv.vt_groups[i], i) + "：" + c);
  });
  return parts.join("；");
}

/* 复盘阶段的综合判定（与复盘工具箱同一口径） */
function rvVerdict(v) {
    const fq = v.final_quadrant || v.quadrant;
    const qs = Object.keys(v).filter(k => /^quality(_\d+)?$/.test(k) && v[k] != null && v[k] !== "")
      .map(k => Number(v[k])).filter(n => !isNaN(n));
    const parts = [];
    if (fq && QUADS[fq]) {
      let qTxt = "最终象限「" + QUADS[fq].name + "」";
      if (v.quadrant && QUADS[v.quadrant]) {
        qTxt += fq === v.quadrant ? "（与初步判断一致）" : "（初步判断「" + QUADS[v.quadrant].name + "」，已修正）";
      }
      parts.push(qTxt);
    }
    const lss = Object.keys(v).filter(k => /^luck_share_\d+$/.test(k) && v[k]).map(k => v[k]);
    if (lss.length) {
      const short = { luck: "主要靠运气", half: "运气与决策各半", skill: "主要靠决策质量" };
      const counts = {};
      lss.forEach(x => { counts[x] = (counts[x] || 0) + 1; });
      const order = ["luck", "half", "skill"];
      parts.push(lss.length + " 个决策归因：" + order.filter(x => counts[x]).map(x => short[x] + " × " + counts[x]).join("、"));
    }
    if (qs.length) parts.push("决策质量平均 " + (Math.round(qs.reduce((a, b) => a + b, 0) / qs.length * 10) / 10) + "/5");
    const rps = Object.keys(v).filter(k => /^repeat_\d+$/.test(k) && v[k]).map(k => v[k]);
    if (rps.length) {
      const yes = rps.filter(x => x === "yes").length;
      parts.push("重来一次：" + rps.length + " 个决策中 " + yes + " 个会做同样决策");
    }
    const asKeys = Object.keys(v).filter(k => /^assess_\d+$/.test(k) && v[k]);
    if (asKeys.length) {
      let tot = 0, cYes = 0, cPart = 0, cNo = 0;
      asKeys.forEach(k => {
        const idx = k.slice(7);
        const rows = (Array.isArray(v["learned_after_" + idx]) ? v["learned_after_" + idx] : []).filter(x => (x.t || "").trim());
        const ans = v[k] || {};
        rows.forEach((row, ri) => {
          tot++;
          const a = ans["i" + ri];
          if (a === "yes") cYes++; else if (a === "part") cPart++; else if (a === "no") cNo++;
        });
      });
      if (tot) parts.push("后视检验（" + tot + " 条）：合理可知 × " + cYes + "、部分可知 × " + cPart + "、当时不可知 × " + cNo);
    }
    /* 视角校准按观点追踪组统计（不再是逐决策各一套） */
    rvViewNorm(v);
    let calTotal = 0, calDone = 0;
    (v.vt || []).forEach((g, gi) => {
      if (!g || typeof g !== "object") return;
      calTotal++;
      const c0 = (v.cal || [])[gi];
      if (c0 && String(c0.cal || "").trim()) calDone++;
    });
    parts.push(!calTotal || calDone === 0 ? "视角未校准"
      : calDone === calTotal ? "视角已校准（全部 " + calTotal + " 组）"
      : "视角部分校准（" + calDone + "/" + calTotal + " 组）");
    if (!parts.length) return { t: "未完成", cls: "vb-neutral" };
    const clsMap = { deserved: "vb-success", badluck: "vb-accent", goodluck: "vb-warning", fault: "vb-warning" };
    return { t: parts.join(" · "), cls: (fq && clsMap[fq]) || "vb-neutral" };
}

/* 复盘阶段「内外视角 / 视角校准」围绕整次复盘进行，不再按决策拆分。
   旧数据的 vt_0/cal_0、vt_1/cal_1… 在读取时合并成 vt / cal 两组索引对齐的数组。 */
function rvViewNorm(v) {
  if (!v || typeof v !== "object") return v;
  const oldVt = Object.keys(v).filter(k => /^vt_\d+$/.test(k));
  const oldCal = Object.keys(v).filter(k => /^cal_\d+$/.test(k));
  if (!Array.isArray(v.vt) || (!v.vt.length && (oldVt.length || oldCal.length))) {
    const idxs = [];
    oldVt.forEach(k => idxs.push(Number(k.slice(3))));
    oldCal.forEach(k => { const i = Number(k.slice(4)); if (idxs.indexOf(i) < 0) idxs.push(i); });
    if (idxs.length) {
      idxs.sort((a, b) => a - b);
      const vt = [], cal = [];
      idxs.forEach(i => {
        const gs = Array.isArray(v["vt_" + i]) ? v["vt_" + i] : [];
        const cs = Array.isArray(v["cal_" + i]) ? v["cal_" + i] : [];
        const n = Math.max(gs.length, cs.length);
        for (let j = 0; j < n; j++) {
          vt.push(gs[j] && typeof gs[j] === "object" ? gs[j] : {});
          cal.push(cs[j] && typeof cs[j] === "object" ? cs[j] : {});
        }
      });
      v.vt = vt;
      v.cal = cal;
    }
  }
  oldVt.concat(oldCal).forEach(k => { delete v[k]; });
  if (Array.isArray(v.vt)) {
    v.vt = v.vt.map(g => (g && typeof g === "object") ? g : {});
    v.vt.forEach(g => {
      if (!Array.isArray(g.out)) g.out = [];
      if (!Array.isArray(g.in)) g.in = [];
      if (g.name == null) g.name = "";
    });
    if (!Array.isArray(v.cal)) v.cal = [];
    v.cal = v.cal.map(g => (g && typeof g === "object") ? g : {});
    while (v.cal.length < v.vt.length) v.cal.push({});
    if (v.cal.length > v.vt.length) v.cal.length = v.vt.length;
  } else if (Array.isArray(v.cal)) {
    v.cal = v.cal.map(g => (g && typeof g === "object") ? g : {});
    if (v.cal.length) v.vt = v.cal.map(() => ({ name: "", out: [], in: [] }));
  }
  return v;
}
