      { key: "final_note", label: "如果调整了判断，说明你重新评估了什么；如果维持，也写下支持你的理由。", type: "textarea" }
    ];
    if (stepId === "s11") {
      if (!decPairs(v).length) return [
        { type: "note", label: "还没有“决策 → 结果”", text: "请先在第 1 步填写决策与实际结果，这里会对每个决策分别做改进自查与教训提炼。" }
      ];
      const fs11 = [];
      if (!v.result_eval) fs11.push({ type: "note", label: "按结果方向提炼教训", text: "请回到第 1 步为整体结局选择「好结果 / 差结果」，每个决策的教训题会按方向生成。" });
      decList(v, onlyIdx).forEach(x => {
        const p = x.p, i = x.i;
        fs11.push({ type: "subtitle", label: "决策 " + (i + 1) + "：" + (p.d || "（未填）"), rv: true });
        fs11.push({ key: "improve_" + i, label: "改进空间自查（回答“是”后，请在问题下方写出原因和改进动作）", type: "yesno", items: IMPROVE_QS,
          hint: "就算你做出了一个好决策，也不意味着它就是最佳决策。不要认为事情成功了就没有教训可学。" });
        fs11.push({ key: "keep_" + i, label: "哪些做法值得在同类决策中固定下来？", type: "textarea",
          placeholder: "例：对关键不确定因素先做小成本实地体验。",
          showIf: (vv) => vv.result_eval === "good" });
        fs11.push({ key: "improve_good_" + i, label: "好结果也有改进空间：哪里还能做得更好？", type: "textarea",
          placeholder: "例：当时可以多比较一个选项。",
          showIf: (vv) => vv.result_eval === "good" });
        fs11.push({ key: "repeat_worth_" + i, label: "剥离运气之后，这个决策值得重复吗？", type: "textarea",
          placeholder: "例：值得——同样的信息条件下，任何合理的人都会这么做。",
          showIf: (vv) => vv.result_eval === "bad" });
        fs11.push({ key: "hedge_" + i, label: "同类的坏运气再来一次，可以提前做什么准备？", type: "textarea",
          placeholder: "例：先租房一年再决定长住。",
          showIf: (vv) => vv.result_eval === "bad" });
      });
      return fs11;
    }
    if (stepId === "s12") return [
      { key: "conclusion", label: "一句话结论：把这次复盘最想带走的东西写成一句话", type: "textarea",
        placeholder: "例：结果糟不代表决策错——先分清运气和能力，再决定要不要重复这个决策。" }
    ];
    return [];
}

/* 按 pairs 逐决策生成的步骤（阶段二、三）；这些步骤顶部显示决策切换器。
   s8 内外视角、s9 视角校准围绕整次复盘进行，不再逐决策拆分。 */
const DEC_STEP_IDS = ["s3", "s4", "s6", "s7", "s11"];
function decPairs(v) {
  return (Array.isArray(v.pairs) ? v.pairs : []).filter(p => (p.d || "").trim() || (p.r || "").trim());
}
/* 逐决策分支通用：onlyIdx == null 输出全部决策，否则只输出该下标（key 下标与原 pairs 位置一致） */
function decList(v, onlyIdx) {
  const ps = decPairs(v);
  return onlyIdx == null ? ps.map((p, i) => ({ p: p, i: i })) : (ps[onlyIdx] ? [{ p: ps[onlyIdx], i: onlyIdx }] : []);
}

/* ---------- 复盘阶段：字段渲染与事件（随复盘工具箱移植，读写落在 values.rv） ---------- */
/* ---------- 字段渲染 ---------- */
function rvRenderFields(fields, locked, vtGroup) {
  let html = "";
  let buf = [];
  const flush = () => {
    if (buf.length) { html += '<div class="half-row">' + buf.join("") + '</div>'; buf = []; }
  };
  fields.forEach(f => {
    if (f.showIf && !f.showIf(rvV())) return;
    if (f.half) { buf.push(rvRenderField(f, locked, vtGroup)); if (buf.length === 2) flush(); return; }
    flush();
    html += rvRenderField(f, locked, vtGroup);
  });
  flush();
  return html;
}

function rvRenderField(f, locked, vtGroup) {
  if (f.showIf && !f.showIf(rvV())) return "";
  const lk = locked ? " locked" : "";
  const dis = locked ? " disabled" : "";
  const v = rvV()[f.key];
  let body = "";
  if (f.type === "text") {
    body = '<input type="text" data-scope="rv" data-k="' + f.key + '"' + dis + ' value="' + esc(v || "") + '" placeholder="' + esc(f.placeholder || "") + '">';
  } else if (f.type === "textarea") {
    body = '<textarea data-scope="rv" data-k="' + f.key + '" rows="3"' + dis + ' placeholder="' + esc(f.placeholder || "") + '">' + esc(v || "") + '</textarea>';
  } else if (f.type === "radio") {
    body = '<div class="radio-group' + (f.inline ? " inline" : "") + lk + '">' + f.options.map(op =>
      '<label class="radio-option ' + (v === op[0] ? "checked" : "") + lk + '">' +
        '<input type="radio" name="' + f.key + '" data-scope="rv" data-k="' + f.key + '" value="' + op[0] + '" ' + (v === op[0] ? "checked" : "") + dis + '>' +
        '<span>' + esc(op[1]) + (op[2] ? '<span class="opt-desc">' + esc(op[2]) + '</span>' : "") + '</span>' +
      '</label>').join("") + '</div>';
  } else if (f.type === "score") {
    body = '<div class="score-row' + lk + '">' +
      '<span class="score-endlabel">低</span>' +
      [0,1,2,3,4,5].map(n =>
        '<button type="button" class="score-btn ' + (Number(v) === n ? "checked" : "") + '" data-scope="rv" data-score="' + f.key + '" data-val="' + n + '"' + dis + '>' + n + '</button>'
      ).join("") +
      '<span class="score-endlabel right">高</span>' +
    '</div>';
  } else if (f.type === "list") {
    const rows = Array.isArray(v) ? v : [];
    const rowsHtml = rows.length === 0
      ? (f.emptyHint ? '<div class="list-empty-hint">' + esc(f.emptyHint) + '</div>' : "")
      : '<div class="list-rows">' + rows.map((row, ri) =>
          '<div class="list-row">' +
            '<span class="idx">' + (ri + 1) + '.</span>' +
            '<textarea data-scope="rv" data-lk="' + f.key + '" data-ri="' + ri + '" data-rk="t" rows="1"' + dis + ' placeholder="' + esc(f.itemPlaceholder || "") + '">' + esc(row.t || "") + '</textarea>' +
            '<button type="button" class="row-remove" data-scope="rv" data-rmrow="' + f.key + '" data-ri="' + ri + '" title="删除本条"' + dis + '>×</button>' +
          '</div>').join("") + '</div>';
    body = rowsHtml +
      '<button type="button" class="list-add" data-scope="rv" data-addrow="' + f.key + '"' + dis + '>＋ 添加一条</button>';
  } else if (f.type === "chipslist") {
    const rows = Array.isArray(v) ? v : [];
    const rowsHtml = rows.length === 0
      ? (f.emptyHint ? '<div class="list-empty-hint">' + esc(f.emptyHint) + '</div>' : "")
      : '<div class="list-rows">' + rows.map((row, ri) =>
          '<div class="list-row">' +
            '<span class="idx">' + (ri + 1) + '.</span>' +
            '<div class="grow" style="flex:1;display:flex;flex-direction:column;gap:8px;">' +
              '<textarea data-scope="rv" data-lk="' + f.key + '" data-ri="' + ri + '" data-rk="t" rows="1"' + dis + ' placeholder="' + esc(f.itemPlaceholder || "") + '">' + esc(row.t || "") + '</textarea>' +
              '<div class="row-cmp">' + f.chips.map(ch =>
                '<span class="chip ' + (row.c === ch[0] ? "checked" : "") + '" data-scope="rv" data-chip-lk="' + f.key + '" data-ri="' + ri + '" data-chip="' + ch[0] + '"' + dis + '>' + esc(ch[1]) + '</span>'
              ).join("") + '</div>' +
            '</div>' +
            '<button type="button" class="row-remove" data-scope="rv" data-rmrow="' + f.key + '" data-ri="' + ri + '" title="删除本条"' + dis + '>×</button>' +
          '</div>').join("") + '</div>';
    body = rowsHtml +
      '<button type="button" class="list-add" data-scope="rv" data-addrow="' + f.key + '"' + dis + '>＋ 添加一条</button>';
  } else if (f.type === "assess") {
    const rows = (f.sources || []).reduce((acc, k) => acc.concat((Array.isArray(rvV()[k]) ? rvV()[k] : []).filter(x => (x.t || "").trim())), []);
    if (rows.length === 0) {
      body = '<div class="field-hint">' + esc(f.emptyHint || "请先在前面填写对应的条目，这里会自动生成逐条评定。") + '</div>';
    } else {
      const ans = v || {};
      /* 就地追问清单：与 type:"list" 同一套 markup，data-lk / data-addrow 事件已通用绑定 */
      const noteList = (key, label, ph) => {
        const list = Array.isArray(rvV()[key]) ? rvV()[key] : [];
        const rowsHtml = list.length === 0 ? "" : '<div class="list-rows">' + list.map((r2, ri2) =>
          '<div class="list-row">' +
            '<textarea data-scope="rv" data-lk="' + key + '" data-ri="' + ri2 + '" data-rk="t" rows="1"' + dis + ' placeholder="' + esc(ph) + '">' + esc(r2.t || "") + '</textarea>' +
            '<button type="button" class="row-remove" data-scope="rv" data-rmrow="' + key + '" data-ri="' + ri2 + '" title="删除本条"' + dis + '>×</button>' +
          '</div>').join("") + '</div>';
        return '<div class="as-note' + lk + '"><div class="as-note-cap">' + esc(label) + '</div>' + rowsHtml +
          '<button type="button" class="list-add" data-scope="rv" data-addrow="' + key + '"' + dis + '>＋ 添加一条</button></div>';
      };
      body = rows.map((row, ri) => {
        const a = ans["i" + ri];
        const notes =
          (a === "yes" || a === "part" ? noteList(f.knownKey + "_" + ri, f.knownLabel, f.knownPh) : "") +
          (a === "part" || a === "no" ? noteList(f.hindKey + "_" + ri, f.hindLabel, f.hindPh) : "");
        return '<div class="as-row' + lk + '">' +
          '<div class="as-item">' + (ri + 1) + '. ' + esc(row.t || "") + '</div>' +
          '<div class="as-btns">' +
            f.options.map(op => {
              const pickedCls = a === op[0] ? " " + op[2] : "";
              return '<span class="as-btn' + pickedCls + '" data-scope="rv" data-assess="' + f.key + '" data-i="' + ri + '" data-v="' + op[0] + '"' + dis + '>' + esc(op[1]) + '</span>';
            }).join("") +
          '</div>' +
          (notes ? '<div class="as-notes">' + notes + '</div>' : "") +
        '</div>';
      }).join("");
    }
  } else if (f.type === "triplist") {
    const rows = Array.isArray(v) ? v : [];
    const colPh = kk => { const c = (f.cols || []).find(x => x[0] === kk); return c ? c[1] : ""; };
    const rowsHtml = rows.length === 0
      ? (f.emptyHint ? '<div class="list-empty-hint">' + esc(f.emptyHint) + '</div>' : "")
      : '<div class="list-rows">' + rows.map((row, ri) =>
          '<div class="list-row">' +
            '<span class="idx">' + (ri + 1) + '.</span>' +
            '<div class="grow" style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;">' +
              '<input type="text" data-scope="rv" data-lk="' + f.key + '" data-ri="' + ri + '" data-rk="a"' + dis + ' value="' + esc(row.a || "") + '" placeholder="' + esc(colPh("a")) + '">' +
              '<div class="tri-sub">' +
                '<input type="text" data-scope="rv" data-lk="' + f.key + '" data-ri="' + ri + '" data-rk="b"' + dis + ' value="' + esc(row.b || "") + '" placeholder="' + esc(colPh("b")) + '">' +
                '<input type="text" data-scope="rv" data-lk="' + f.key + '" data-ri="' + ri + '" data-rk="c"' + dis + ' value="' + esc(row.c || "") + '" placeholder="' + esc(colPh("c")) + '">' +
              '</div>' +
            '</div>' +
            '<button type="button" class="row-remove" data-scope="rv" data-rmrow="' + f.key + '" data-ri="' + ri + '" title="删除本条"' + dis + '>×</button>' +
          '</div>').join("") + '</div>';
    body = rowsHtml +
      '<button type="button" class="list-add" data-scope="rv" data-addrow="' + f.key + '"' + dis + '>＋ 添加一条</button>';
  } else if (f.type === "viewtrack_multi") {
    /* 本环节可添加多组观点追踪：vt = [{name, out:[{t}], in:[{t}]}]
       vtGroup != null（按组查看）时只渲染该组 */
    const gKey = f.key;
    const groups = Array.isArray(rvV()[gKey]) ? rvV()[gKey] : [];
    const gIdxList = (vtGroup != null && groups[vtGroup]) ? [vtGroup] : groups.map((g2, gi2) => gi2);
    const cards = gIdxList.map(gi => {
      const g = groups[gi];
      const col = (arrKey, cls, title, hint, ph) => {
        const rows = Array.isArray(g[arrKey]) ? g[arrKey] : [];
        const rowsHtml = rows.length === 0
          ? '<div class="list-empty-hint">点击下方按钮添加一条</div>'
          : '<div class="list-rows">' + rows.map((row, ri) =>
              '<div class="list-row">' +
                '<span class="idx">' + (ri + 1) + '.</span>' +
                '<textarea data-vtg="' + gKey + '" data-gi="' + gi + '" data-gk="' + arrKey + '" data-ri="' + ri + '" rows="2"' + dis + ' placeholder="' + esc(ph) + '">' + esc(row.t || "") + '</textarea>' +
                '<button type="button" class="row-remove" data-vtgrmrow="' + gKey + '" data-gi="' + gi + '" data-gk="' + arrKey + '" data-ri="' + ri + '" title="删除本条"' + dis + '>×</button>' +
              '</div>').join("") + '</div>';
        return '<div class="vt-col ' + cls + '">' +
          '<h4>' + esc(title) + '</h4>' +
          '<div class="vt-hint">' + esc(hint) + '</div>' +
          rowsHtml +
          '<button type="button" class="list-add" data-vtgadd="' + gKey + '" data-gi="' + gi + '" data-gk="' + arrKey + '"' + dis + '>＋ 添加一条</button>' +
        '</div>';
      };
      return '<div class="vt-group' + lk + '">' +
        '<div class="vt-group-head">' +
          '<input type="text" class="vt-group-name" data-vtname="' + gKey + '" data-gi="' + gi + '"' + dis + ' value="' + esc(g.name || "") + '" placeholder="给这组观点追踪起个名，如：请教了同事 / 行业基准">' +
          '<button type="button" class="row-remove" data-vtgrm="' + gKey + '" data-gi="' + gi + '" title="删除本组"' + dis + '>×</button>' +
        '</div>' +
        '<div class="vt-grid">' +
          col("out", "vt-outside", "外视角", "尽可能从旁观者的角度描述你的处境", "例：如果朋友遇到同样的问题，我会劝他……；同类情况的基准数是……") +
          col("in", "vt-inside", "内视角", "尽可能从自己的角度描述你的处境", "例：从我的经历来看，我觉得……") +
        '</div>' +
      '</div>';
    }).join("");
    body = (vtGroup != null
      ? cards
      : (groups.length === 0
        ? '<div class="list-empty-hint">还没有观点追踪组。点击下方按钮添加一组（如“同事的建议”“行业基准”），逐组对照内外视角。</div>'
        : cards)) +
        '<button type="button" class="list-add" data-vtgaddgrp="' + gKey + '"' + dis + '>＋ 添加一组观点追踪</button>';
  } else if (f.type === "calgroup") {
    /* 视角校准：按观点追踪组逐组生成校准块，cal = [{same, deviate, cal}]
       groupsKey 指向观点追踪数组（新数据是 vt，旧数据兼容 vt_i）；vtGroup != null 时只渲染该组 */
    const groups = Array.isArray(rvV()[f.groupsKey || ("vt_" + f.index)]) ? rvV()[f.groupsKey || ("vt_" + f.index)] : [];
    if (!groups.length) {
      body = '<div class="field-hint">请先在「内外视角」步骤添加观点追踪组，这里会按组生成校准块。</div>';
    } else {
      const cals = Array.isArray(rvV()[f.key]) ? rvV()[f.key] : [];
      const gIdxList = (vtGroup != null && groups[vtGroup]) ? [vtGroup] : groups.map((g2, gi2) => gi2);
      body = gIdxList.map(gi => {
        const g = groups[gi];
        const title = (g.name || "").trim() ? g.name : "观点追踪 " + (gi + 1);
        const c = cals[gi] || {};
        const ta = (ck, label, ph) =>
          '<div class="field" style="margin-bottom:14px;"><label class="field-label" style="font-size:12.5px;">' + esc(label) + '</label>' +
          '<textarea data-calk="' + f.key + '" data-gi="' + gi + '" data-ck="' + ck + '" rows="2"' + dis + ' placeholder="' + esc(ph) + '">' + esc(c[ck] || "") + '</textarea></div>';
        return '<div class="vt-group' + lk + '">' +
          '<div class="bs-cap">' + esc(title) + '</div>' +
          ta("same", "1. 结合内外视角，看看描述中有哪些完全相同的地方。", "例：两边都承认“客流不稳定”是核心风险——这一点最可信。") +
          ta("deviate", "2. 偏离的部分：是你的处境确实特殊，还是内视角的盲点？", "例：我认为“我的行业不一样”——但基准数覆盖了同类行业，这更可能是内视角的盲点……") +
          ta("cal", "3. 校准后更准确的判断", "例：这件事成功的基准概率约 40%，我的条件略好，估计 50% 左右；先小成本验证再加大投入。") +
        '</div>';
      }).join("");
    }
  } else if (f.type === "quadpick") {
    body = quadChartPick(f.key, locked);
  } else if (f.type === "quadpair") {
    const pair = rvV().quadrant ? [rvV().quadrant, QUAD_COUNTERPART[rvV().quadrant]] : [];
    body = pair.length === 0
      ? '<div class="field-hint">请先在第 2 步选定初步象限，这里会在结果相同的两个象限之间二选一。</div>'
      : '<div class="radio-group' + lk + '">' + pair.map(k => {
          const qd = QUADS[k];
          const checked = v === k || (v == null && k === rvV().quadrant);
          return '<label class="radio-option ' + (checked ? "checked" : "") + lk + '">' +
            '<input type="radio" name="' + f.key + '" data-scope="rv" data-k="' + f.key + '" value="' + k + '"' + (checked ? " checked" : "") + dis + '>' +
            '<span><strong>' + esc(qd.name) + '</strong>（' + esc(qd.axis) + '）' +
            '<span class="opt-desc">' + esc(qd.def) + '</span></span>' +
          '</label>';
        }).join("") + '</div>';
  } else if (f.type === "yesno") {
    const ans = v || {};
    body = f.items.map((qtext, i) => {
      const a = ans["i" + i];
      let note = "";
      if (a === "yes") {
        note = '<div class="yn-note"><textarea data-ynnote="' + f.key + '" data-i="' + i + '" rows="2"' + dis +
          ' placeholder="为什么是？对应的改进动作是什么？">' + esc(ans["n" + i] || "") + '</textarea></div>';
      }
      return '<div class="yn-block' + lk + '">' +
        '<div class="yn-row">' +
          '<div class="yn-q">' + (i + 1) + '. ' + esc(qtext) + '</div>' +
          '<div class="yn-btns">' +
            '<span class="yn-btn ' + (a === "yes" ? "picked-yes" : "") + '" data-yn="' + f.key + '" data-i="' + i + '" data-v="yes">是</span>' +
            '<span class="yn-btn ' + (a === "no" ? "picked-no" : "") + '" data-yn="' + f.key + '" data-i="' + i + '" data-v="no">否</span>' +
          '</div>' +
        '</div>' + note +
      '</div>';
    }).join("");
    if (f.extraList) {
      const ex = f.extraList;
      const rows = Array.isArray(rvV()[ex.key]) ? rvV()[ex.key] : [];
      const rowsHtml = rows.length === 0
        ? '<div class="list-empty-hint">点击下方按钮按需添加</div>'
        : '<div class="list-rows">' + rows.map((row, ri) =>
            '<div class="list-row">' +
              '<span class="idx">' + (ri + 1) + '.</span>' +
              '<textarea data-scope="rv" data-lk="' + ex.key + '" data-ri="' + ri + '" data-rk="t" rows="1"' + dis + ' placeholder="' + esc(ex.itemPlaceholder || "") + '">' + esc(row.t || "") + '</textarea>' +
              '<button type="button" class="row-remove" data-scope="rv" data-rmrow="' + ex.key + '" data-ri="' + ri + '" title="删除本条"' + dis + '>×</button>' +
            '</div>').join("") + '</div>';
      body += '<div class="yn-block' + lk + '">' +
        '<div class="yn-q"><strong>' + (f.items.length + 1) + '. ' + esc(ex.label) + '</strong></div>' +
        rowsHtml +
        (ex.hint ? '<div class="field-hint">' + esc(ex.hint) + '</div>' : "") +
        '<button type="button" class="list-add" data-scope="rv" data-addrow="' + ex.key + '"' + dis + '>＋ 添加一条</button>' +
      '</div>';
    }
  } else if (f.type === "pairs") {
    let rows = Array.isArray(v) ? v : [];
    if (view === "wizard" && rows.length === 0) { rows = [{}]; rvV()[f.key] = rows; saveDraft(); }
    const rowsHtml = rows.map((row, ri) =>
      '<div class="pair-row">' +
        '<div class="pair-side">' +
          '<div class="pair-cap">决策</div>' +
          '<textarea data-scope="rv" data-lk="pairs" data-ri="' + ri + '" data-rk="d" rows="2"' + dis + ' placeholder="' + esc(f.dPlaceholder || "") + '">' + esc(row.d || "") + '</textarea>' +
        '</div>' +
        '<div class="pair-arrow">→</div>' +
        '<div class="pair-side">' +
          '<div class="pair-cap">实际结果</div>' +
          '<textarea data-scope="rv" data-lk="pairs" data-ri="' + ri + '" data-rk="r" rows="2"' + dis + ' placeholder="' + esc(f.rPlaceholder || "") + '">' + esc(row.r || "") + '</textarea>' +
        '</div>' +
        '<button type="button" class="row-remove" data-scope="rv" data-rmrow="pairs" data-ri="' + ri + '" title="删除本组"' + dis + '>×</button>' +
      '</div>').join("");
    body = '<div class="pair-rows">' + rowsHtml + '</div>' +
      '<button type="button" class="list-add" data-scope="rv" data-addrow="pairs"' + dis + '>＋ 添加一组“决策 → 结果”</button>';
  } else if (f.type === "dtex") {
    return '<div class="field' + lk + '"><div class="field-label-row">' +
      '<label class="field-label" style="margin-bottom:0;">书中示例：接受波士顿的工作（决策 → 潜在结果）</label>' +
      '<button type="button" class="help-btn" id="btn-example" title="查看 / 收起示例"' + dis + '>?</button>' +
    '</div>' + (rvExOpen ? dtExampleHTML() : "") + '</div>';
  } else if (f.type === "dtree") {
    const idx = f.index;
    const pair = decPairs(rvV())[idx] || {};
    const alts = Array.isArray(rvV()["alts_" + idx]) ? rvV()["alts_" + idx] : [];
    const actual = rvV()["actual_" + idx] || {};
    const aSelCls = actual.c && EVAL_LABELS[actual.c] ? " eval-" + actual.c : "";
    const aOpts = '<option value="">标注好坏</option>' + EVAL_OPTS.map(op =>
      '<option value="' + op[0] + '"' + (actual.c === op[0] ? " selected" : "") + '>' + op[1] + '</option>').join("");
    const actualBranch = (pair.r || "").trim()
      ? '<div class="dt-branch"><div class="dt-arrow">→</div><div class="dt-branch-body">' +
          '<div class="dt-actual" style="margin-top:0;"><div class="dt-actual-main"><strong>实际发生（已从第 1 步同步）</strong>' +
            '<div class="dt-input-row">' +
              '<div class="dt-actual-text">' + esc(pair.r) + '</div>' +
              '<input type="text" class="prob-input" data-aprob="actual_' + idx + '"' + dis + ' value="' + esc(actual.p || "") + '" placeholder="如 20%" title="决策当时你估计这个结果发生的概率">' +
              '<select class="eval-sel' + aSelCls + '" data-aeval="actual_' + idx + '"' + dis + ' title="为这个实际结果标注好坏">' + aOpts + '</select>' +
            '</div>' +
          '</div></div>' +
        '</div>' +
        /* 占位符要与下方可删除行的 button 同宽，两行的概率/好坏控件才会严格对齐 */
        '<button type="button" class="row-remove" style="visibility:hidden;" tabindex="-1" aria-hidden="true">×</button>' +
      '</div>'
      : "";
    const branchRows = alts.map((row, ri) => {
      const selCls = row.c && EVAL_LABELS[row.c] ? " eval-" + row.c : "";
      const opts = '<option value="">标注好坏</option>' + EVAL_OPTS.map(op =>
        '<option value="' + op[0] + '"' + (row.c === op[0] ? " selected" : "") + '>' + op[1] + '</option>').join("");
      return '<div class="dt-branch">' +
        '<div class="dt-arrow">→</div>' +
        '<div class="dt-branch-body">' +
          '<div class="dt-input-row">' +
            '<textarea data-scope="rv" data-lk="alts_' + idx + '" data-ri="' + ri + '" data-rk="t" rows="1"' + dis + ' placeholder="描述一个当时可能发生的结果">' + esc(row.t || "") + '</textarea>' +
            '<input type="text" class="prob-input" data-plk="alts_' + idx + '" data-ri="' + ri + '"' + dis + ' value="' + esc(row.p || "") + '" placeholder="如 20%" title="你估计这个结果发生的概率">' +
            '<select class="eval-sel' + selCls + '" data-evsel="alts_' + idx + '" data-ri="' + ri + '"' + dis + ' title="为这条潜在结果标注好坏">' + opts + '</select>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="row-remove" data-scope="rv" data-rmrow="alts_' + idx + '" data-ri="' + ri + '" title="删除本条"' + dis + '>×</button>' +
      '</div>';
    }).join("");
    body =
      '<div class="dtflow">' +
        '<div class="dt-decision"><h5>决策</h5><div class="dt-text">' + esc(pair.d || "（回第 1 步填写）") + '</div></div>' +
        '<div class="dt-branches"><div class="dt-branch-head">潜在结果</div>' +
          ((pair.r || "").trim() ? '<div class="kt-syncnote">第 1 步的结果已同步为其中一个潜在结果：</div>' : "") +
          actualBranch + branchRows +
          '<button type="button" class="list-add" data-scope="rv" data-addrow="alts_' + idx + '"' + dis + '>＋ 添加一条潜在结果</button>' +
        '</div>' +
      '</div>';
  } else if (f.type === "betterpick") {
    const idx = f.index;
    const alts = Array.isArray(rvV()["alts_" + idx]) ? rvV()["alts_" + idx] : [];
    const ans = v || {};
    let n = 0;
    const items = alts.map((row, ri) => {
      if (!(row.t || "").trim()) return "";
      n++;
      const on = !!ans["i" + ri];
      const prob = (row.p || "").trim() ? '<span class="prob-badge">概率 ' + esc(row.p) + '</span>' : "";
      return '<label class="radio-option check-option ' + (on ? "checked" : "") + lk + '">' +
        '<input type="checkbox" data-better="' + f.key + '" data-i="' + ri + '"' + (on ? " checked" : "") + dis + '>' +
        '<span>' + esc(row.t) + prob + '</span>' +
      '</label>';
    }).join("");
    body = n === 0
      ? '<div class="field-hint">先在第 7 步为这棵决策树补充潜在结果，这里会同步列出供勾选。</div>'
      : '<div class="radio-group' + lk + '">' + items + '</div>';
  } else if (f.type === "betterscore") {
    const idx = f.index;
    const pair = decPairs(rvV())[idx] || {};
    const alts = Array.isArray(rvV()["alts_" + idx]) ? rvV()["alts_" + idx] : [];
    /* 选项按钮排成一行（inline），避免三行竖排白占高度 */
    const radioRow = (key, opts, cur2) =>
      '<div class="radio-group inline' + lk + '">' + opts.map(op =>
        '<label class="radio-option ' + (cur2 === op[0] ? "checked" : "") + lk + '">' +
          '<input type="radio" name="' + key + '" data-scope="rv" data-k="' + key + '" value="' + op[0] + '" ' + (cur2 === op[0] ? "checked" : "") + dis + '>' +
          '<span>' + esc(op[1]) + '</span>' +
        '</label>').join("") + '</div>';
    /* ① 决策质量打分 */
    const sv = rvV()[f.scoreKey];
    const scoreSec = '<div class="bs-cap">① ' + esc(f.scoreLabel) + '</div>' +
      '<div class="score-row' + lk + '">' +
        '<span class="score-endlabel">低</span>' +
        [0,1,2,3,4,5].map(nn =>
          '<button type="button" class="score-btn ' + (Number(sv) === nn ? "checked" : "") + '" data-scope="rv" data-score="' + f.scoreKey + '" data-val="' + nn + '"' + dis + '>' + nn + '</button>'
        ).join("") +
        '<span class="score-endlabel right">高</span>' +
      '</div>';
    /* ③ 重来一次（含追问） */
    const rv2 = rvV()[f.repeatKey];
    const repeatSec = '<div class="bs-sec"><div class="bs-cap">③ ' + esc(f.repeatLabel) + '</div>' +
      radioRow(f.repeatKey, [["yes", "会"], ["no", "不会"], ["unsure", "不确定"]], rv2) +
      (rv2 ? '<div style="margin-top:10px;"><label class="field-label">' + esc(f.reasonLabel) + '</label>' +
        '<textarea data-scope="rv" data-k="' + f.reasonKey + '" rows="2"' + dis + ' placeholder="' + esc(f.reasonPlaceholder || "") + '">' + esc(rvV()[f.reasonKey] || "") + '</textarea></div>' : "") +
    '</div>';
    /* ② 勾选更好的潜在结果 */
    const ans = v || {};
    let n = 0;
    const items = alts.map((row, ri) => {
      if (!(row.t || "").trim()) return "";
      n++;
      const on = !!ans["i" + ri];
      const prob = (row.p || "").trim() ? '<span class="prob-badge">概率 ' + esc(row.p) + '</span>' : "";
      return '<label class="radio-option check-option ' + (on ? "checked" : "") + lk + '">' +
        '<input type="checkbox" data-better="' + f.key + '" data-i="' + ri + '"' + (on ? " checked" : "") + dis + '>' +
        '<span>' + esc(row.t) + prob + '</span>' +
      '</label>';
    }).join("");
    const actualRef = (pair.r || "").trim()
      ? '<div class="kt-syncnote" style="margin-bottom:8px;">实际发生：' + esc(pair.r) + '</div>'
      : "";
    const betterSec = '<div class="bs-sec"><div class="bs-cap">② ' + esc(f.betterLabel) + '</div>' + actualRef +
      (n === 0
        ? '<div class="field-hint">先在第 7 步为这棵决策树补充潜在结果，这里会同步列出供勾选。</div>'
        : '<div class="radio-group' + lk + '">' + items + '</div>') +
      (f.betterHint ? '<div class="field-hint">' + esc(f.betterHint) + '</div>' : "") +
    '</div>';
    /* ④ 运气归因（含条件追问） */
    const lv = rvV()[f.luckKey];
    const luckSec = '<div class="bs-sec"><div class="bs-cap">④ ' + esc(f.luckLabel) + '</div>' +
      radioRow(f.luckKey, [["luck", "主要靠运气"], ["half", "运气与决策各半"], ["skill", "主要靠决策质量"]], lv) +
      ((lv === "luck" || lv === "half") ? '<div style="margin-top:10px;"><label class="field-label">' + esc(f.respLabel) + '</label>' +
        '<textarea data-scope="rv" data-k="' + f.respKey + '" rows="2"' + dis + ' placeholder="' + esc(f.respPlaceholder || "") + '">' + esc(rvV()[f.respKey] || "") + '</textarea></div>' : "") +
    '</div>';
    return '<div class="field' + lk + '">' +
      (f.label ? '<label class="field-label">' + esc(f.label) + '</label>' : "") +
      '<div class="bs-block">' + scoreSec + betterSec + repeatSec + luckSec + '</div>' +
    '</div>';
  } else if (f.type === "ktflow") {
    const idx = f.index;
    const pair = decPairs(rvV())[idx] || {};
    const listBody = (key, ph) => {
      const rows = Array.isArray(rvV()[key]) ? rvV()[key] : [];
      const rowsHtml = rows.length === 0
        ? '<div class="list-empty-hint">点击下方按钮添加</div>'
        : '<div class="list-rows">' + rows.map((row, ri) =>
            '<div class="list-row">' +
              '<textarea data-scope="rv" data-lk="' + key + '" data-ri="' + ri + '" data-rk="t" rows="1"' + dis + ' placeholder="' + esc(ph) + '">' + esc(row.t || "") + '</textarea>' +
              '<button type="button" class="row-remove" data-scope="rv" data-rmrow="' + key + '" data-ri="' + ri + '" title="删除本条"' + dis + '>×</button>' +
            '</div>').join("") + '</div>';
      return rowsHtml + '<button type="button" class="list-add" data-scope="rv" data-addrow="' + key + '"' + dis + '>＋ 添加</button>';
    };
    const decHtml = (pair.d || "").trim()
      ? '<div class="kt-items">' + esc(pair.d) + '</div>'
      : '<div class="kt-items">（第 1 步未填写决策内容）</div>';
    const resHtml = (pair.r || "").trim()
      ? '<div class="kt-items">' + esc(pair.r) + '</div>'
      : '<div class="kt-items">（第 1 步未填写结果）</div>';
    body = '<div class="ktflow">' +
      '<div class="kt-col"><h5>做决策前就<br>知道的事</h5>' + listBody("known_before_" + idx, "例：波士顿冬季的平均气温和降雪量") + '</div>' +
      '<div class="kt-arrow">→</div>' +
      '<div class="kt-col"><h5>决策</h5>' + decHtml + '<div class="kt-cap">已从第 1 步带入 · 只读</div></div>' +
      '<div class="kt-arrow">→</div>' +
      '<div class="kt-col"><h5>结果</h5>' + resHtml + '<div class="kt-cap">已从第 1 步带入 · 只读</div></div>' +
      '<div class="kt-arrow">→</div>' +
      '<div class="kt-col"><h5>结果出来后<br>才知道的事</h5>' + listBody("learned_after_" + idx, "例：过了整个冬天的真实经历") + '</div>' +
    '</div>';
  } else if (f.type === "subtitle") {
    return '<div class="field' + lk + '"><div class="sub-title">' + esc(f.label) + '</div></div>';
  } else if (f.type === "note") {
    const noteText = typeof f.text === "function" ? f.text(rvV()) : (f.text || "");
    return '<div class="field' + lk + '"><label class="field-label">' + esc(f.label) + '</label><div class="meta-note">' + esc(noteText) + '</div></div>';
  }
  const hint = f.hint ? '<div class="field-hint">' + esc(f.hint) + '</div>' : "";
  const halfCls = f.half ? " half" : "";
  return '<div class="field' + lk + halfCls + '">' + (f.label ? '<label class="field-label">' + esc(f.label) + '</label>' : "") + body + hint + '</div>';
}

/* ---------- 四象限矩阵（pick 点选 / learn 基准库编辑 / readonly 只读摘要 三模式共用） ---------- */
function quadMatrixHTML(mode, opts) {
  opts = opts || {};
  const locked = !!opts.locked;
  /* pick/readonly 实时读 localStorage；learn 用内存中的 baseline（基准库视图编辑即存） */
  const lb = mode === "learn" ? (baseline.lb || {}) : ((loadBaseline().lb || {}));
  const cell = (k) => {
    const q = QUADS[k];
    const head = '<div class="qc-head"><span class="qc-num">第' + q.num + '象限</span>' +
      '<span class="qc-name">' + esc(q.name) + '</span>' +
      '<span class="qc-axis">' + esc(q.axis) + '</span></div>';
    const myex = (lb[k] || "").trim();
    if (mode === "pick") {
      const v = rvV()[opts.fieldKey];
      const checked = v === k || (v == null && opts.fieldKey === "final_quadrant" && rvV().quadrant === k);
      return '<label class="qcell qcell-pick ' + q.cellCls + (checked ? " checked" : "") + (locked ? " locked" : "") + '">' +
        '<input type="radio" name="' + opts.fieldKey + '" data-scope="rv" data-k="' + opts.fieldKey + '" value="' + k + '"' + (checked ? " checked" : "") + (locked ? " disabled" : "") + '>' +
        head +
        '<div class="qc-def">' + esc(q.def) + '</div>' +
        '<div class="qc-ex"><b>例子：</b>' + esc(q.ex) + '</div>' +
        (myex ? '<div class="qc-ex"><b>我的例子：</b>' + esc(myex) + '</div>' : "") +
        '<div class="qc-pickmark">✓ 已选择</div>' +
      '</label>';
    }
    if (mode === "learn") {
      return '<div class="qcell ' + q.cellCls + '">' +
        head +
        '<div class="qc-def">' + esc(q.def) + '</div>' +
        '<div class="qc-ex"><b>书中例子：</b>' + esc(q.ex) + '</div>' +
        '<textarea data-bk="lb.' + k + '" rows="2" placeholder="写一个你自己的例子（' + esc(q.exHint) + '）">' + esc(myex) + '</textarea>' +
      '</div>';
    }
    /* readonly：只读矩阵，格内显示我的例子全文 */
    return '<div class="qcell ' + q.cellCls + '">' +
      head +
      '<div class="qc-ex qc-myex">' + (myex ? esc(myex) : '<span style="font-style:italic;">（未填写）</span>') + '</div>' +
    '</div>';
  };
  // 顺序映射到坐标格：左上 deserved(Ⅱ)、右上 badluck(Ⅰ)、左下 goodluck(Ⅲ)、右下 fault(Ⅳ)
  return '<div class="quad-chart' + (mode === "readonly" ? " sm" : "") + '">' +
    '<div class="q-yaxis"><span class="ylab">好</span><span class="ytitle">决策质量</span><span class="ylab">坏</span></div>' +
    cell(CHART_ORDER[0]) + cell(CHART_ORDER[1]) +
    cell(CHART_ORDER[2]) + cell(CHART_ORDER[3]) +
    '<div class="q-xaxis"><span class="xlab">好</span><span class="xtitle">结果好坏</span><span class="xlab">坏</span></div>' +
  '</div>';
}
function quadChartPick(fieldKey, locked) {
  return quadMatrixHTML("pick", { fieldKey: fieldKey, locked: locked });
}

function rvBindFieldEvents(root) {
  root.querySelectorAll(".yn-btn").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.yn;
      if (!rvV()[k]) rvV()[k] = {};
      const cur0 = rvV()[k]["i" + el.dataset.i];
      rvV()[k]["i" + el.dataset.i] = (cur0 === el.dataset.v) ? "" : el.dataset.v;
      saveDraft(); render();
    };
  });
  root.querySelectorAll("textarea[data-ynnote]").forEach(el => {
    el.addEventListener("input", () => {
      const k = el.dataset.ynnote;
      if (!rvV()[k]) rvV()[k] = {};
      rvV()[k]["n" + el.dataset.i] = el.value; saveDraft();
      growEl(el);
    });
  });

  root.querySelectorAll("input[data-plk]").forEach(el => {
    el.addEventListener("input", () => {
      rvV()[el.dataset.plk][Number(el.dataset.ri)].p = el.value; saveDraft();
    });
  });
  /* 观点追踪多组（viewtrack_multi）：组名 / 组内条目 / 组与条目的增删。
     观点追踪组与视角校准组按下标对齐，增删组时同步维护 cal 数组。 */
  const calKeyOfVt = k => {
    if (k === "vt") return "cal";
    const m = /^vt_(\d+)$/.exec(String(k || ""));
    return m ? "cal_" + m[1] : "";
  };
  /* 组页签状态：主编辑区用 rvVtTab，右侧回顾卡按步骤各记一份 */
  const groupTabStateOf = el => {
    const card = el.closest ? el.closest(".review-card[data-rvstep]") : null;
    if (card) {
      const key = card.dataset.rvstep;
      return { get: () => Number(reviewVtTabs[key]) || 0, set: v => { reviewVtTabs[key] = v; } };
    }
    return { get: () => rvVtTab, set: v => { rvVtTab = v; } };
  };
  root.querySelectorAll("textarea[data-calk]").forEach(el => {
    el.addEventListener("input", () => {
      const k = el.dataset.calk;
      if (!Array.isArray(rvV()[k])) rvV()[k] = [];
      const gi = Number(el.dataset.gi);
      if (!rvV()[k][gi]) rvV()[k][gi] = {};
      rvV()[k][gi][el.dataset.ck] = el.value; saveDraft();
      growEl(el);
    });
  });
  root.querySelectorAll("input[data-vtname]").forEach(el => {
    el.addEventListener("input", () => {
      rvV()[el.dataset.vtname][Number(el.dataset.gi)].name = el.value; saveDraft();
    });
  });
  root.querySelectorAll("textarea[data-vtg]").forEach(el => {
    el.addEventListener("input", () => {
      const g = rvV()[el.dataset.vtg][Number(el.dataset.gi)];
      g[el.dataset.gk][Number(el.dataset.ri)].t = el.value; saveDraft();
      growEl(el);
    });
  });
  root.querySelectorAll("[data-vtgaddgrp]").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.vtgaddgrp;
      const tabState = groupTabStateOf(el);
      if (!Array.isArray(rvV()[k])) rvV()[k] = [];
      rvV()[k].push({ name: "", out: [], in: [] });
      const ck = calKeyOfVt(k);
      if (ck) {
        if (!Array.isArray(rvV()[ck])) rvV()[ck] = [];
        rvV()[ck].push({});
      }
      if (k === "vt") tabState.set(rvV()[k].length - 1);
      saveDraft(); render();
    };
  });
  root.querySelectorAll("[data-vtgrm]").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.vtgrm, gi = Number(el.dataset.gi);
      const tabState = groupTabStateOf(el);
      rvV()[k].splice(gi, 1);
      const ck = calKeyOfVt(k);
      if (ck && Array.isArray(rvV()[ck])) rvV()[ck].splice(gi, 1);
      if (k === "vt" && tabState.get() > rvV()[k].length - 1) tabState.set(Math.max(0, rvV()[k].length - 1));
      saveDraft(); render();
    };
  });
  root.querySelectorAll("[data-vtgadd]").forEach(el => {
    el.onclick = () => {
      const g = rvV()[el.dataset.vtgadd][Number(el.dataset.gi)];
      if (!Array.isArray(g[el.dataset.gk])) g[el.dataset.gk] = [];
      g[el.dataset.gk].push({}); saveDraft(); render();
    };
  });
  root.querySelectorAll("[data-vtgrmrow]").forEach(el => {
    el.onclick = () => {
      rvV()[el.dataset.vtgrmrow][Number(el.dataset.gi)][el.dataset.gk].splice(Number(el.dataset.ri), 1); saveDraft(); render();
    };
  });
  root.querySelectorAll("input[data-aprob]").forEach(el => {
    el.addEventListener("input", () => {

/* 合并导入：报告/草稿按 id 去重（已存在跳过），基准库仅本地为空时采用导入值 */
function importDataFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result || ""));
      if (!data || typeof data !== "object" ||
          (!Array.isArray(data.reports) && !Array.isArray(data.drafts) && !data.baseline)) {
        throw new Error("缺少 reports/drafts/baseline 字段");
      }
      let added = 0, skipped = 0;
      const repIds = {};
      reports.forEach(r => { repIds[r.id] = 1; });
      (Array.isArray(data.reports) ? data.reports : []).forEach(r => {
        if (!r || typeof r !== "object" || r.id == null) return;
        if (repIds[r.id]) { skipped++; return; }
        repIds[r.id] = 1;
        reports.unshift(r);
        added++;
      });
      let dAdded = 0, dSkipped = 0;
      const draftIds = {};
      drafts.forEach(d => { draftIds[d.id] = 1; });
      (Array.isArray(data.drafts) ? data.drafts : []).forEach(d => {
        if (!d || typeof d !== "object" || d.id == null || !d.v) return;
        if (draftIds[d.id]) { dSkipped++; return; }
        draftIds[d.id] = 1;
        drafts.unshift(d);
        dAdded++;
      });
      let baseNote = "";
      if (data.baseline && typeof data.baseline === "object") {
        const localEmpty = !baseline || !Object.keys(baseline).some(k =>
          baseline[k] && typeof baseline[k] === "object" &&
          Object.keys(baseline[k]).some(kk => {
            const val = baseline[k][kk];
            return Array.isArray(val) ? val.length > 0 : (val != null && String(val).trim() !== "");
          }));
        if (localEmpty) {
          baseline = data.baseline;
          ["pv", "lb", "kt"].forEach(k => { if (!baseline[k] || typeof baseline[k] !== "object") baseline[k] = {}; });
          saveBaseline();
          baseNote = "；基准库已导入";
        }
      }
      persistReports();
      persistDrafts();
      alert("导入完成：新增 " + added + " 条报告" + (skipped ? "、跳过已存在 " + skipped + " 条" : "") +
        "；草稿新增 " + dAdded + " 条" + (dSkipped ? "、跳过 " + dSkipped + " 条" : "") + baseNote + "。");
      render();
    } catch (e) {
      alert("导入失败：文件不是有效的备份 JSON（" + (e && e.message ? e.message : e) + "）。");
    }
  };
  reader.onerror = () => alert("读取文件失败。");
  reader.readAsText(file);
}

function esc(s) {

/* 概率统一口径：只存数字，显示时统一加 % */

/* ---------- 作用域：模块（m:xx）/ 复盘阶段（rv）/ 会话级（root）/ 基准库（base） ---------- */
function selOf(v) {
  return (Array.isArray(v.sel) ? v.sel : []).filter(m => MODS[m]);
}
/* 流程描述（回顾/报告/文字共用）：默认流程一句话，自定义按 sel 顺序 */
function flowText(o) {
  o = o || {};
  const rvTxt = rvInFlow(o) ? " → 复盘（幸运箱 → 决策质量 → 重建决策树 → 再判断）" : "";
  if (o.flowmode === "default") return "默认流程（决策速度 → 六步决策 → 内外视角 → 事前验尸）" + rvTxt;
  const names = selOf(o).map(m => MODS[m].name);
  if (!names.length) return (rvTxt ? rvTxt.replace(/^ → /, "") : "（未选择模块）");
  return names.join(" → ") + (o.flowmode === "custom" ? "（自定义）" : "") + rvTxt;
}
function ensureModScope(m) {
  if (!values.mods || typeof values.mods !== "object") values.mods = {};
  if (!values.mods[m] || typeof values.mods[m] !== "object") values.mods[m] = {};
  return values.mods[m];
}
function peekModScope(mv, idx) {
  idx = Number(idx) || 0;
  if (idx === 0) return mv;
  const rounds = Array.isArray(mv._rounds) ? mv._rounds : [];
  return rounds[idx - 1] || {};
}
/* scope 字符串："root"（会话级）/ "base"（全局基准库）/ "m:xx"（模块第 1 轮）/ "m:pm@N"（pm 第 N+1 轮） */
function resolveScope(str, create) {
  if (str === "root") return values;
  if (str === "rv") return rvV();
  if (str === "base") return baseline.pv || (baseline.pv = {});
  const m = /^m:(\w+)(?:@(\d+))?$/.exec(String(str || ""));
  if (!m) return values;
  const mv = ensureModScope(m[1]);
  const r = Number(m[2]) || 0;
  if (r === 0) return mv;
  if (!Array.isArray(mv._rounds)) {
    if (!create) return {};
    mv._rounds = [];
  }
  if (create) while (mv._rounds.length < r) mv._rounds.push({});
  const scope = mv._rounds[r - 1];
  if (scope && typeof scope === "object") return scope;
  if (create) { mv._rounds[r - 1] = {}; return mv._rounds[r - 1]; }
  return {};
}
function persistScope(str) {
  if (str === "base") saveBaseline(); else saveDraft();
}

/* ---------- 路径组装器：s0 + 按勾选顺序拼接各模块内部路径 ---------- */
function buildPath(v) {
  const p = [{ mod: null, step: S0_STEP }];
  selOf(v).forEach(m => {
    moduleSteps(m, (v.mods && v.mods[m]) || {}).forEach(st => p.push({ mod: m, step: st }));
  });
  /* 复盘阶段接在决策阶段之后：四个阶段里的 12 步依次入路径 */
  if (rvInFlow(v)) RV_STEPS.forEach(st => p.push({ mod: null, rv: true, step: st, phase: "rv" }));
  return p;
}
function moduleSteps(m, mv) {
  const mod = MODS[m];
  if (m === "dp") return mod.pathIds(mv).map(id => DP_STEP_MAP[id]).filter(Boolean);
  if (mod.path) return mod.path(mv);
  return mod.steps.slice();
}
function scopeStrFor(entry, roundOverride) {
  if (!entry.mod) return "root";
  if (entry.mod === "pm") {
    const r = roundOverride != null ? roundOverride : pmRound;
    return r > 0 ? "m:pm@" + r : "m:pm";
  }
  return "m:" + entry.mod;
}
function fieldsForEntry(entry, scopeVals) {
  if (entry.rv) return RV_FIELDS(entry.step.id, scopeVals || rvV()) || [];
  if (!entry.mod) return s0Fields();
  return MODS[entry.mod].fields(entry.step.id, scopeVals || {}) || [];
}
function stepMetaFor(entry, scopeVals) {
  if (entry.rv) {
    const m0 = RV_STEPMETA[entry.step.id];
    return typeof m0 === "function" ? m0(scopeVals || rvV()) : (m0 || "");
  }
  if (!entry.mod) return "";
  const mod = MODS[entry.mod];
  const base = String(entry.step.id).replace(/_d\d+$/, "");
  const m = mod.stepMeta && mod.stepMeta[base];
  if (!m) return "";
  return typeof m === "function" ? m(scopeVals || {}) : m;
}

/* ---------- 推进门槛（ss 的 gateOk 泛化：titleStep + need 支持函数或字段 key） ---------- */
function gateOk(entry) {
  if (entry.rv) {
    /* 复盘只有第 1 步的门槛：事项名称 */
    if (entry.step.id === "s1" && !String(rvV().title || "").trim()) return false;
    return true;
  }
  if (!entry.mod) {
    return !!String(values.title || "").trim() && (values.flowmode === "default" || selOf(values).length >= 1 || rvInFlow(values));
  }
  const mod = MODS[entry.mod];
  const scope = resolveScope(scopeStrFor(entry), false);
  const baseId = entry.step.base || entry.step.id;
  if (mod.titleStep && baseId === mod.titleStep && !String(scope[mod.titleKey] || "").trim()) return false;
  if (entry.step.need) {
    return typeof entry.step.need === "function"
      ? !!entry.step.need(scope)
      : !!String(scope[entry.step.need] == null ? "" : scope[entry.step.need]).trim();
  }
  return true;
}
function gateHint(entry) {
  if (entry.rv) return entry.step.id === "s1" ? "请先填写复盘名称" : "";
  if (!entry.mod) {
    if (!String(values.title || "").trim()) return values.mode === "rv" ? "请先填写事项名称" : "请先填写决策名称";
    return values.mode === "rv" ? "" : "请勾选至少一个决策模块，或选择默认流程";
  }
  const mod = MODS[entry.mod];
  const baseId = entry.step.base || entry.step.id;
  if (mod.titleStep && baseId === mod.titleStep) return mod.titleNote;
  return entry.step.needHint || mod.titleNote || "";
}
function refreshNavGate() {
  if (view !== "wizard") return;
  const entries = buildPath(values);
  const entry = entries[cur];
  if (!entry) return;
  const ok = gateOk(entry);
  const btn = document.getElementById("btn-next");
  const note = document.querySelector(".nav-note");
  if (btn) btn.disabled = !ok;
  if (note) note.textContent = ok ? "" : gateHint(entry);

/* ---------- 跨模块预填（仅当目标字段为空时填，每条规则每次会话只填一次，用户可改） ---------- */
function applyPrefills(modId) {
  const done = values._prefilled || (values._prefilled = {});
  const mv = ensureModScope(modId);
  const sel = selOf(values);
  const t = String(values.title || "").trim();
  const fill = (key, val) => {
    const kk = modId + "." + key;
    if (done[kk]) return;
    done[kk] = 1;
    if (val == null) return;
    if (typeof val === "string" && !val.trim()) return;
    if (Array.isArray(val) && !val.length) return;
    const cur0 = mv[key];
    if (cur0 != null && cur0 !== "" && !(Array.isArray(cur0) && cur0.length === 0)) return;
    mv[key] = val;
  };
  if (modId === "pv") {
    fill("title", t);
  }
  if (modId === "ss") {
    /* 本次决策＝决策速度第 1 步「这个决策具体是什么？」，它就是第 1 个决策（不进候选数组） */
    const t0 = dpDecisionText();
    if (t0 && !String(mv.title || "").trim()) mv.title = t0;
    if (sel.indexOf("dp") >= 0) {
      /* 决策速度「披着狼皮的羊」环节列过的候选选项自动带入候选数组（去重，且不与本次决策重复）。
         只在真的带入新条目时改写数组——否则每次渲染都会把用户刚添加的空行冲掉 */
      const dpm = ensureModScope("dp");
      const opts = (Array.isArray(dpm.options_extra) ? dpm.options_extra : []).filter(o => (o.t || "").trim());
      if (opts.length) {
        const curD = Array.isArray(mv.decisions) ? mv.decisions : [];
        const known = curD.map(d => String((d && d.t) || "").trim()).concat([String(t0 || "").trim()]);
        let added = 0;
        opts.forEach(o => {
          const txt = String(o.t).trim();
          if (known.indexOf(txt) < 0) { curD.push({ t: o.t }); known.push(txt); added++; }
        });
        if (added) mv.decisions = curD;
      }
      if (!String(mv.bg || "").trim()) fill("bg", dpm.situation || "");
    }
    fill("bg", t0);
  }
  if (modId === "pm") {
    fill("title", t);
  }
}
/* ss 的 final_pick 值是 "d0" 形式，预填时还原为决策文本 */
/* 六步决策「最终选择」里勾选的所有决策，带决策编号逐条列出（与「决策 N：…」口径一致） */
function ssPickText(ssv) {
  const ds = decisionsOf(ssv);
  return finalPicks(ssv).map(i => ds[i] ? "决策 " + (i + 1) + "：" + ds[i].t : "").filter(Boolean).join("\n");
}

/* ---------- 跨模块同源文本：决策速度第 1 步与六步决策第 1 步共用 ---------- */
/* ① 本次决策：唯一真值来源＝决策速度第 1 步的决策陈述（dp.title）；未走决策速度时退回会话名。
   六步决策的“本次决策”文本框实时读这里，改哪边都写回这里，候选列表第 1 条（决策 1）同步为它。 */
function dpDecisionText() {
  const dp = (values && values.mods && values.mods.dp) || {};
  return String(dp.title || "").trim() || String((values && values.title) || "").trim();
}
function syncDecisionText() {
  if (!values || !values.mods) return;
  const t = dpDecisionText();
  if (!t) return;
  const ss = values.mods.ss;
  if (ss && typeof ss === "object") {
    ss.title = t;
    /* 旧数据：候选列表第 1 条曾是决策陈述的副本——去掉，决策清单改由 title（本次决策）+ decisions（其余候选）合成 */
    if (Array.isArray(ss.decisions) && ss.decisions.length && ss.decisions[0] && String(ss.decisions[0].t || "").trim() === t) ss.decisions.shift();
    saveDraft();
  }
}
/* ② 背景描述：决策速度第 1 步「具体描述你当前的处境」（dp.situation）＝六步决策第 1 步「背景描述」（ss.bg）。
   两侧同义，以决策速度为锚：任一侧为空时由另一侧补齐，两侧都有时以决策速度为准（与①同一口径）。 */
/* ③ 内外视角 / 事前验尸：与最初环节（决策速度）同源——名字＝决策陈述，描述＝具体决策＋当前处境。
   只在「与其它工具同用」时启用；单独使用某个工具时一切照旧（自己填名字与描述）。
   名字与①同一口径（改哪边都会更新）；描述默认带入，在这里改过之后就以这里为准，不再被覆盖。 */
function combined() {
  return selOf(values).length > 1;
}
function dpSituationText() {
  const dp = (values && values.mods && values.mods.dp) || {};
  return String(dp.situation || "").trim();
}
function dpContextText() {
  const parts = [];
  const d = dpDecisionText();
  if (d) parts.push("决策：" + d);
  const s = dpSituationText();
  if (s) parts.push("当前处境：" + s);
  return parts.join("\n");
}
/* 把一个作用域的 title / 描述字段同步为最初环节的内容（描述改过就不覆盖），返回是否有改动 */
function syncFromInitial(scope, descKey) {
  if (!scope || typeof scope !== "object") return false;
  const t = dpDecisionText();
  const d = dpContextText();
  const markKey = "_synced_" + descKey;
  let changed = false;
  if (t && scope.title !== t) { scope.title = t; changed = true; }
  /* 描述：为空、或仍是上一次同步过来的内容（说明没在这里改过）时，跟着最初环节更新 */
  if (d && (!String(scope[descKey] || "").trim() || scope[descKey] === scope[markKey])) {
    if (scope[descKey] !== d || scope[markKey] !== d) { scope[descKey] = d; scope[markKey] = d; changed = true; }
  }
  return changed;
}
/* 内外视角自己填「决策 / 处境」两问的场合：单独使用它，或把它排在第一个（前面没有上游工具）。
   其余情况（默认流程等）这两问从最初环节带入，向导里不再重复展示，但报告里照常收录。 */
/* 某个模块前面是否还有别的工具（按 sel 顺序）：有上游 = 上下文由上游带入，本环节不重复问 */
function upstreamOf(modId) {
  return selOf(values).indexOf(modId) > 0;
}
/* 决策速度是否排在指定模块前面（决定与处境的实际来源） */
function dpBefore(modId) {
  const sel = selOf(values);
  const d = sel.indexOf("dp"), i = sel.indexOf(modId);
  return d >= 0 && i >= 0 && d < i;
}
function pvSelfInput() {
  return !upstreamOf("pv");
}
function syncPvText() {
  if (!values || !values.mods || pvSelfInput()) return;
  if (syncFromInitial(values.mods.pv, "problem")) saveDraft();
}
/* 事前验尸要验的计划：默认取六步决策「最终选择」勾选的决策；还没勾选则退回最初环节的决策与处境 */
function pmPlan() {
  return { text: ssPickText((values && values.mods && values.mods.ss) || {}) };
}
function syncPmText() {
  if (!values || !values.mods || !upstreamOf("pm")) return;
  const pm = values.mods.pm;
  if (!pm || typeof pm !== "object") return;
  const t = dpDecisionText();
  const plan = pmPlan().text;
  let changed = false;
  /* 名字与计划都是只读投射：一律以上游为准（旧报告里的历史内容也要被覆盖掉） */
  [pm].concat(Array.isArray(pm._rounds) ? pm._rounds : []).forEach(scope => {
    if (!scope || typeof scope !== "object") return;
    if (t && scope.title !== t) { scope.title = t; changed = true; }
    if (String(scope.goal_desc || "") !== plan) { scope.goal_desc = plan; changed = true; }
  });
  if (changed) saveDraft();
}
function syncBgText() {
  if (!values || !values.mods) return;
  const dp = values.mods.dp || {};
  const ss = values.mods.ss || {};
  const d = String(dp.situation || "").trim() ? dp.situation : "";
  const b = String(ss.bg || "").trim() ? ss.bg : "";
  const t = d || b;
  if (!t) return;
  let changed = false;
  if (d !== t) { dp.situation = t; changed = true; }
  if (b !== t) { ss.bg = t; changed = true; }
  if (changed) saveDraft();
}
/* 会话标题变化：同步到六步决策的决策 1（决策速度未填时它是退路） */
function syncRootKeyToDerived(k) {
  if (k === "title") syncDecisionText();
}
/* 六步决策第 1 步编辑“本次决策”：写回决策速度第 1 步的决策陈述，并同步决策 1。
   两处同源文本在一侧被编辑时写回另一侧的存值（含清空），使两侧始终是同一份文本。 */
function syncDerivedKey(k, scopeStr, val) {
  if (!values) return;
  if (scopeStr === "m:ss" && k === "title") {
    ensureModScope("dp").title = val;
    syncDecisionText();
    return;
  }
  if (k === "situation" && scopeStr === "m:dp") ensureModScope("ss").bg = val;
  else if (k === "bg" && scopeStr === "m:ss") ensureModScope("dp").situation = val;
  else if (k === "title" && (scopeStr === "m:pv" || scopeStr === "m:pm" || /^m:pm@\d+$/.test(scopeStr))) {
    if (!combined()) return;
    ensureModScope("dp").title = val;
    syncDecisionText();
  } else return;
  saveDraft();
}
/* 同源文本的孪生输入框：若另一处（如右侧回顾卡）正显示同一字段，同步刷新它的显示值 */
const TWIN_FIELDS = { "m:ss|bg": "m:dp|situation", "m:dp|situation": "m:ss|bg" };
function mirrorTwinEl(root, k, scopeStr, val) {
  const twin = TWIN_FIELDS[scopeStr + "|" + k];
  if (!twin) return;
  const p = twin.split("|");
  root.querySelectorAll('[data-k="' + p[1] + '"]').forEach(x => {
    if ((x.dataset.scope || "root") !== p[0] || x.value === val) return;
    x.value = val;
    if (x.tagName === "TEXTAREA") growEl(x);
  });
}

function render() {
  if (view === "home") renderHome();
  else if (view === "baseline") renderBaseline();
  else if (view === "wizard") renderWizard();
  else if (view === "report") renderReport();
  growTextareas(app);
  if (resetScrollNext) window.scrollTo(0, 0);
  resetScrollNext = false;
}
function goRender() { resetScrollNext = true; render(); }

function growTextareas(root) {
  root.querySelectorAll("textarea").forEach(growEl);
}
function growEl(el) {
  el.style.height = "auto";
  el.style.height = (el.scrollHeight + 2) + "px";
}

      }
      persistReports(); render();
    };
  });
}

  }).join("");
  const sec3 = '<div class="base-section">' +

    '<div class="base-src">来自「知识追踪器」（《对赌（实践版）》第二章）——写下你自己说过的例子，帮助识别自己的归因习惯。</div>' +
    '<div class="concept-grid">' + cards + '</div>' +

    '<textarea data-bk="kt.knew" rows="2" placeholder="例：股价跌了——“我早就知道该早点卖”">' + esc(kt.knew || "") + '</textarea></div>' +
    '<div class="field"><label class="field-label">“我本该知道”的一个例子</label>' +
    '<textarea data-bk="kt.should" rows="2" placeholder="例：项目延期了——“我本该提前估到风险”">' + esc(kt.should || "") + '</textarea></div>' +
  '</div>';

  app.innerHTML =
    '<div class="narrow">' +
    '<div class="hero">' +
      '<div class="kicker">长期保存 · 编辑即存</div>' +
      '<h1>基准库</h1>' +
      '<p>这里集中维护两件事：①「内外视角」的判断基准（基准数练习与内视角话术）——决策阶段与复盘阶段都会引用它；②「幸运箱」四象限的个人例子与后视偏差的自述例子——复盘阶段随时可查。所有修改即时保存。</p>' +
      '<p class="base-copy-note">这一份基准库是本工具自己的副本（首次打开时从旧工具复制过来）。在这里修改或清空，都不会影响 辅助决策工具箱 / 决策复盘工具箱 里原来那份。</p>' +
      '<div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;">' +
        '<button class="btn secondary" id="btn-bback">← 返回' + (baseFrom === "wizard" ? "向导" : "首页") + '</button>' +
      '</div>' +
    '</div>' +
    sec1 + sec2 + sec3 +
    '</div>';

  app.querySelector("#btn-bback").onclick = () => { view = baseFrom; goRender(); };
  app.querySelectorAll("textarea[data-bk], input[data-bk]").forEach(el => {
    el.addEventListener("input", () => {
      const parts = el.dataset.bk.split(".");
      if (el.dataset.ri != null) {
        if (!Array.isArray(baseline[parts[0]][parts[1]])) baseline[parts[0]][parts[1]] = [];
        baseline[parts[0]][parts[1]][Number(el.dataset.ri)][el.dataset.rk] = el.value;
      } else {
        baseline[parts[0]][parts[1]] = el.value;
      }
      saveBaseline();
      if (el.tagName === "TEXTAREA") growEl(el);
    });
  });
  app.querySelectorAll("[data-badd]").forEach(el => {
    el.onclick = () => {
      if (!Array.isArray(baseline.pv.base_baserate)) baseline.pv.base_baserate = [];
      baseline.pv.base_baserate.push({});
      saveBaseline(); render();
    };
  });
  app.querySelectorAll("[data-brm]").forEach(el => {
    el.onclick = () => {
      baseline.pv.base_baserate.splice(Number(el.dataset.brm), 1);
      saveBaseline(); render();
    };
  });
}

/* 六步决策的决策分析页（sd_d{i}）把三个环节合并成一步：标题带上这条决策的实际内容，避免只显示“决策 1” */
function stepTitleFor(modId, step, mv, maxLen) {
  const base = (step && typeof step.title === "string") ? step.title : "";
  if (modId !== "ss" || !base) return base;
  const m = /^sd_d(\d+)$/.exec(String((step && step.id) || ""));
  if (!m) return base;
  const ds = decisionsOf(mv || {});
  const d = ds[Number(m[1])];
  const t = d ? String(d.t || "").trim() : "";
  if (!t) return base;
  return base + "：" + (maxLen ? trunc(t, maxLen) : t);
}
function ssStepTitle(entry, maxLen) {
  if (!entry || entry.mod !== "ss") return "";
  return stepTitleFor("ss", entry.step, ensureModScope("ss"), maxLen);
}

/* ---------- 右侧回顾栏：阶段 / 环节两级快速定位 ---------- */
/* 每个回顾项归属：阶段 = 决策 / 复盘；环节 = 起始、某决策模块、某复盘阶段 */
function rvReviewStageOf(it, entries) {
  if (!it) return "";
  if (it.kind === "round") return "dec";
  const e = entries[it.idx];
  return e && e.rv ? "rv" : "dec";
}
function rvReviewSectionOf(it, entries) {
  if (!it) return "";
  if (it.kind === "round") return "pm";
  const e = entries[it.idx];
  if (!e) return "";
  return e.rv ? ("rv" + e.step.phase) : (e.mod || "start");
}
function rvReviewJumpHtml(navItems, rightTab, entries) {
  if (!navItems.length) return "";
  const idxByStage = { dec: [], rv: [] };
  const idxBySection = {};
  navItems.forEach((it, i) => {
    const st = rvReviewStageOf(it, entries);
    if (idxByStage[st]) idxByStage[st].push(i);
    const sec = rvReviewSectionOf(it, entries);
    if (sec) (idxBySection[sec] || (idxBySection[sec] = [])).push(i);
  });
  const curIt = navItems[rightTab] || navItems[navItems.length - 1];
  const stage = rvReviewStageOf(curIt, entries) || "dec";
  const section = rvReviewSectionOf(curIt, entries);

  const stageBtn = (key, name, pc, pt) => {
    const list = idxByStage[key] || [];
    const on = stage === key;
    const disabled = !list.length;
    return '<button type="button" class="bevel-btn rv-phase rv-stage' + (on ? " active" : "") + '"' +
      ' style="--pc:' + pc + ';--pt:' + pt + '"' + (disabled ? " disabled" : "") +
      (disabled ? "" : ' data-rtjump="' + list[list.length - 1] + '"') +
      '><span>' + esc(name) + '</span></button>';
  };

  let sections;
  if (stage === "rv") {
    sections = RV_PHASES.map((ph, i) => "rv" + i);
  } else {
    sections = [];
    if (idxBySection.start) sections.push("start");
    selOf(values).forEach(m => { if (sections.indexOf(m) < 0) sections.push(m); });
    Object.keys(idxBySection).forEach(sec => {
      if (sec !== "start" && !/^rv\d+$/.test(sec) && sections.indexOf(sec) < 0) sections.push(sec);
    });
  }
  const secMeta = sec => {
    if (sec === "start") return { name: "起始", title: "起始步", pc: "#999590", pt: "#f2f0ec" };
    const rm = /^rv(\d+)$/.exec(sec);
    if (rm) {
      const ph = RV_PHASES[Number(rm[1])];
      return ph ? { name: ph.short, title: ph.name, pc: ph.color, pt: ph.soft } : null;
    }
    const mod = MODS[sec];
    return mod ? { name: mod.name, title: mod.name + " · " + mod.chapter, pc: mod.color, pt: mod.color + "14" } : null;
  };
  const secBtns = sections.map(sec => {
    const meta = secMeta(sec);
    if (!meta) return "";
    const list = idxBySection[sec] || [];
    const on = section === sec;
    const disabled = !list.length;
    return '<button type="button" class="bevel-btn rv-phase rv-sec' + (on ? " active" : "") + '"' +
      ' style="--pc:' + meta.pc + ';--pt:' + meta.pt + '"' + (disabled ? " disabled" : "") +
      (disabled ? "" : ' data-rtjump="' + list[list.length - 1] + '"') +
      ' title="' + esc(meta.title) + '"><span>' + esc(meta.name) + '</span></button>';
  }).join("");

  return '<div class="rv-jump">' +
    '<div class="rv-jump-row"><span class="rv-jump-cap">阶段</span>' +
      stageBtn("dec", "决策阶段", "#1a56db", "#eaf0fd") +
      stageBtn("rv", "复盘阶段", RV_COLOR, "#e6f4f7") +
    '</div>' +
    '<div class="rv-jump-row"><span class="rv-jump-cap">环节</span>' + secBtns + '</div>' +
  '</div>';
}


/* ---------- 向导 ---------- */
function renderWizard() {
  /* 每次渲染都把“本次决策”同步为候选列表第 1 条（决策 1）：刷新/回退/直接跳步都不会走失 */
  syncDecisionText();
  /* 起始步默认进入复盘（新会话入口已确定方向；这里只兜底没有 doReview 的历史草稿） */
  if (values.doReview == null) values.doReview = "yes";
  const entries = buildPath(values);
  if (cur > entries.length - 1) cur = entries.length - 1;
  if (cur < 0) cur = 0;
  /* 复盘聚焦模式（从待复盘记录点「开始复盘」进入）：路径数据不变，
     但顶部流程条只显示复盘阶段，且「上一步」钳制在第一个复盘步 */
  const rvFocus = !!values.rvFocus;
  const firstRvIdx = entries.findIndex(e => e.rv);
  const minCur = (rvFocus && firstRvIdx >= 0) ? firstRvIdx : 0;
  if (cur < minCur) cur = minCur;
  const entry = entries[cur];
  const inRv = !!entry.rv;
  /* 换模块时把内外视角的组页签复位到第 1 组（模块内切步骤时保留） */
  if (entry.mod !== pvLastMod) { pvTab = 0; pvLastMod = entry.mod; }
  if (entry.mod) applyPrefills(entry.mod);
  /* 背景描述与决策速度的处境描述同源：补齐只填过一侧的情况（历史草稿、预填之后） */
  syncBgText();
  /* 内外视角 / 事前验尸的名字与描述与最初环节同源（仅在与其它工具同用时） */
  syncPvText();
  syncPmText();
  /* 走到复盘环节：把决策阶段的同源内容带过来（只填空，随时可改，可重新同步） */
  if (inRv) applyReviewSync(false);
  /* 复盘阶段逐决策的步骤：当前决策下标越界就收敛 */
  if (inRv) {
    const nDec = decPairs(rvV()).length;
    if (rvDecIdx > nDec - 1) rvDecIdx = Math.max(0, nDec - 1);
    if (rvDecIdx < 0) rvDecIdx = 0;
  }
  const isDecStep = inRv && DEC_STEP_IDS.indexOf(entry.step.id) >= 0;
  const dps = isDecStep ? decPairs(rvV()) : [];
  const isRvViewStep = inRv && (entry.step.id === "s8" || entry.step.id === "s9");
  if (isRvViewStep) rvViewNorm(rvV());
  const rvViewGroups = (isRvViewStep && Array.isArray(rvV().vt)) ? rvV().vt : [];
  if (isRvViewStep && rvVtTab > rvViewGroups.length - 1) rvVtTab = 0;

  /* 阶段分组（连续同类为一段）：起始 / 各决策模块 / 复盘的四阶段 */
  const groupKeyOf = e => e.rv ? "rv" + e.step.phase : (e.mod || "s0");
  const groups = [];
  entries.forEach((e, i) => {
    const key = groupKeyOf(e);
    const g = groups[groups.length - 1];
    if (g && g.key === key) g.last = i;
    else groups.push({ key: key, mod: e.mod, rv: !!e.rv, phase: e.rv ? e.step.phase : null, first: i, last: i });
  });
  const groupMeta = g => {
    if (g.rv) return { name: RV_PHASES[g.phase].short, color: RV_PHASES[g.phase].color };
    if (g.mod) return { name: MODS[g.mod].name, color: MODS[g.mod].color };
    return { name: "起始", color: "#999590" };
  };
  let markedDec = false, markedRv = false;
  const phaseChips = groups.filter(g => !rvFocus || g.rv).map(g => {
    const gm = groupMeta(g);
    const active = cur >= g.first && cur <= g.last;
    const doneG = g.last < cur;
    const style = active ? ' style="border-color:' + gm.color + ';background:' + gm.color + '14;"' : "";
    let pre = "";
    if (!g.rv && g.mod && !markedDec) { pre = '<span class="pg-label">决策阶段</span>'; markedDec = true; }
    if (g.rv && !markedRv) { pre = '<span class="pg-label">复盘阶段</span>'; markedRv = true; }
    return pre + '<span class="phase-chip ' + (active ? "active" : (doneG ? "done" : "")) + '" data-goto="' + g.first + '"' + style + '>' +
      '<span class="pdot" style="background:' + gm.color + ';"></span>' + esc(gm.name) + (doneG ? " ✓" : "") + '</span>';
  }).join("");

  /* 下层步骤胶囊：只显示当前模块 / 当前复盘阶段内的步骤 */
  const curGroup = groups.filter(g => cur >= g.first && cur <= g.last)[0];
  const chips = entries.slice(curGroup.first, curGroup.last + 1).map((e, li, /* 当前分组内的全部步骤 */ arr) => {
    const i = curGroup.first + li;
    const cls = i === cur ? "active" : (i < cur ? "done" : "");
    const numTxt = i < cur ? "✓" : String(li + 1);
    const chipTitle = (!e.mod && !e.rv && values.mode === "rv") ? "起始 · 起名"
      : (e.rv ? e.step.title : (ssStepTitle(e, 14) || e.step.title));
    let chip = '<span class="step-chip ' + cls + '" data-goto="' + i + '">' +
      '<span class="num">' + numTxt + '</span>' + esc(chipTitle) + '</span>';
    if (li < arr.length - 1) chip += '<span class="step-sep">›</span>';
    return chip;
  }).join("");

  const isLast = cur === entries.length - 1 && (entry.mod !== null || entry.rv);
  /* pm 模块的多轮循环：s5 选择修正/放弃且开启新一轮时，下一轮回到 pm 第 1 步 */
  let loopNext = false;
  if (entry.mod === "pm" && entry.step.id === "s5") {
    const pmScope = resolveScope(scopeStrFor(entry), false);
    loopNext = (pmScope.decision === "adjust" || pmScope.decision === "drop") && pmScope.new_round === "yes";
  }
  const okGate = gateOk(entry);
  /* 六步决策的决策分析页：一个决策一页，上一步/下一步先在页内的三个环节之间走 */
  const isDecPage = entry.mod === "ss" && entry.step.base === "sd";
  const phaseNext = isDecPage && subTab < SS_PHASES.length - 1;
  const phasePrev = isDecPage && subTab > 0;
  /* 内外视角：观点追踪有多组时，上一步/下一步先在本环节内走完各组 */
  let pvGrpNext = false, pvGrpPrev = false, pvGrpNextName = "", pvGrpPrevName = "";
  if (entry.mod === "pv") {
    const gs = pvVtGroups(pvNorm(ensureModScope("pv")));
    if (gs.length > 1) {
      pvGrpNext = pvTab < gs.length - 1;
      pvGrpPrev = pvTab > 0;
      if (pvGrpNext) pvGrpNextName = pvGroupName(gs[pvTab + 1], pvTab + 1);
      if (pvGrpPrev) pvGrpPrevName = pvGroupName(gs[pvTab - 1], pvTab - 1);
    }
  }
  /* 复盘阶段逐决策的步骤：先在本步内把每个决策依次填完，再进下一步 */
  const moreDec = isDecStep && rvDecIdx < dps.length - 1;
  const prevDec = isDecStep && rvDecIdx > 0;
  /* 复盘阶段的内外视角 / 视角校准：多组观点时先在本环节内逐组走完 */
  let rvGrpNext = false, rvGrpPrev = false, rvGrpNextName = "", rvGrpPrevName = "";
  if (isRvViewStep && rvViewGroups.length > 1) {
    rvGrpNext = rvVtTab < rvViewGroups.length - 1;
    rvGrpPrev = rvVtTab > 0;
    if (rvGrpNext) rvGrpNextName = rvGrpName(rvViewGroups[rvVtTab + 1], rvVtTab + 1);
    if (rvGrpPrev) rvGrpPrevName = rvGrpName(rvViewGroups[rvVtTab - 1], rvVtTab - 1);
  }
  const prevLabel = phasePrev ? "← 上一环节：" + SS_PHASES[subTab - 1]
    : (pvGrpPrev ? "← 上一组：" + pvGrpPrevName
      : (rvGrpPrev ? "← 上一组：" + rvGrpPrevName
        : (prevDec ? "← 上一个决策" : "← 上一步")));
  const nextLabel = phaseNext ? "下一环节：" + SS_PHASES[subTab + 1] + " →"
    : (pvGrpNext ? "下一组：" + pvGrpNextName + " →"
      : (rvGrpNext ? "下一组：" + rvGrpNextName + " →"
        : (moreDec ? "下一个决策 →"
          : (loopNext ? "开启新一轮 →" : (isLast ? (rvInFlow(values) ? "保存并生成报告" : "保存记录") : "下一步 →")))));
  const navRow =
    '<div class="nav-row">' +
      (cur > minCur ? '<button class="btn secondary" id="btn-prev">' + esc(prevLabel) + '</button>' : '<button class="btn secondary" id="btn-home">← 返回首页</button>') +
      '<span class="nav-note">' + (okGate ? "" : esc(gateHint(entry))) + '</span>' +
      '<button class="btn" id="btn-next" ' + (okGate ? "" : "disabled") + '>' + esc(nextLabel) + '</button>' +
    '</div>';

  const scopeStr = inRv ? "rv" : scopeStrFor(entry);
  const scopeVals = inRv ? rvV() : resolveScope(scopeStr, false);
  const meta = stepMetaFor(entry, scopeVals);
  const metaHtml = meta ? '<div class="meta-note">' + esc(meta) + '</div>' : "";
  const syncHtml = inRv ? rvSyncNote(entry.step.id) : "";
  const modTag = inRv ? ("复盘 · 阶段" + ["一", "二", "三", "四"][entry.step.phase] + " · ")
    : (entry.mod ? MODS[entry.mod].name + " · " : "");
  const roundTag = (entry.mod === "pm" && pmRound > 0) ? "第 " + (pmRound + 1) + " 轮 · " : "";
  /* 决策切换器：复盘阶段逐决策的步骤，多于一个决策时显示 */
  const decBar = (isDecStep && dps.length > 1)
    ? '<div class="dec-bar">' + dps.map((p, di) =>
        '<span class="step-chip dec-pill' + (di === rvDecIdx ? " active" : "") + '" data-dec="' + di + '">' +
          '<span class="dec-pill-txt">决策 ' + (di + 1) + '：' + esc(p.d || "（未填）") + '</span></span>'
      ).join("") + '</div>'
    : "";
  const grpBar = (isRvViewStep && rvViewGroups.length > 1)
    ? '<div class="dec-bar">' + rvViewGroups.map((g, gi) =>
        '<span class="step-chip dec-pill' + (gi === rvVtTab ? " active" : "") + '" data-vtview="' + gi + '">' +
          '<span class="dec-pill-txt">' + esc(rvGrpName(g, gi)) + '</span></span>'
      ).join("") + '</div>'
    : "";
  const s0H2 = (!entry.mod && !entry.rv && values.mode === "rv") ? "起始 · 给要复盘的决策起名" : null;
  const leftCard =
    '<div class="step-card">' +
      '<div class="step-head">' +
        '<span class="tag">' + esc(modTag + roundTag) + '第 ' + (cur - curGroup.first + 1) + ' 步 · ' + esc(entry.step.tag) + '</span>' +
        '<h2>' + esc(s0H2 || (entry.rv ? entry.step.title : (ssStepTitle(entry) || entry.step.title))) + '</h2>' +
      '</div>' +
      '<div class="step-body">' + decBar + grpBar + syncHtml + metaHtml + stepBody(entry, false, scopeStr, true) + navRow + '</div>' +
    '</div>';

  /* 右栏：回顾（可翻阅并就地修改前面填过的内容） / 基准（基准库摘要，辅助复盘用——决策会话不展示） */
  const navItems = [];
  if (entry.mod === "pm") for (let r = 0; r < pmRound; r++) navItems.push({ kind: "round", idx: r });
  for (let i = 0; i < cur; i++) navItems.push({ kind: "step", idx: i });
  if (navItems.length && (rightTab == null || rightTab < 0 || rightTab > navItems.length - 1)) rightTab = navItems.length - 1;
  const noBase = values.mode === "dec";
  const tab = noBase ? "review" : (auxTab || (cur === 0 ? "base" : "review"));
  const auxTabs =
    '<div class="aux-tabs">' +
      '<button type="button" class="aux-tab' + (tab === "review" ? " on" : "") + '" data-aux="review"><span>回顾</span></button>' +
      (noBase ? "" : '<button type="button" class="aux-tab' + (tab === "base" ? " on" : "") + '" data-aux="base"><span>基准</span></button>') +
    '</div>';
  let auxBody = "";
  if (tab === "review") {
    if (!navItems.length) {
      auxBody = '<div class="review-card"><div class="review-body">' +
        '<p class="empty-hint">完成第 1 步后，这里可以翻阅并就地修改已填写的内容。</p>' +
      '</div></div>';
    } else {
      const it = navItems[rightTab];
      const jump = rvReviewJumpHtml(navItems, rightTab, entries);
      let headTxt = "";
      if (it.kind === "round") {
        const rv0 = peekModScope(ensureModScope("pm"), it.idx);
        headTxt = '第 ' + (it.idx + 1) + ' 轮记录 · ' + (String(rv0[MOD_PM.titleKey] || "").trim() || "未命名");
      } else {
        const e2 = entries[it.idx];
        headTxt = '回顾 · ' + (e2.rv ? ("复盘 · " + RV_PHASES[e2.step.phase].short + " · ") : (e2.mod ? MODS[e2.mod].name + " · " : "")) +
          esc(e2.rv ? e2.step.title : (ssStepTitle(e2) || e2.step.title));
      }
      const nav =
        '<div class="rv-nav">' +
          (navItems.length > 1 ? '<button class="rv-arrow" data-rtprev' + (rightTab <= 0 ? " disabled" : "") + '>‹</button>' : "") +
          '<h3 style="flex:1;">' + headTxt + '（' + (rightTab + 1) + '/' + navItems.length + '）</h3>' +
          (navItems.length > 1 ? '<button class="rv-arrow" data-rtnext' + (rightTab >= navItems.length - 1 ? " disabled" : "") + '>›</button>' : "") +
        '</div>';
      if (it.kind === "round") {
        /* pm 历史轮次：整轮只读回顾 */
        const rv0 = peekModScope(ensureModScope("pm"), it.idx);
        let recapBody = "";
        MOD_PM.steps.forEach(st => {
          const fs = (MOD_PM.fields(st.id, rv0) || []).filter(f => f.type !== "note" && f.key !== "new_round" && (!f.showIf || f.showIf(rv0)));
          recapBody += '<div class="lr-step"><b>' + esc(st.title) + '</b>' + fs.map(f => renderRV(f, rv0)).join("") + '</div>';
        });
        auxBody =
          '<div class="review-card">' +
            jump +
            '<div class="review-head">' + nav + '</div>' +
            '<div class="review-body locked">' + recapBody + '</div>' +
          '</div>';
      } else {
        const i = it.idx;
        const e2 = entries[i];
        const editing = reviewEdit === i;
        const rScopeStr = e2.rv ? "rv" : scopeStrFor(e2);
        const rScope = e2.rv ? rvV() : resolveScope(rScopeStr, false);
        const rMeta = stepMetaFor(e2, rScope);
        /* 复盘阶段逐决策的步骤：回顾卡有自己的决策切换器，不影响左侧 */
        const rIsDec = e2.rv && DEC_STEP_IDS.indexOf(e2.step.id) >= 0;
        const rDecRows = rIsDec ? decPairs(rvV()) : [];
        let rDecIdx = rIsDec ? reviewDecIdx : 0;
        if (rIsDec && rDecRows.length) {
          rDecIdx = Math.max(0, Math.min(rDecRows.length - 1, reviewDecIdx));
          reviewDecIdx = rDecIdx;
        }
        const rDecBar = rIsDec && rDecRows.length > 1
          ? '<div class="dec-bar sm">' + rDecRows.map((p, di) =>
              '<span class="step-chip dec-pill' + (di === rDecIdx ? " active" : "") + '" data-rvdec="' + di + '">' +
                '<span class="dec-pill-txt">决策 ' + (di + 1) + '：' + esc(p.d || "（未填）") + '</span></span>'
            ).join("") + '</div>'
          : "";
        const rIsView = e2.rv && (e2.step.id === "s8" || e2.step.id === "s9");
        const rVtKey = e2.step.id;
        const rVtGroups = rIsView
          ? (rvViewNorm(rvV()), (Array.isArray(rvV().vt) ? rvV().vt : []))
          : [];
        const rVtTab = rVtGroups.length
          ? Math.max(0, Math.min(rVtGroups.length - 1, Number(reviewVtTabs[rVtKey]) || 0))
          : 0;
        if (rIsView) reviewVtTabs[rVtKey] = rVtTab;
        const rVtBar = rVtGroups.length > 1
          ? '<div class="dec-bar sm">' + rVtGroups.map((g, gi) =>
              '<span class="step-chip dec-pill' + (gi === rVtTab ? " active" : "") + '" data-rvvtview="' + gi + '" data-rvvtkey="' + esc(rVtKey) + '">' +
                '<span class="dec-pill-txt">' + esc(rvGrpName(g, gi)) + '</span></span>'
            ).join("") + '</div>'
          : "";
        /* ss 决策分析页：右侧回顾卡也按三个环节切换，和左侧同一套页签 */
        const rIsSd = e2.mod === "ss" && e2.step.base === "sd" && e2.step.di != null;
        const rSubKey = e2.step.id;
        const rSub = rIsSd ? Math.max(0, Math.min(SS_PHASES.length - 1, Number(reviewSubTabs[rSubKey]) || 0)) : 0;
        const rTabs = rIsSd
          ? '<div class="otabs rv-subtabs">' + SS_PHASES.map((t, ti) =>
              '<button type="button" class="otab' + (ti === rSub ? " active" : "") + '" data-rvsub="' + ti + '" data-rvsubkey="' + esc(rSubKey) + '">' + esc(t) + '</button>'
            ).join("") + '</div>'
          : "";
        auxBody =
          '<div class="review-card" data-rvstep="' + esc(e2.step.id) + '">' +
            jump +
            '<div class="review-head">' + nav +
              '<button class="btn-edit ' + (editing ? "on" : "") + '" data-review="' + i + '">' + (editing ? "完成" : "编辑") + '</button>' +
            '</div>' +
            '<div class="review-body' + (editing ? "" : " locked") + '">' +
              rDecBar + rVtBar +
              (rMeta ? '<div class="meta-note">' + esc(rMeta) + '</div>' : "") +
              rTabs +
              stepBody(e2, !editing, rScopeStr, false, rSub, rVtTab, rIsDec ? rDecIdx : null) +
            '</div>' +
          '</div>';
      }
    }
  } else {
    auxBody = baselineSummaryCard();
  }
  const rightCol = '<div class="review-col aux">' + auxTabs + auxBody + '</div>';

  /* 会话工具条：两个阶段都能随时停下；只有编辑已保存的报告时才走「保存更新」那一套 */
  const isEditSession = !!editingReport;
  const curDraft = DRAFT_ID != null ? findDraft(DRAFT_ID) : null;
  const draftBar =
    '<div class="edit-bar' + (isEditSession ? "" : " auto") + '">' +
      '<span class="eb-txt">' + (isEditSession
        ? (values.rvFocus
          ? '正在复盘「' + esc(editingReport.title || "未命名") + '」——「暂存进度回首页」把进度存成草稿（报告仍待复盘），「保存更新这份报告」把复盘并入报告。'
          : '正在编辑已保存的报告「' + esc(editingReport.title || "未命名") + '」——保存后更新这一份，不会新增。')
        : '进度已自动保存' + (curDraft ? '（' + esc(curDraft.updated) + '）' : '') + '：随时可以停下，下次从首页的「进行中的记录」接着走。') + '</span>' +
      (isEditSession
        ? (values.rvFocus ? '<button type="button" class="btn-edit" data-savehome="1">暂存进度回首页</button>' : "") +
          '<button type="button" class="btn-edit" data-finishrep="1">保存更新这份报告</button>' +
          '<button type="button" class="btn-edit danger" id="btn-cancel-edit">放弃编辑</button>'
        : '<button type="button" class="btn-edit" data-savehome="1">保存并回首页</button>' +
          '<button type="button" class="btn-edit" data-finishrep="1">' + (values.mode === "dec" ? "存入进行中" : "存档为报告") + '</button>' +
          '<button type="button" class="btn-edit danger" id="btn-drop-draft">放弃草稿</button>') +
    '</div>';
  app.innerHTML =
    draftBar +
    '<div class="phase-bar">' + phaseChips + '</div>' +
    '<div class="stepper">' + chips + '</div>' +
    '<div class="split">' + leftCard + rightCol + '</div>';

  bindFieldEvents(app);
  rvBindFieldEvents(app);
  const cancelEdit = document.getElementById("btn-cancel-edit");
  if (cancelEdit) cancelEdit.onclick = cancelEditReport;
  const dropDraft = document.getElementById("btn-drop-draft");
  if (dropDraft) dropDraft.onclick = () => {
    if (!confirm("放弃这条草稿吗？已填写的内容会被删除（已完成的报告不受影响）。")) return;
    dropCurrentDraft();
    values = {};
    editingReport = null;
    resetNavState();
    viewingReport = null;
    view = "home";
    goRender();
  };
  app.querySelectorAll("[data-savehome]").forEach(el => {
    el.onclick = () => { saveDraft(); viewingReport = null; view = "home"; goRender(); };
  });
  app.querySelectorAll("[data-finishrep]").forEach(el => {
    el.onclick = () => {
      /* 中途存档：空白会话不生成空报告 */
      if (!editingReport && !draftHasContent(values)) { alert("还没有填写内容——先写一点，再" + (values.mode === "dec" ? "存入进行中" : "存档为报告") + "。"); return; }
      finishReport();
    };
  });
  app.querySelectorAll("[data-aux]").forEach(el => {
    el.onclick = () => { auxTab = el.dataset.aux; render(); };
  });
  app.querySelectorAll("[data-basesub]").forEach(el => {
    el.onclick = () => { baseSubTab = el.dataset.basesub; render(); };
  });
  const auxbase = app.querySelector("#btn-auxbase");
  if (auxbase) auxbase.onclick = () => { baseFrom = "wizard"; view = "baseline"; goRender(); };
  app.querySelectorAll("[data-dec]").forEach(el => {
    el.onclick = () => { rvDecIdx = Number(el.dataset.dec); rvVtTab = 0; render(); };
  });
  app.querySelectorAll("[data-vtview]").forEach(el => {
    el.onclick = () => { rvVtTab = Number(el.dataset.vtview); render(); };
  });
  app.querySelectorAll("[data-rvvtview]").forEach(el => {
    el.onclick = () => { reviewVtTabs[el.dataset.rvvtkey] = Number(el.dataset.rvvtview); render(); };
  });
  app.querySelectorAll("[data-rvdec]").forEach(el => {
    el.onclick = () => { reviewDecIdx = Number(el.dataset.rvdec); render(); };
  });
  app.querySelectorAll("[data-rvsync]").forEach(el => {
    el.onclick = () => { applyReviewSync(true); render(); };
  });
  app.querySelectorAll("[data-goto]").forEach(el => {
    el.onclick = () => { cur = Number(el.dataset.goto); rvDecIdx = 0; rvVtTab = 0; reviewEdit = -1; rightTab = null; subTab = 0; pvTab = 0; saveDraft(); goRender(); };
  });
  app.querySelectorAll("[data-review]").forEach(el => {
    el.onclick = () => { reviewEdit = (reviewEdit === Number(el.dataset.review)) ? -1 : Number(el.dataset.review); render(); };
  });
  app.querySelectorAll("[data-rvsub]").forEach(el => {
    el.onclick = () => {
      reviewSubTabs[el.dataset.rvsubkey] = Number(el.dataset.rvsub);
      render();
    };
  });
  app.querySelectorAll("[data-rtprev]").forEach(el => {
    el.onclick = () => { rightTab = Math.max(0, rightTab - 1); reviewEdit = -1; render(); };
  });
  app.querySelectorAll("[data-rtnext]").forEach(el => {
    el.onclick = () => { rightTab = rightTab + 1; reviewEdit = -1; render(); };
  });
  app.querySelectorAll("[data-rtjump]").forEach(el => {
    el.onclick = () => {
      const idx = Number(el.dataset.rtjump);
      if (idx >= 0 && idx < navItems.length) { rightTab = idx; reviewEdit = -1; render(); }
    };
  });
  const prev = document.getElementById("btn-prev");
  if (prev) prev.onclick = () => {
    if (phasePrev) { subTab--; saveDraft(); goRender(); return; }
    if (pvGrpPrev) { pvTab--; reviewEdit = -1; saveDraft(); goRender(); return; }
    if (rvGrpPrev) { rvVtTab--; reviewEdit = -1; saveDraft(); goRender(); return; }
    if (prevDec) { rvDecIdx--; saveDraft(); goRender(); return; }
    /* 换环节/换阶段：决策下标与组页签都从第 1 个重新开始；退回逐决策的步骤时落在最后一个决策上 */
    cur--; reviewEdit = -1; rightTab = null; subTab = 0; pvTab = 0; rvVtTab = 0;
    /* 复盘聚焦模式：「上一步」不越过第一个复盘步（再往上由「返回首页」接管） */
    if (cur < minCur) cur = minCur;
    const back = entries[cur];
    rvDecIdx = (back && back.rv && DEC_STEP_IDS.indexOf(back.step.id) >= 0) ? Math.max(0, decPairs(rvV()).length - 1) : 0;
    saveDraft(); goRender();
  };
  const home = document.getElementById("btn-home");
  if (home) home.onclick = () => { view = "home"; goRender(); };
  document.getElementById("btn-next").onclick = () => {
    if (phaseNext) { subTab++; saveDraft(); goRender(); }
    else if (pvGrpNext) { pvTab++; reviewEdit = -1; saveDraft(); goRender(); }
    else if (rvGrpNext) { rvVtTab++; reviewEdit = -1; saveDraft(); goRender(); }
    else if (moreDec) { rvDecIdx++; saveDraft(); goRender(); }
    else if (loopNext) {
      pmRound++;
      resolveScope("m:pm@" + pmRound, true);
      const pmFirst = entries.map((e, i) => ({ e: e, i: i })).filter(x => x.e.mod === "pm").map(x => x.i)[0];
      cur = pmFirst >= 0 ? pmFirst : 0;
      reviewEdit = -1; rightTab = null; subTab = 0; rvDecIdx = 0; rvVtTab = 0;
      saveDraft(); goRender();
    }
    else if (isLast) finishReport();
    else { cur++; reviewEdit = -1; rightTab = null; subTab = 0; pvTab = 0; rvDecIdx = 0; rvVtTab = 0; saveDraft(); goRender(); }
  };
}


/* ---------- 步骤主体 ---------- */
function stepBody(entry, locked, scopeStr, isMain, subOverride, vtOverride, decOverride, includeWizHide) {
  if (entry.rv) return rvStepBody(entry, locked, vtOverride, decOverride);
  const scope = resolveScope(scopeStr, false);
  /* 从最初环节带入、不需重复填写的字段：向导里不展示（报告里照常收录） */
  let fs = fieldsForEntry(entry, scope).filter(f => includeWizHide || !f.wizHide);
  /* ss 决策分析页：按外层环节页签只渲染当前环节。
     主编辑区用 subTab；右侧回顾卡用 reviewSubTabs 里该页签自己记住的环节。 */
  if (entry.mod === "ss" && entry.step.base === "sd" && entry.step.di != null) {
    const sub = isMain ? subTab : (subOverride != null ? subOverride : 0);
    fs = fs.filter(f => f.pg == null || f.pg === sub);
  }
  /* 内外视角：多组观点追踪用顶部页签切换，主编辑区与右侧回顾卡都只显示当前组（页签控件在回顾里仍可用） */
  if (entry.mod === "pv") {
    const n = pvVtGroups(pvNorm(resolveScope(scopeStr, false))).length;
    if (pvTab > n - 1) pvTab = Math.max(0, n - 1);
    if (pvTab < 0) pvTab = 0;
    fs = fs.filter(f => !f.whenActive || f.gi === pvTab);
  }
  /* 右侧回顾卡自己画环节页签，不再渲染主编辑区那组 ptabs */
  if (!isMain) fs = fs.filter(f => f.type !== "ptabs");
  return renderFields(fs, locked, scopeStr);
}

/* 复盘阶段的步骤主体：逐决策的步骤只渲染当前决策；内外视角 / 视角校准按当前观点追踪组渲染。
   vtOverride / decOverride 是右侧回顾卡传进来的组下标和决策下标；不传则用主编辑区状态。 */
function rvStepBody(entry, locked, vtOverride, decOverride) {
  const v = rvV();
  const decIdx = decOverride != null ? decOverride : rvDecIdx;
