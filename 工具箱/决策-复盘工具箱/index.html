  const onlyIdx = DEC_STEP_IDS.indexOf(entry.step.id) >= 0 ? decIdx : null;
  const fs = RV_FIELDS(entry.step.id, v, onlyIdx) || [];
  const isViewStep = entry.step.id === "s8" || entry.step.id === "s9";
  if (isViewStep) rvViewNorm(v);
  const groups = (isViewStep && Array.isArray(v.vt)) ? v.vt : [];
  let vtGroup = null;
  if (isViewStep && groups.length > 1) {
    if (vtOverride != null) {
      vtGroup = Math.max(0, Math.min(groups.length - 1, Number(vtOverride) || 0));
    } else {
      if (rvVtTab > groups.length - 1) rvVtTab = 0;
      vtGroup = rvVtTab;
    }
  }
  return rvRenderFields(fs, locked, vtGroup);
}



/* ---------- 字段渲染（half 半栏分组移植自 six-step） ---------- */
function renderFields(fields, locked, scopeStr) {
  const scope = resolveScope(scopeStr, false);
  let html = "";
  let buf = [];
  const flush = () => {
    if (buf.length) { html += '<div class="half-row">' + buf.join("") + '</div>'; buf = []; }
  };
  fields.forEach(f => {
    if (f.showIf && !f.showIf(scope)) return;
    if (f.half) { buf.push(renderField(f, locked, scopeStr)); if (buf.length === 2) flush(); return; }
    flush();
    html += renderField(f, locked, scopeStr);
  });
  flush();
  return html;
}

/* checklist 行收集：可选 lead 指定的单值字段排在最前，其后是各 sources 列表 */
function collectRows(f, v) {
  let rows = [];
  if (f.lead && String(v[f.lead] || "").trim()) rows.push({ t: String(v[f.lead]).trim() });
  return rows.concat((f.sources || []).reduce((acc, k) => acc.concat((Array.isArray(v[k]) ? v[k] : []).filter(x => (x.t || "").trim())), []));
}


function renderField(f, locked, scopeStr) {
  /* grp 字段（内外视角的多组观点 / 多组校准）：读写落在对应组的数据对象上，
   * data-scope 仍写模块作用域，事件层用 data-grp/data-gi 找回落点 */
  const scope = f.grp ? pvGroupObj(resolveScope(scopeStr, false), f.grp, f.gi, false) : resolveScope(scopeStr, false);
  if (f.showIf && !f.showIf(scope)) return "";
  const lk = (locked || f.ro) ? " locked" : "";
  const dis = (locked || f.ro) ? " disabled" : "";
  const ds = ' data-scope="' + scopeStr + '"' + (f.grp ? ' data-grp="' + f.grp + '" data-gi="' + f.gi + '"' : "");
  const radioName = f.key ? f.key + "__" + String(scopeStr).replace(/[^a-zA-Z0-9]/g, "_") : "";
  const v = f.key != null ? scope[f.key] : null;
  let body = "";
  if (f.type === "modpick") {
    /* s0 专用：自定义组合 vs 默认流程（互斥）。
     * 自定义：模块卡勾选 + 下方词条列表（⠿ HTML5 拖拽排序，顺序即执行顺序）；
     * 默认流程：独立选项卡，选中即 sel = dp→ss→pv→pm，模块卡不显勾选态、不出词条列表。 */
    const mode = values.flowmode === "default" ? "default" : "custom";
    const sel = selOf(values);
    const defOn = mode === "default";
    body = '<div class="mp-grid">' + MODULE_LIST.map(m => {
      const on = mode === "custom" && sel.indexOf(m.id) >= 0;
      return '<div class="mp-card' + (on ? " on" : "") + lk + '" data-mp="' + m.id + '">' +
        '<div class="mp-top"><span class="mp-check">' + (on ? "✔" : "") + '</span>' +
          '<span class="mp-name">' + esc(m.name) + '</span></div>' +
        '<div class="mp-src">' + esc(m.src) + '</div>' +
        '<div class="mp-desc">' + esc(m.desc) + '</div>' +
      '</div>';
    }).join("") +
    '<div class="mp-card mp-default' + (defOn ? " on" : "") + lk + '" data-mpdefault="1">' +
      '<div class="mp-top"><span class="mp-check">' + (defOn ? "✔" : "") + '</span>' +
        '<span class="mp-name">使用默认流程</span></div>' +
      '<div class="mp-src">一键全选 · 顺序固定</div>' +
      '<div class="mp-desc">决策速度 → 六步决策 → 内外视角 → 事前验尸</div>' +
    '</div></div>';
    if (mode === "custom" && sel.length) {
      body += '<div class="sel-list">' + sel.map((mid, i) =>
        '<div class="sel-row' + lk + '"' + (locked ? "" : ' data-drop-lk="sel" data-ri="' + i + '"' + ds) + '>' +
          (locked
            ? '<span class="sel-drag off">⠿</span>'
            : '<span class="sel-drag" draggable="true" data-drag-lk="sel" data-ri="' + i + '"' + ds + ' title="拖动调整执行顺序">⠿</span>') +
          '<span class="sel-ord">' + (i + 1) + '</span>' +
          '<span class="sel-name">' + esc(MODS[mid].name) + '</span>' +
        '</div>').join("") + '</div>';
    }
  } else if (f.type === "text") {
    const tv = (typeof f.value === "function") ? f.value(scope) : v;
    body = '<input type="text" data-k="' + f.key + '"' + ds + dis + ' value="' + esc(tv == null ? "" : tv) + '" placeholder="' + esc(f.placeholder || "") + '">';
  } else if (f.type === "textarea") {
    body = '<textarea data-k="' + f.key + '"' + ds + ' rows="3"' + dis + ' placeholder="' + esc(f.placeholder || "") + '">' + esc(v || "") + '</textarea>';
  } else if (f.type === "radio") {
    body = '<div class="radio-group' + (f.inline ? " inline" : "") + lk + '">' + f.options.map(op =>
      '<label class="radio-option ' + (v === op[0] ? "checked" : "") + lk + '">' +
        '<input type="radio" name="' + radioName + '" data-k="' + f.key + '"' + ds + ' value="' + op[0] + '" ' + (v === op[0] ? "checked" : "") + dis + '>' +
        '<span>' + esc(op[1]) + (op[2] ? '<span class="opt-desc">' + esc(op[2]) + '</span>' : "") + '</span>' +
      '</label>').join("") + '</div>';
  } else if (f.type === "checks") {
    /* 多选（选项带说明）：点整行切换勾选，值存成 { d0: "yes", … } */
    const on = (v && typeof v === "object") ? v : (typeof v === "string" && v ? { [v]: "yes" } : {});
    body = '<div class="radio-group">' + f.options.map(op => {
      const hit = on[op[0]] === "yes";
      return '<div class="radio-option ' + (hit ? "checked" : "") + lk + '" data-mcheck="' + f.key + '" data-mv="' + op[0] + '"' + ds + '>' +
        '<span class="sq-check' + (hit ? " checked" : "") + '">' + (hit ? "✔" : "") + '</span>' +
        '<span>' + esc(op[1]) + (op[2] ? '<span class="opt-desc">' + esc(op[2]) + '</span>' : "") + '</span>' +
      '</div>';
    }).join("") + '</div>';
  } else if (f.type === "score") {
    body = '<div class="score-row' + lk + '">' +
      '<span class="score-endlabel">低</span>' +
      [0,1,2,3,4,5].map(n =>
        '<button type="button" class="score-btn ' + (Number(v) === n ? "checked" : "") + '" data-score="' + f.key + '" data-val="' + n + '"' + ds + dis + '>' + n + '</button>'
      ).join("") +
      '<span class="score-endlabel right">高</span>' +
    '</div>';
  } else if (f.type === "list") {
    const rows = Array.isArray(v) ? v : [];
    const rowsHtml = rows.length === 0
      ? (f.emptyHint ? '<div class="list-empty-hint">' + esc(f.emptyHint) + '</div>' : "")
      : '<div class="list-rows">' + rows.map((row, ri) =>
          '<div class="list-row">' +
            '<span class="idx">' + (ri + 1) + '.</span>' +
            '<textarea data-lk="' + f.key + '" data-ri="' + ri + '" data-rk="t"' + ds + ' rows="1"' + dis + ' placeholder="' + esc(f.itemPlaceholder || "") + '">' + esc(row.t || "") + '</textarea>' +
            '<button type="button" class="row-remove" data-rmrow="' + f.key + '" data-ri="' + ri + '"' + ds + ' title="删除本条"' + dis + '>×</button>' +
          '</div>').join("") + '</div>';
    body = rowsHtml +
      '<button type="button" class="list-add" data-addrow="' + f.key + '"' + ds + dis + '>＋ 添加一条</button>';
  } else if (f.type === "chipslist") {
    const rows = Array.isArray(v) ? v : [];
    const rowsHtml = rows.length === 0
      ? (f.emptyHint ? '<div class="list-empty-hint">' + esc(f.emptyHint) + '</div>' : "")
      : '<div class="list-rows">' + rows.map((row, ri) =>
          '<div class="list-row">' +
            '<span class="idx">' + (ri + 1) + '.</span>' +
            '<div class="grow" style="flex:1;display:flex;flex-direction:column;gap:8px;">' +
              '<textarea data-lk="' + f.key + '" data-ri="' + ri + '" data-rk="t"' + ds + ' rows="1"' + dis + ' placeholder="' + esc(f.itemPlaceholder || "") + '">' + esc(row.t || "") + '</textarea>' +
              '<div class="row-cmp">' + f.chips.map(ch =>
                '<span class="chip ' + (row.c === ch[0] ? "checked" : "") + '" data-chip-lk="' + f.key + '" data-ri="' + ri + '" data-chip="' + ch[0] + '"' + ds + dis + '>' + esc(ch[1]) + '</span>'
              ).join("") + '</div>' +
            '</div>' +
            '<button type="button" class="row-remove" data-rmrow="' + f.key + '" data-ri="' + ri + '"' + ds + ' title="删除本条"' + dis + '>×</button>' +
          '</div>').join("") + '</div>';
    body = rowsHtml +
      '<button type="button" class="list-add" data-addrow="' + f.key + '"' + ds + dis + '>＋ 添加一条</button>';
  } else if (f.type === "assess") {
    const rows = f.sources.reduce((acc, k) => acc.concat((Array.isArray(scope[k]) ? scope[k] : []).filter(x => (x.t || "").trim())), []);
    if (rows.length === 0) {
      body = '<div class="field-hint">' + esc(f.emptyHint || "请先在前面填写对应的条目，这里会自动生成逐条评定。") + '</div>';
    } else {
      const ans = v || {};
      body = rows.map((row, ri) => {
        const a = ans["i" + ri];
        return '<div class="as-row' + lk + '">' +
          '<div class="as-item">' + (ri + 1) + '. ' + esc(row.t || "") + '</div>' +
          '<div class="as-btns">' +
            f.options.map(op => {
              const pickedCls = a === op[0] ? " " + op[2] : "";
              return '<span class="as-btn' + pickedCls + '" data-assess="' + f.key + '" data-i="' + ri + '" data-v="' + op[0] + '"' + ds + dis + '>' + esc(op[1]) + '</span>';
            }).join("") +
          '</div>' +
        '</div>';
      }).join("");
    }
  } else if (f.type === "checklist") {
    const rows = collectRows(f, scope);
    if (rows.length === 0) {
      body = '<div class="field-hint">' + esc(f.emptyHint || "请先在前面填写对应的条目，这里会自动生成逐条勾选。") + '</div>';
    } else {
      const ans = v || {};
      body = '<div class="cl-list">' + rows.map((row, ri) => {
        const on = !!ans["i" + ri];
        return '<div class="cl-row' + lk + '">' +
          '<span class="cl-item">' + (ri + 1) + '. ' + esc(row.t || "") + '</span>' +
          '<button type="button" class="sq-check' + (on ? " checked" : "") + '" data-check="' + f.key + '" data-i="' + ri + '"' + ds + dis + ' title="满意就打勾">' + (on ? "✔" : "") + '</button>' +
        '</div>';
      }).join("") + '</div>';
    }
  } else if (f.type === "triplist") {
    const rows = Array.isArray(v) ? v : [];
    const colPh = kk => { const c = (f.cols || []).find(x => x[0] === kk); return c ? c[1] : ""; };
    const rowsHtml = rows.length === 0
      ? (f.emptyHint ? '<div class="list-empty-hint">' + esc(f.emptyHint) + '</div>' : "")
      : '<div class="list-rows">' + rows.map((row, ri) =>
          '<div class="list-row">' +
            '<span class="idx">' + (ri + 1) + '.</span>' +
            '<div class="grow" style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;">' +
              '<input type="text" data-lk="' + f.key + '" data-ri="' + ri + '" data-rk="a"' + ds + dis + ' value="' + esc(row.a || "") + '" placeholder="' + esc(colPh("a")) + '">' +
              '<div class="tri-sub">' +
                '<input type="text" data-lk="' + f.key + '" data-ri="' + ri + '" data-rk="b"' + ds + dis + ' value="' + esc(row.b || "") + '" placeholder="' + esc(colPh("b")) + '">' +
                '<input type="text" data-lk="' + f.key + '" data-ri="' + ri + '" data-rk="c"' + ds + dis + ' value="' + esc(row.c || "") + '" placeholder="' + esc(colPh("c")) + '">' +
              '</div>' +
            '</div>' +
            '<button type="button" class="row-remove" data-rmrow="' + f.key + '" data-ri="' + ri + '"' + ds + ' title="删除本条"' + dis + '>×</button>' +
          '</div>').join("") + '</div>';
    body = rowsHtml +
      '<button type="button" class="list-add" data-addrow="' + f.key + '"' + ds + dis + '>＋ 添加一条</button>';
  } else if (f.type === "pvtabs") {
    /* 内外视角的多组页签：切换当前组（增删组在组卡片里，页签只负责切换） */
    const mv = resolveScope(scopeStr, true);
    pvNorm(mv);
    const groups = f.kind === "cal" ? mv.cal_groups : mv.vt_groups;
    if (groups.length < 2) return "";
    const tabs = groups.map((g, i) =>
      '<button type="button" class="otab' + (i === pvTab ? " active" : "") + '" data-pvtab="' + i + '"' + ds + '>' +
      esc(pvGroupName(mv.vt_groups[i], i)) + '</button>').join("");
    return '<div class="field' + lk + '">' +
      (f.label ? '<label class="field-label">' + esc(f.label) + '</label>' : "") +
      '<div class="pv-grp-bar">' + tabs + '</div>' +
    '</div>';
  } else if (f.type === "vtgroup") {
    /* 简约卡片：卡头 = 组名输入 + × 删除本组；卡内 = 外/内双栏；卡下 = 整条「添加一组」 */
    const head = '<div class="vt-group-head">' +
      '<input type="text" class="vt-group-name" data-k="name"' + ds + dis + ' value="' + esc(scope.name || "") + '" placeholder="给这组观点追踪起个名，如：请教了同事 / 行业基准">' +
      (locked ? "" : '<button type="button" class="row-remove" data-pvrmgroup="1"' + ds + ' title="删除本组">×</button>') +
    '</div>';
    const inner = renderField({ type: "viewtrack", key: "vt", grp: f.grp, gi: f.gi, bare: true }, locked, scopeStr);
    return '<div class="vt-group' + lk + '">' + head + inner + '</div>' +
      (locked ? "" : '<button type="button" class="list-add" data-pvaddgroup="1"' + ds + '>＋ 添加一组观点追踪</button>');
  } else if (f.type === "calgroup") {
    /* 校准与结论：与观点追踪逐组对应的卡片（卡头写明是哪一组的校准） */
    const mv = resolveScope(scopeStr, false);
    const inner = (f.subs || []).map(sf => renderField(sf, locked, scopeStr)).join("");
    return '<div class="vt-group' + lk + '">' +
      '<div class="bs-cap">' + esc(pvGroupName((mv.vt_groups || [])[f.gi], f.gi)) + '</div>' +
      inner +
    '</div>';
  } else if (f.type === "viewtrack") {
    const col = (key, cls, title, hint, ph) => {
      const rows = Array.isArray(scope[key]) ? scope[key] : [];
      const rowsHtml = rows.length === 0
        ? '<div class="list-empty-hint">点击下方按钮添加一条</div>'
        : '<div class="list-rows">' + rows.map((row, ri) =>
            '<div class="list-row">' +
              '<span class="idx">' + (ri + 1) + '.</span>' +
              '<textarea data-lk="' + key + '" data-ri="' + ri + '" data-rk="t"' + ds + ' rows="2"' + dis + ' placeholder="' + esc(ph) + '">' + esc(row.t || "") + '</textarea>' +
              '<button type="button" class="row-remove" data-rmrow="' + key + '" data-ri="' + ri + '"' + ds + ' title="删除本条"' + dis + '>×</button>' +
            '</div>').join("") + '</div>';
      return '<div class="vt-col ' + cls + '">' +
        '<h4>' + esc(title) + '</h4>' +
        '<div class="vt-hint">' + esc(hint) + '</div>' +
        rowsHtml +
        '<button type="button" class="list-add" data-addrow="' + key + '"' + ds + dis + '>＋ 添加一条</button>' +
      '</div>';
    };
    const grid = '<div class="vt-grid">' +
        col("outside_views", "vt-outside", "外视角", "尽可能从旁观者的角度描述你的处境", "例：如果朋友遇到同样的问题，我会劝他……；同类情况的基准数是……") +
        col("inside_views", "vt-inside", "内视角", "尽可能从自己的角度描述你的处境", "例：从我的经历来看，我觉得……") +
      '</div>';
    if (f.bare) return grid;
    return '<div class="field' + lk + '">' +
      '<div class="vt-title">观点跟踪</div>' + grid +
    '</div>';
  } else if (f.type === "pcttable") {
    const groups = f.groups || [];
    const anyRows = groups.some(g =>
      (Array.isArray(scope[g.fail]) && scope[g.fail].some(x => (x.t || "").trim())) ||
      (Array.isArray(scope[g.succ]) && scope[g.succ].some(x => (x.t || "").trim())));
    if (!anyRows) {
      return '<div class="field' + lk + '"><div class="dt-title">决策表</div><div class="field-hint">' + esc(f.emptyHint || "请先在前面填写原因。") + '</div></div>';
    }
    const table = (srcKey, headTxt) => {
      const rows = Array.isArray(scope[srcKey]) ? scope[srcKey] : [];
      let n = 0;
      const rowsHtml = rows.map((row, ri) => {
        if (!(row.t || "").trim()) return "";
        n++;
        return '<div class="dt-row">' +
          '<div class="dt-reason"><span class="idx">' + n + '.</span><span>' + esc(row.t) + '</span></div>' +
          '<div class="dt-pct"><input type="text" inputmode="numeric" data-lk="' + srcKey + '" data-ri="' + ri + '" data-rk="p"' + ds + dis + ' value="' + esc(row.p || "") + '" placeholder="%"></div>' +
        '</div>';
      }).join("");
      return '<div class="dt-table">' +
        '<div class="dt-thead"><span>' + esc(headTxt) + '</span><span>%</span></div>' +
        (rowsHtml || '<div class="dt-empty">（此类暂未填写）</div>') +
      '</div>';
    };
    body = groups.map(g =>
      '<div class="dt-group">' +
        '<div class="dt-glabel">' + esc(g.label) + '</div>' +
        table(g.fail, '失败（“事前验尸”）') +
        table(g.succ, '成功（倒推）') +
      '</div>'
    ).join("");
    return '<div class="field' + lk + '"><div class="dt-title">决策表</div>' + body + '</div>';
  } else if (f.type === "strattable") {
    const rows = Array.isArray(scope[f.source]) ? scope[f.source] : [];
    let n = 0;
    const rowsHtml = rows.map((row, ri) => {
      if (!(row.t || "").trim()) return "";
      n++;
      const pct = fmtPct(row.p);
      return '<div class="st-row">' +
        '<div class="st-reason"><span class="idx">' + n + '.</span><span style="flex:1;min-width:0;">' + esc(row.t) + '</span>' +
          '<span class="st-pctbadge' + (pct ? "" : " none") + '">' + (pct ? esc(pct) : "未评估") + '</span></div>' +
        '<div class="st-input"><textarea data-lk="' + f.source + '" data-ri="' + ri + '" data-rk="' + f.rk + '"' + ds + ' rows="1"' + dis + ' placeholder="' + esc(f.placeholder || "") + '">' + esc(row[f.rk] || "") + '</textarea></div>' +
      '</div>';
    }).join("");
    body = '<div class="st-table">' +
      '<div class="st-thead"><div class="st-h-reason" style="flex:0 0 50%;">' + esc(f.headLeft || "原因") + '</div><div class="st-h-input" style="flex:0 0 50%;">' + esc(f.headRight || "策略") + '</div></div>' +
      (rowsHtml || '<div class="st-empty">' + esc(f.emptyHint || "（暂无条目）") + '</div>') +
    '</div>';
  } else if (f.type === "otree") {
    const rows = Array.isArray(v) ? v : [];
    const branchRows = rows.map((row, ri) =>
      '<div class="dt-branch"' + (locked ? "" : ' data-drop-lk="' + f.key + '" data-ri="' + ri + '"' + ds) + '>' +
        '<div class="dt-arrow">→</div>' +
        '<div class="dt-branch-body">' +
          '<textarea data-lk="' + f.key + '" data-ri="' + ri + '" data-rk="t"' + ds + ' rows="1"' + dis + ' placeholder="写一个潜在结果">' + esc(row.t || "") + '</textarea>' +
        '</div>' +
        (locked ? "" : '<span class="dt-drag" draggable="true" data-drag-lk="' + f.key + '" data-ri="' + ri + '"' + ds + ' title="拖动排序：从上到下是你更偏好的结果">⠿</span>') +
        '<button type="button" class="row-remove" data-rmrow="' + f.key + '" data-ri="' + ri + '"' + ds + ' title="删除本条"' + dis + '>×</button>' +
      '</div>').join("");
    body =
      '<div class="dt-branches"><div class="dt-branch-head">潜在结果</div>' +
        '<div class="dt-sorthint">从上到下 = 你更偏好的结果，拖动 ⠿ 手柄排序</div>' +
        branchRows +
        '<button type="button" class="list-add" data-addrow="' + f.key + '"' + ds + dis + '>＋ 添加一条潜在结果</button>' +
      '</div>';
    return '<div class="field' + lk + '">' + body + '</div>';
  } else if (f.type === "pctrows") {
    /* ss「评估概率」：一行一个结果，结果名 + 概率输入（解释这些概率的三个问题作为普通字段排在后面） */
    const rows = Array.isArray(scope[f.source]) ? scope[f.source] : [];
    if (!rows.some(x => (x.t || "").trim())) return "";
    let n = 0;
    const body = rows.map((row, j) => {
      if (!(row.t || "").trim()) return "";
      n++;
      const k = f.prefix + j;
      return '<div class="dt-row">' +
          '<div class="dt-reason"><span class="idx">' + n + '.</span><span style="flex:1;min-width:0;">' + esc(row.t) + '</span></div>' +
          '<div class="dt-pct"><input type="text" inputmode="numeric" data-k="' + k + '" data-digits="1"' + ds + dis + ' value="' + esc(scope[k] == null ? "" : scope[k]) + '" placeholder="%"></div>' +
        '</div>';
    }).join("");
    return '<div class="field' + lk + '">' +
      '<div class="dt-table">' +
        '<div class="dt-thead"><span>' + esc(f.headLeft || "潜在结果") + '</span><span>%</span></div>' + body +
      '</div>' +
      (locked ? "" : '<div class="field-hint">概率只填数字（如 40，% 会自动加上）。</div>') +
    '</div>';
  } else if (f.type === "ptabs") {
    /* ss 决策分析页内「可能结果 / 评估概率 / 组内比较」三个环节的页签 */
    const tabs = (f.labels || []).map((t, ti) =>
      '<button type="button" class="otab' + (ti === subTab ? " active" : "") + '" data-ptab="' + ti + '"' + dis + '>' + esc(t || "（未填写）") + '</button>').join("");
    return '<div class="field' + lk + '">' + (f.label ? '<label class="field-label">' + esc(f.label) + '</label>' : "") +
      '<div class="otabs">' + tabs + '</div></div>';
  } else if (f.type === "sumlist") {
    /* 偏好排序 × 概率回顾：source 列表的顺序即偏好顺序，概率取自 probPrefix+序号 */
    const rows = (Array.isArray(scope[f.source]) ? scope[f.source] : []).filter(x => (x.t || "").trim());
    if (!rows.length) return "";
    const items = rows.map((row, j) => {
      const p = String(scope[f.probPrefix + j] == null ? "" : scope[f.probPrefix + j]).trim().replace(/%$/, "");
      return '<div class="sum-row">' +
          '<span class="sum-rank">' + (j + 1) + '</span>' +
          '<span class="sum-text">' + esc(row.t || "") + '</span>' +
          '<span class="sum-prob' + (p ? "" : " none") + '">' + (p ? "估计概率 " + esc(p) + "%" : "概率未评估") + '</span>' +
        '</div>';
    }).join("");
    return '<div class="field' + lk + '"><label class="field-label">' + esc(f.label) + '</label><div class="sum-list">' + items + '</div></div>';
  } else if (f.type === "note") {
    const noteText = typeof f.text === "function" ? f.text(scope) : (f.text || "");
    return '<div class="field' + lk + (f.half ? " half" : "") + '"><label class="field-label">' + esc(f.label) + '</label><div class="meta-note">' + esc(noteText) + '</div></div>';
  }
  const hint = f.hint ? '<div class="field-hint">' + esc(f.hint) + '</div>' : "";
  const halfCls = f.half ? " half" : "";
  return '<div class="field' + lk + halfCls + '"><label class="field-label">' + esc(f.label) + '</label>' + body + hint + '</div>';
}


/* ---------- 字段事件（读写按 data-scope 落在对应模块作用域） ---------- */
function bindFieldEvents(root) {
  const scopeOf = el => resolveScope(el.dataset.scope || "root", true);
  /* 内外视角的多组字段：带 data-grp/data-gi 的元素读到写落在该组的数据对象上 */
  const editTarget = el => el.dataset.grp
    ? pvGroupObj(resolveScope(el.dataset.scope || "m:pv", true), el.dataset.grp, Number(el.dataset.gi), true)
    : scopeOf(el);

  root.querySelectorAll("input[data-k], textarea[data-k]").forEach(el => {
    el.addEventListener("input", () => {
      const scopeStr = el.dataset.scope || "root";
      /* 概率格统一只存数字，% 由显示层补 */
      editTarget(el)[el.dataset.k] = el.dataset.digits ? el.value.replace(/[^\d.]/g, "") : el.value;
      persistScope(scopeStr);
      /* 本次决策 / 背景描述：双向同步（决策速度 / 六步决策 共用同一份文本） */
      syncRootKeyToDerived(el.dataset.k);
      syncDerivedKey(el.dataset.k, scopeStr, el.value);
      mirrorTwinEl(root, el.dataset.k, scopeStr, el.value);
      if (el.tagName === "TEXTAREA") growEl(el);
      refreshNavGate();
    });
  });

  root.querySelectorAll('input[type="radio"]').forEach(el => {
    el.addEventListener("change", () => {
      scopeOf(el)[el.dataset.k] = el.value;
      persistScope(el.dataset.scope || "root");
      saveDraft(); render();
    });
  });

  root.querySelectorAll(".score-btn").forEach(el => {
    el.onclick = () => {
      const sc = scopeOf(el);
      const k = el.dataset.score;
      sc[k] = (sc[k] === el.dataset.val) ? "" : el.dataset.val;
      persistScope(el.dataset.scope || "root");
      saveDraft(); render();
    };
  });

  root.querySelectorAll(".as-btn").forEach(el => {
    el.onclick = () => {
      const sc = scopeOf(el);
      const k = el.dataset.assess;
      if (!sc[k]) sc[k] = {};
      const cur0 = sc[k]["i" + el.dataset.i];
      sc[k]["i" + el.dataset.i] = (cur0 === el.dataset.v) ? "" : el.dataset.v;
      persistScope(el.dataset.scope || "root");
      saveDraft(); render();
    };
  });

  /* 多选行（最终选择等）：整行可点，切换勾选 */
  root.querySelectorAll("[data-mcheck]").forEach(el => {
    el.onclick = () => {
      const sc = scopeOf(el);
      const k = el.dataset.mcheck, mv = el.dataset.mv;
      if (!sc[k] || typeof sc[k] !== "object") sc[k] = (typeof sc[k] === "string" && sc[k]) ? { [sc[k]]: "yes" } : {};
      if (sc[k][mv] === "yes") delete sc[k][mv]; else sc[k][mv] = "yes";
      persistScope(el.dataset.scope || "root");
      saveDraft(); render();
    };
  });
  root.querySelectorAll(".sq-check[data-check]").forEach(el => {
    el.onclick = () => {
      const sc = scopeOf(el);
      const k = el.dataset.check;
      if (!sc[k]) sc[k] = {};
      const key = "i" + el.dataset.i;
      sc[k][key] = sc[k][key] ? "" : "yes";
      persistScope(el.dataset.scope || "root");
      saveDraft(); render();
    };
  });

  root.querySelectorAll("[data-addrow]").forEach(el => {
    el.onclick = () => {
      const sc = editTarget(el);
      const k = el.dataset.addrow;
      if (!Array.isArray(sc[k])) sc[k] = [];
      sc[k].push({});
      persistScope(el.dataset.scope || "root");
      saveDraft(); render();
    };
  });
  root.querySelectorAll("[data-rmrow]").forEach(el => {
    el.onclick = () => {
      const sc = editTarget(el);
      const k = el.dataset.rmrow;
      if (Array.isArray(sc[k])) sc[k].splice(Number(el.dataset.ri), 1);
      persistScope(el.dataset.scope || "root");
      saveDraft(); render();
    };
  });
  root.querySelectorAll("textarea[data-lk], input[data-lk]").forEach(el => {
    el.addEventListener("input", () => {
      // 概率列统一只存数字，% 由显示层自动添加
      const val = el.dataset.rk === "p" ? el.value.replace(/[^\d.]/g, "") : el.value;
      editTarget(el)[el.dataset.lk][Number(el.dataset.ri)][el.dataset.rk] = val;
      persistScope(el.dataset.scope || "root");
      if (el.tagName === "TEXTAREA") growEl(el);
      refreshNavGate();
    });
  });
  root.querySelectorAll(".chip[data-chip-lk]").forEach(el => {
    el.onclick = () => {
      const row = scopeOf(el)[el.dataset.chipLk][Number(el.dataset.ri)];
      row.c = (row.c === el.dataset.chip) ? "" : el.dataset.chip;
      persistScope(el.dataset.scope || "root");
      saveDraft(); render();
    };
  });

  /* ss 决策分析页：环节页签（可能结果 / 评估概率 / 组内比较）；结果行内的“依据”展开 */
  root.querySelectorAll("[data-ptab]").forEach(el => {
    el.onclick = () => { subTab = Number(el.dataset.ptab); goRender(); };
  });

  /* 内外视角：多组观点追踪的页签切换与增删组（校准与结论按同一索引对齐） */
  root.querySelectorAll("[data-pvtab]").forEach(el => {
    el.onclick = () => { pvTab = Number(el.dataset.pvtab); reviewEdit = -1; goRender(); };
  });
  root.querySelectorAll("[data-pvaddgroup]").forEach(el => {
    el.onclick = () => {
      const mv = resolveScope(el.dataset.scope || "m:pv", true);
      pvNorm(mv);
      mv.vt_groups.push({ name: "", outside_views: [], inside_views: [] });
      mv.cal_groups.push({});
      pvTab = mv.vt_groups.length - 1;
      saveDraft(); render();
    };
  });
  root.querySelectorAll("[data-pvrmgroup]").forEach(el => {
    el.onclick = () => {
      const mv = resolveScope(el.dataset.scope || "m:pv", true);
      pvNorm(mv);
      if (mv.vt_groups.length <= 1) return;
      if (!window.confirm("删除当前这组观点追踪？这一组的外视角、内视角以及对应的校准与结论都会删除。")) return;
      mv.vt_groups.splice(pvTab, 1);
      mv.cal_groups.splice(pvTab, 1);
      pvTab = Math.max(0, Math.min(pvTab, mv.vt_groups.length - 1));
      saveDraft(); render();
    };
  });

  /* 拖拽排序（ss otree 决策树分支 + s0 已选模块词条，同一套 HTML5 DnD 机制） */
  root.querySelectorAll(".dt-drag, .sel-drag").forEach(el => {
    el.addEventListener("dragstart", e => {
      dndSrc = { scope: el.dataset.scope || "root", key: el.dataset.dragLk, ri: Number(el.dataset.ri) };
      if (e.dataTransfer) { e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", "drag"); } catch (err) {} }
      const br = el.closest(".dt-branch, .sel-row"); if (br) br.classList.add("dragging");
    });
    el.addEventListener("dragend", () => {
      root.querySelectorAll(".dt-branch.dragging, .dt-branch.drag-over, .sel-row.dragging, .sel-row.drag-over").forEach(x => x.classList.remove("dragging", "drag-over"));
      dndSrc = null;
    });
  });
  root.querySelectorAll(".dt-branch[data-drop-lk], .sel-row[data-drop-lk]").forEach(row => {
    row.addEventListener("dragover", e => {
      if (!dndSrc || dndSrc.key !== row.dataset.dropLk || dndSrc.scope !== (row.dataset.scope || "root")) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", () => { row.classList.remove("drag-over"); });
    row.addEventListener("drop", e => {
      e.preventDefault();
      if (!dndSrc || dndSrc.key !== row.dataset.dropLk || dndSrc.scope !== (row.dataset.scope || "root")) return;
      const from = dndSrc.ri, to = Number(row.dataset.ri), scope = dndSrc.scope, key = dndSrc.key;
      dndSrc = null;
      moveRow(scope, key, from, to);
      saveDraft(); render();
    });
  });

  /* s0 模块勾选卡与默认流程卡（互斥两种模式）；未选模块数据保留不删 */
  root.querySelectorAll("[data-mp]").forEach(el => {
    el.onclick = () => { modpickToggle(el.dataset.mp); };
  });
  root.querySelectorAll("[data-mpdefault]").forEach(el => {
    el.onclick = () => { modpickDefaultToggle(); };
  });
}

/* 拖拽落点的数据变更（otree 分支与 s0 词条共用）：把 scope[key] 数组的 from 项移到 to */
function moveRow(scopeStr, key, from, to) {
  const arr = resolveScope(scopeStr, true)[key];
  if (!Array.isArray(arr) || from === to || from < 0 || from >= arr.length || to < 0 || to >= arr.length) return false;
  const item = arr.splice(from, 1)[0];
  arr.splice(to, 0, item);
  return true;
}
/* s0 自定义组合：点击模块卡勾选/取消；若当前是默认流程模式，退出默认、只勾选被点的这一张 */
function modpickToggle(m) {
  if (values.flowmode === "default") {
    values.flowmode = "custom";
    values.sel = [m];
    saveDraft(); render();
    return;
  }
  if (!Array.isArray(values.sel)) values.sel = [];
  const i = values.sel.indexOf(m);
  if (i >= 0) values.sel.splice(i, 1); else values.sel.push(m);
  values.flowmode = "custom";
  saveDraft(); render();
}
/* s0 默认流程卡：选中 = sel 固定为 dp→ss→pv→pm；再点一次取消，回到未选状态 */
function modpickDefaultToggle() {
  if (values.flowmode === "default") {
    values.flowmode = "custom";
    values.sel = [];
  } else {
    values.flowmode = "default";
    values.sel = DEFAULT_SEL.slice();
  }
  saveDraft(); render();
}


/* ---------- 保存报告 ---------- */
function cleanObj(o, skipKey) {
  Object.keys(o).forEach(k => {
    if (k === skipKey) return;
    const arr = o[k];
    if (Array.isArray(arr) && arr.length && arr.every(x => typeof x === "object" && x !== null)) {
      o[k] = arr.filter(row => Object.values(row).some(val => val != null && val !== ""));
    }
  });
}
function cleanModValues(m, mv) {
  const clean = JSON.parse(JSON.stringify(mv || {}));
  if (m === "pm" && Array.isArray(clean._rounds)) {
    clean._rounds.forEach(r => cleanObj(r));
    clean._rounds = clean._rounds.filter(r => Object.values(r).some(val =>
      val != null && val !== "" && !(Array.isArray(val) && val.length === 0)));
    if (!clean._rounds.length) delete clean._rounds;
  }
  Object.keys(clean).forEach(k => { if (k.charAt(0) === "_" && k !== "_rounds") delete clean[k]; });
  cleanObj(clean, "_rounds");
  return clean;
}

function finishReport() {
  /* 报告收纳两个阶段里所有有数据的部分（含中途取消勾选的模块），章节按 sel 顺序 + 复盘章 */
  const cleanMods = {};
  Object.keys(values.mods || {}).forEach(m => {
    if (!MODS[m]) return;
    const c = cleanModValues(m, values.mods[m]);
    if (Object.keys(c).length) cleanMods[m] = c;
  });
  const cleanRv = cleanRvValues(values.rv);
  const title = String(values.title || "").trim() || "未命名";
  const flowmode = values.flowmode === "default" ? "default" : "custom";
  const sel = selOf(values);
  const doReview = values.doReview !== "no";
  const syncMeta = (values._rvsync && Object.keys(values._rvsync).length) ? JSON.parse(JSON.stringify(values._rvsync)) : null;
  /* 编辑已保存的报告：更新原报告（保留原保存时间，记下本次更新时间），不新增一份 */
  if (editingReport) {
    editingReport.title = title;
    editingReport.flowmode = flowmode;
    editingReport.sel = sel;
    editingReport.mods = cleanMods;
    editingReport.doReview = doReview;
    if (Object.keys(cleanRv).length) editingReport.rv = cleanRv; else delete editingReport.rv;
    if (syncMeta) editingReport._rvsync = syncMeta; else delete editingReport._rvsync;
    editingReport.updated = new Date().toLocaleString("zh-CN");
    /* 追加评估已并入复盘阶段，旧报告里遗留的数据不再保留 */
    delete editingReport.followups;
    persistReports();
    dropCurrentDraft();
    values = {};
    resetNavState();
    viewingReport = editingReport;
    editingReport = null;
    view = "report";
    goRender();
    return;
  }
  const report = {
    id: Date.now(),
    date: new Date().toLocaleString("zh-CN"),
    title: title,
    flowmode: flowmode,
    sel: sel,
    mods: cleanMods,
    doReview: doReview
  };
  if (Object.keys(cleanRv).length) report.rv = cleanRv;
  if (syncMeta) report._rvsync = syncMeta;
  reports.unshift(report);
  persistReports();
  dropCurrentDraft();
  values = {};
  resetNavState();
  viewingReport = report;
  view = "report";
  goRender();
}


/* ---------- 编辑已保存的报告：恢复成可编辑的向导会话，保存时更新原报告 ---------- */
/* 待复盘记录（还没有实质复盘内容）点「编辑」进入决策流程的编辑（s0 + 决策模块），
   不带上复盘阶段；已有复盘内容的报告编辑时才是完整路径。
   atReview = true 时直接落在复盘第 1 步（报告页/待复盘记录的「开始复盘」）。 */
function startEditReport(r, atReview) {
  if (!r) return;
  /* 当前会话先落盘（留在「进行中的记录」里），编辑报告这件事另开一条记录 */
  saveDraft();
  DRAFT_ID = null;
  resetNavState();
  const reportSel = Array.isArray(r.sel) && r.sel.length
    ? r.sel.slice()
    : DEFAULT_SEL.filter(m => r.mods && r.mods[m]);
  values = {
    title: String(r.title || ""),
    flowmode: r.flowmode === "default" ? "default" : "custom",
    sel: reportSel,
    mods: JSON.parse(JSON.stringify(r.mods || {})),
    doReview: (atReview || hasRv(r)) ? "yes" : "no"
  };
  /* 复盘聚焦：从待复盘记录点「开始复盘」进入时，顶部流程条只显示复盘阶段（路径数据不变） */
  if (atReview) values.rvFocus = true;
  if (r.rv) values.rv = JSON.parse(JSON.stringify(r.rv));
  if (r._rvsync && typeof r._rvsync === "object") values._rvsync = JSON.parse(JSON.stringify(r._rvsync));
  editingReport = r;
  pmRound = (values.mods.pm && Array.isArray(values.mods.pm._rounds)) ? values.mods.pm._rounds.length : 0;
  if (pmRound > 0) resolveScope("m:pm@" + pmRound, true);
  /* 进入编辑时先按最新决策清单补齐复盘数据（如报告保存后又新增了决策） */
  applyReviewSync(false);
  if (atReview) {
    const entries = buildPath(values);
    const rvStart = entries.findIndex(e => e.rv);
    cur = rvStart >= 0 ? rvStart : 0;
  }
  saveDraft();
  view = "wizard";
  goRender();
}


function cancelEditReport() {
  const r = editingReport;
  dropCurrentDraft();
  editingReport = null;
  values = {}; pmRound = 0; cur = 0; reviewEdit = -1; rightTab = null; pvTab = 0;
  viewingReport = r || viewingReport;
  view = viewingReport ? "report" : "home";
  goRender();
}


/* ---------- 报告通用渲染件 ---------- */
function rv(label, val) {
  const has = val != null && val !== "" && !(Array.isArray(val) && val.length === 0);
  const body = !has
    ? '<div class="rv-value empty">（未填写）</div>'
    : Array.isArray(val)
      ? '<ul class="rv-list">' + val.map(x => '<li>' + rvItemText(x) + '</li>').join("") + '</ul>'
      : '<div class="rv-value">' + esc(val) + '</div>';
  return '<div class="rv-item"><div class="rv-label">' + esc(label) + '</div>' + body + '</div>';
}
function rvItemText(x) {
  if (typeof x === "object") {
    const chipMap = f_chipMap || {};
    const chipLabel = x.c && chipMap[x.c] ? "（" + chipMap[x.c] + "）" : "";
    return esc((x.t || "") + chipLabel);
  }
  return esc(x);
}
let f_chipMap = {};

function rvHtml(label, html) {
  const body = (html == null || html === "") ? '<div class="rv-value empty">（未填写）</div>' : html;
  return '<div class="rv-item"><div class="rv-label">' + esc(label) + '</div>' + body + '</div>';
}

/* 报告里的字段名：有 reportLabel 就用它（字段标签会随组合方式变化，报告要稳定） */
function rvLabel(f) {
  return f.reportLabel != null ? f.reportLabel : f.label;
}

/* ---------- renderRV：每种字段类型的报告/回顾渲染（v = 模块作用域 values） ---------- */
function renderRV(f, v) {
  const mv0 = v;   /* 模块作用域（grp 字段会把它换成组对象） */
  /* 内外视角的多组字段：先落到对应组的数据对象，再按原类型渲染 */
  let grpHead = "";
  if (f.grp) {
    const arr = ((f.grp === "cal" ? v.cal_groups : v.vt_groups) || []);
    const g = arr[f.gi] || {};
    if (f.grpHead) {
      const nm = f.grp === "cal"
        ? pvGroupName((v.vt_groups || [])[f.gi], f.gi)
        : pvGroupName(g, f.gi);
      grpHead = '<div class="rv-grp-head">' + esc(nm) + '</div>';
    }
    v = g;
  }
  if (f.showIf && !f.showIf(v)) return "";
  const val = f.key != null ? v[f.key] : null;
  if (f.type === "pvtabs") return "";
  if (f.type === "vtgroup") {
    /* 报告：组名小标题 + 该组的外/内视角 */
    return '<div class="rv-grp-head">' + esc(pvGroupName(v, f.gi)) + '</div>' +
      renderRV({ type: "viewtrack", key: "vt" }, v);
  }
  if (f.type === "calgroup") {
    /* 报告：组名小标题 + 该组的四个校准字段 */
    return '<div class="rv-grp-head">' + esc(pvGroupName((mv0.vt_groups || [])[f.gi], f.gi)) + '</div>' +
      (f.subs || []).map(sf => renderRV(sf, mv0)).join("");
  }
  if (f.type === "modpick") {
    return rv("流程", flowText(v));
  }
  if (f.type === "radio") {
    const opt = (f.options || []).find(o => o[0] === val);
    return rv(f.label, opt ? opt[1] : "");
  }
  if (f.type === "checks") {
    return rv(f.label, pickedOptionTexts(f, val).join("；"));
  }
  if (f.type === "score") {
    return rv(f.label, (val != null && val !== "") ? val + " / 5" : "");
  }
  if (f.type === "list") {
    return rv(rvLabel(f), val);
  }
  if (f.type === "chipslist") {
    f_chipMap = {};
    (f.chips || []).forEach(ch => { f_chipMap[ch[0]] = ch[1]; });
    return rv(f.label, val);
  }
  if (f.type === "checklist") {
    const rows = collectRows(f, v);
    const ans = val || {};
    const html = rows.map((row, ri) => {
      const on = !!ans["i" + ri];
      return '<div class="rv-as">' + (on ? "<b>✔ 满意</b> — " : "未勾选 — ") + esc(row.t || "") + '</div>';
    }).join("");
    if (html) return rvHtml(f.label, html);
    return "";
  }
  if (f.type === "triplist") {
    const rows = (Array.isArray(val) ? val : []).filter(r => (r.a || "").trim() || (r.b || "").trim() || (r.c || "").trim());
    if (!rows.length) return rv(f.label, null);
    const html = rows.map(r =>
      '<div class="rv-as">' + esc(r.a || "（未填事情）") + '：事前判断 <b>' + esc(r.b || "—") + '</b> → 基准概率 <b>' + esc(r.c || "—") + '</b></div>'
    ).join("");
    return rvHtml(f.label, html);
  }
  if (f.type === "viewtrack") {
    const colHtml = key => {
      const rows = (Array.isArray(v[key]) ? v[key] : []).filter(x => (x.t || "").trim());
      if (!rows.length) return '<div class="rv-value empty">（未填写）</div>';
      return '<ul class="rv-list">' + rows.map(x => rvItemText(x)).join("") + '</ul>';
    };
    return '<div class="rv-item"><div class="rv-label">观点跟踪</div>' +
      '<div class="rv-value"><b>外视角</b></div>' + colHtml("outside_views") +
      '<div class="rv-value" style="margin-top:8px;"><b>内视角</b></div>' + colHtml("inside_views") +
    '</div>';
  }
  if (f.type === "pctrows") {
    const rows = Array.isArray(v[f.source]) ? v[f.source] : [];
    let n = 0, html = "";
    rows.forEach((x, j) => {
      if (!(x.t || "").trim()) return;
      n++;
      html += '<div class="rv-as">' + n + '. ' + esc(x.t) + ' — <b>' + esc(fmtPct(v[f.prefix + j]) || "未评估") + '</b></div>';
    });
    return html ? rvHtml(f.label || "潜在结果与估计概率", html) : "";
  }
  if (f.type === "pcttable") {
    let html = "";
    (f.groups || []).forEach(g => {
      const failRows = (Array.isArray(v[g.fail]) ? v[g.fail] : []).filter(x => (x.t || "").trim());
      const succRows = (Array.isArray(v[g.succ]) ? v[g.succ] : []).filter(x => (x.t || "").trim());
      if (!failRows.length && !succRows.length) return;
      html += '<div class="rv-as"><b>' + esc(g.label) + '</b></div>';
      failRows.forEach(x => {
        html += '<div class="rv-as">失败 · ' + esc(x.t) + ' — <b>' + esc(fmtPct(x.p) || "未评估") + '</b></div>';
      });
      succRows.forEach(x => {
        html += '<div class="rv-as">成功 · ' + esc(x.t) + ' — <b>' + esc(fmtPct(x.p) || "未评估") + '</b></div>';
      });
    });
    if (html) return rvHtml("决策表（概率评估）", html);
    return "";
  }
  if (f.type === "strattable") {
    const rows = (Array.isArray(v[f.source]) ? v[f.source] : []).filter(x => (x.t || "").trim());
    if (!rows.length) return "";
    const html = rows.map(x => {
      const pct = fmtPct(x.p) || "未评估";
      const strat = (x[f.rk] || "").trim();
      return '<div class="rv-as">' + esc(x.t) + '（' + esc(pct) + '）→ <b>' + (strat ? esc(strat) : "未填策略") + '</b></div>';
    }).join("");
    return rvHtml(f.label, html);
  }
  if (f.type === "otree") {
    const rows = (Array.isArray(val) ? val : []).filter(x => (x.t || "").trim());
    const html = rows.map((x, ri) => "<li>" + (ri + 1) + ". " + esc(x.t || "") + "</li>").join("");
    return rvHtml("潜在结果（按偏好排序）", html ? "<ul class='rv-list'>" + html + "</ul>" : "");
  }
  if (f.type === "assess") {
    const rows = (f.sources || []).reduce((acc, k) => acc.concat((Array.isArray(v[k]) ? v[k] : []).filter(x => (x.t || "").trim())), []);
    const ans = val || {};
    const html = rows.map((row, ri) => {
      const a = ans["i" + ri];
      if (!a) return "";
      const opt = (f.options || []).find(o => o[0] === a);
      return '<div class="rv-as"><b>' + esc(opt ? opt[1] : "") + '</b> — ' + esc(row.t || "") + '</div>';
    }).join("");
    if (html) return rvHtml(f.label, html);
    return "";
  }
  if (f.type === "note" || f.type === "ptabs" || f.type === "sumlist" || f.type === "pvtabs") return "";
  return grpHead + rv(rvLabel(f), val);
}


/* ---------- 组合报告：复用向导录入界面的同一套字段 UI 只读重绘 ----------
 * 决策各模块每一步、复盘各阶段每一步都是一"页"（step-card），
 * 宽屏下两页并排（.report-flow 两列网格），窄屏单页。
 * 渲染前把 values 临时指向报告数据（克隆），resolveScope / rvV 等全套机制原样可用。 */
function decStepCardHtml(m, st, si, scopeStr, scope, roundLabel) {
  const mod = MODS[m];
  const entry = { mod: m, step: st };
  const card = (body, titleSuffix) => {
    if (!String(body).trim()) return "";
    return '<div class="step-card report-step">' +
      '<div class="step-head"><span class="tag">' +
        esc(mod.name + " · 第 " + (si + 1) + " 步 · " + st.tag + (roundLabel ? " · " + roundLabel : "")) + '</span>' +
        '<h2>' + esc(stepTitleFor(m, st, scope) + (titleSuffix || "")) + '</h2></div>' +
      '<div class="step-body">' + body + '</div></div>';
  };
  /* 六步决策的决策分析页：录入时一页内有三个独立环节（页签切换），报告里每环节各拆一页 */
  if (m === "ss" && st.base === "sd" && st.di != null) {
    return SS_PHASES.map((ph, pi) =>
      card(stepBody(entry, true, scopeStr, false, pi, null, null, true), " · " + ph)).join("");
  }
  /* 内外视角：多组观点追踪时逐组拆页（录入时按组页签切换，一组一个界面） */
  if (m === "pv") {
    const groups = pvVtGroups(pvNorm(scope));
    const nG = Math.max(1, groups.length);
    const parts = [];
    for (let gi = 0; gi < nG; gi++) {
      pvTab = gi;
      parts.push(card(stepBody(entry, true, scopeStr, false, null, null, true),
        nG > 1 ? " · " + pvGroupName(groups[gi], gi) : ""));
    }
    pvTab = 0;
    return parts.join("");
  }
  return card(stepBody(entry, true, scopeStr, false, null, null, true), "");
}

function moduleChapterHtml(m, mv, ci) {
  const mod = MODS[m];
  let cards = "";
  /* pm 的多轮：主作用域 = 第 1 轮，_rounds[i] = 第 i+2 轮（与向导的多轮机制一致） */
  const roundList = (m === "pm" && Array.isArray(mv._rounds)) ? mv._rounds : [];
  moduleSteps(m, mv).forEach((st, si) => {
    cards += decStepCardHtml(m, st, si, "m:" + m, mv, roundList.length ? "第 1 轮" : "");
  });
  roundList.forEach((rv0, ri) => {
    MOD_PM.steps.forEach((st, si) => {
      cards += decStepCardHtml("pm", st, si, "m:pm@" + (ri + 1), rv0, "第 " + (ri + 2) + " 轮");
    });
  });
  /* 章末结论（各模块 conclusionKey 原样沿用；也可以是函数，如内外视角的多组结论汇总） */
  const ckl = mod.conclusionKey || "conclusion";
  const cval = typeof ckl === "function" ? ckl(mv) : mv[ckl];
  if (cval && String(cval).trim()) {
    cards += '<div class="step-card report-step"><div class="step-body">' +
      '<div class="lesson-banner" style="margin-top:0;"><span class="lb-label">' + esc(mod.conclusionLabel || "一句话结论") + '</span>' + esc(cval) + '</div>' +
      '</div></div>';
  }
  if (!cards) return "";
  return '<div class="report-phase"><span class="pdot" style="background:' + mod.color + ';"></span>第' + CN_NUM[ci] + '章 · ' + esc(mod.name) + '（' + esc(mod.chapter) + '）</div>' + cards;
}

/* 起始步页卡：决策名称 + 所选模块（modpick 只读态） */
function s0CardHtml() {
  const body = stepBody({ mod: null, step: S0_STEP }, true, "root", false, null, null, true);
  if (!String(body).trim()) return "";
  return '<div class="step-card report-step">' +
    '<div class="step-head"><span class="tag">' + esc(S0_STEP.tag) + '</span><h2>' + esc(S0_STEP.title) + '</h2></div>' +
    '<div class="step-body">' + body + '</div></div>';
}

/* 报告页进度：字段是否有内容（grp 字段落到组对象上判断） */
function fieldFilled(f, sc) {
  if (f.key == null) return false;
  let v = sc;
  if (f.grp) v = ((f.grp === "cal" ? sc.cal_groups : sc.vt_groups) || [])[f.gi] || {};
  const val = v[f.key];
  if (Array.isArray(val)) return val.length > 0;
  if (val && typeof val === "object") return Object.values(val).some(x => x != null && String(x).trim() !== "");
  return val != null && String(val).trim() !== "";
}
function modProgress(m, mv) {
  let done = 0, total = 0;
  moduleSteps(m, mv).forEach(st => {
    const fs = (MODS[m].fields(st.id, mv) || []).filter(f => f.type !== "note" && (!f.showIf || f.showIf(mv)));
    if (!fs.length) return;
    total++;
    if (fs.some(f => fieldFilled(f, mv))) done++;
  });
  return { done: done, total: total };
}
function rvStepDone(st, v) {
  const keep = f => f.type !== "note" && f.type !== "dtex" && (!f.showIf || f.showIf(v));
  const isDec = DEC_STEP_IDS.indexOf(st.id) >= 0;
  const n = isDec ? Math.max(1, decPairs(v).length) : 1;
  for (let di = 0; di < n; di++) {
    const fs = (RV_FIELDS(st.id, v, isDec ? di : undefined) || []).filter(keep);
    /* 打分字段的值在 scoreKey 上（如 quality_0），一并算内容 */
    if (fs.some(f => fieldFilled(f, v) || (f.scoreKey && fieldFilled({ key: f.scoreKey }, v)))) return true;
  }
  return false;
}
function reportProgressHtml(r, sel, showRv) {
  /* 左框「决策阶段」：逐模块进度 + 判定结论（速度终点 / 最终选择 / 校准状态 / 验尸决定） */
  const modsWithData = Object.keys(r.mods || {}).filter(m => MODS[m]);
  const leftList = sel.length ? sel : modsWithData;
  const decRows = leftList.length ? leftList.map(m => {
    const mod = MODS[m];
    const mv = (r.mods || {})[m] || {};
    const p = modProgress(m, mv);
    const vd = mod.verdict(mv);
    return '<div class="rp-row"><span class="pdot" style="background:' + mod.color + ';"></span>' +
      '<b>' + esc(mod.name) + '</b><span class="rp-num">' + p.done + '/' + p.total + ' 步</span>' +
      (vd && vd.t ? '<span class="rp-vd">' + esc(vd.t) + '</span>' : "") + '</div>';
  }).join("") : '<div class="rp-row">（未使用辅助决策——直接复盘）</div>';
  /* 右框「复盘阶段」：四阶段进度 + 综合判定（最终象限 / 质量分 / 校准状态） */
  let rvRows;
  if (showRv) {
    rvRows = RV_PHASES.map((ph, pi) => {
      const steps = RV_STEPS.filter(st => st.phase === pi);
      const done = steps.filter(st => rvStepDone(st, r.rv)).length;
      return '<div class="rp-row"><span class="pdot" style="background:' + ph.color + ';"></span>' +
        esc(ph.name) + '<span class="rp-num">' + done + '/' + steps.length + ' 步</span></div>';
    }).join("");
    const vd = rvVerdict(r.rv);
    if (vd && vd.t) rvRows += '<div class="rp-row"><span class="rp-vd">综合判定：' + esc(vd.t) + '</span></div>';
  } else {
    rvRows = '<div class="rp-row">还没有复盘内容——结果出来后点上方「开始复盘」，决策阶段填过的内容会自动带入。</div>';
  }
  return '<div class="rep-prog">' +
    '<div class="rp-col"><h4>决策阶段</h4>' + decRows + '</div>' +
    '<div class="rp-col"><h4>复盘阶段</h4>' + rvRows + '</div>' +
  '</div>';
}

function renderReport() {
  const r = viewingReport;
  if (!r) { view = "home"; goRender(); return; }
  const sel = Array.isArray(r.sel) ? r.sel.filter(m => MODS[m] && r.mods && r.mods[m]) : [];
  const showRv = hasRv(r);
  /* 判定横幅只放决策模块；复盘的判定与进度在下方「复盘阶段」框里 */
  const badges = sel.map(m => {
    const vd = MODS[m].verdict(r.mods[m]);
    return '<div class="vb-item"><span class="vb-mod" style="color:' + MODS[m].color + ';">' + esc(MODS[m].name) + '</span>' +
      (vd && vd.t ? '<span class="verdict-banner ' + vd.cls + '">' + esc(vd.t) + '</span>' : "") + '</div>';
  }).join("");
  /* 渲染期间把 values 指向报告数据的克隆：stepBody / resolveScope / rvReportSections 原样复用 */
  const savedValues = values;
  let body = "";
  try {
    values = {
      title: String(r.title || ""),
      flowmode: r.flowmode === "default" ? "default" : "custom",
      sel: Array.isArray(r.sel) ? r.sel.slice() : [],
      mods: JSON.parse(JSON.stringify(r.mods || {})),
      rv: r.rv ? JSON.parse(JSON.stringify(r.rv)) : {}
    };
    const decPart = sel.length
      ? '<div class="report-phase"><span class="pdot" style="background:#999590;"></span>起始 · 本次决策</div>' + s0CardHtml() +
        sel.map((m, ci) => moduleChapterHtml(m, values.mods[m], ci)).join("")
      : "";
    body = '<div class="report-flow">' + decPart + (showRv ? rvChapterHtml(values.rv, sel.length) : "") + '</div>';
  } finally {
    values = savedValues;
  }
  const concl = showRv ? String(r.rv.conclusion || "").trim() : "";

  app.innerHTML =
    '<div class="report-head">' +
      '<div class="kicker" style="font-size:12px;font-weight:600;color:var(--accent);letter-spacing:0.06em;margin-bottom:8px;">' + esc(CONF.reportKicker) + '</div>' +
      '<h1>' + esc(r.title || "未命名") + '</h1>' +
      '<div class="meta">保存于 ' + esc(r.date) + (r.updated ? ' · 更新于 ' + esc(r.updated) : "") + ' · 流程：' + esc(flowText(r)) + '</div>' +
      '<div class="vb-row">' + badges + '</div>' +
      (concl ? '<div class="lesson-banner"><span class="lb-label">复盘结论</span>' + esc(concl) + '</div>' : "") +
      reportProgressHtml(r, sel, showRv) +
      '<div class="actions-row">' +
        (!showRv ? '<button class="btn" id="btn-start-review">开始复盘</button>' : "") +
        '<button class="btn secondary" id="btn-edit-report">' + (showRv ? "编辑此报告" : "编辑决策记录") + '</button>' +
        '<button class="btn secondary" id="btn-copy">复制为文字</button>' +
        '<button class="btn secondary" id="btn-print">打印 / 导出 PDF</button>' +
        '<button class="btn danger" id="btn-del-report">删除此报告</button>' +
        '<button class="btn secondary" id="btn-back">← 返回首页</button>' +
      '</div>' +
    '</div>' + body +
    '<div class="actions-row no-print"><button class="btn secondary" id="btn-back2">← 返回首页</button></div>';

  document.getElementById("btn-back").onclick = backHome;
  document.getElementById("btn-back2").onclick = backHome;
  document.getElementById("btn-print").onclick = () => window.print();
  document.getElementById("btn-edit-report").onclick = () => startEditReport(r);
  document.getElementById("btn-del-report").onclick = () => {
    if (!confirm("确定删除这份报告吗？此操作不可撤销（只是本工具里的一份，旧工具里的原件不受影响）。")) return;
    const idx = reports.indexOf(r);
    if (idx >= 0) { reports.splice(idx, 1); persistReports(); }
    /* 关联的复盘草稿一并删除 */
    if (drafts.some(d => d.e === r.id)) { drafts = drafts.filter(d => d.e !== r.id); persistDrafts(); }
    backHome();
  };
  const startReviewBtn = document.getElementById("btn-start-review");
  if (startReviewBtn) startReviewBtn.onclick = () => startEditReport(r, true);
  document.getElementById("btn-copy").onclick = () => {
    const text = reportToText(r);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => flashCopied(), () => fallbackCopy(text));
    } else fallbackCopy(text);
  };
  function backHome() { view = "home"; viewingReport = null; goRender(); }
}



/* ---------- 复制为文字：按章输出 ---------- */
function reportToText(r) {
  const sel = Array.isArray(r.sel) ? r.sel.filter(m => MODS[m] && r.mods && r.mods[m]) : [];
  const L = [];
  L.push("决策到复盘全流程报告：" + (r.title || "未命名"));
  L.push("保存于 " + r.date + (r.updated ? "（更新于 " + r.updated + "）" : ""));
  L.push("流程：" + flowText(r));
  L.push("");
  sel.forEach((m, ci) => {
    const mod = MODS[m];
    const mv = r.mods[m];
    L.push("════ 第" + CN_NUM[ci] + "章 · " + mod.name + "（" + mod.chapter + "）════");
    const vd = mod.verdict(mv);
    if (vd && vd.t) L.push("评估结论：" + vd.t);
    moduleSteps(m, mv).forEach(st => {
      const pairs = buildPairs(mod, st, mv);
      if (pairs.length) section_text(L, stepTitleFor(m, st, mv), pairs);
    });
    if (m === "pm") {
      const roundList = Array.isArray(mv._rounds) ? mv._rounds : [];
      roundList.forEach((rv0, ri) => {
        L.push("【第 " + (ri + 2) + " 轮计划：" + (rv0[MOD_PM.titleKey] || "未命名") + "】");
        MOD_PM.steps.forEach(st => {
          const pairs = buildPairs(MOD_PM, st, rv0).filter(p => p[0] !== "是否开启新一轮计划？");
          if (pairs.length) section_text(L, "　" + st.title, pairs);
        });
      });
    }
    const ckl = mod.conclusionKey || "conclusion";
    const cval = typeof ckl === "function" ? ckl(mv) : mv[ckl];
    if (cval && String(cval).trim()) L.push((mod.conclusionLabel || "一句话结论") + "：" + cval);
    L.push("");
  });
  /* 复盘阶段：按四个阶段逐步骤输出（决策与结果都已带入，不再重复） */
  if (hasRv(r)) {
    const ci = sel.length;
    L.push("════ 第" + CN_NUM[ci] + "章 · 复盘 ════");
    const vd = rvVerdict(r.rv);
    if (vd && vd.t) L.push("综合判定：" + vd.t);
    L.push("");
    rvTextTo(L, r.rv);
  }
  return L.join("\n");

  /* 每种字段类型的文字输出分支（第三处实现） */
  function buildPairs(mod, st, sc) {
    const pairs = [];
    (mod.fields(st.id, sc) || []).forEach(f => {
      if (f.type === "note" || f.type === "ptabs" || f.type === "sumlist" || f.type === "pvtabs") return;
      /* 内外视角的多组字段：值取自对应组，标签带上组名以便区分 */
      const sv = f.grp ? (((f.grp === "cal" ? sc.cal_groups : sc.vt_groups) || [])[f.gi] || {}) : sc;
      const gname = f.grp ? pvGroupName(f.grp === "cal" ? (sc.vt_groups || [])[f.gi] : sv, f.gi) : "";
      if (f.showIf && !f.showIf(sv)) return;
      const val = f.key != null ? sv[f.key] : null;
      if (f.type === "modpick") {
        pairs.push(["流程", flowText(sc)]);
      } else if (f.type === "checks") {
        const seg = pickedOptionTexts(f, val);
        if (seg.length) pairs.push([f.label, seg.join("；")]);
      } else if (f.type === "radio") {
        const opt = (f.options || []).find(o => o[0] === val);
        if (opt) pairs.push([f.label, opt[1]]);
      } else if (f.type === "score") {
        if (val != null && val !== "") pairs.push([f.label, val + " / 5"]);
      } else if (f.type === "assess") {
        const rows = (f.sources || []).reduce((acc, k) => acc.concat((Array.isArray(sc[k]) ? sc[k] : []).filter(x => (x.t || "").trim())), []);
        const ans = val || {};
        rows.forEach((row, ri) => {
          const a = ans["i" + ri];
          if (a) {
            const opt = (f.options || []).find(o => o[0] === a);
            pairs.push([f.label + "：" + (row.t || ""), opt ? opt[1] : ""]);
          }
        });
      } else if (f.type === "chipslist") {
        const chipMap = {};
        (f.chips || []).forEach(ch => { chipMap[ch[0]] = ch[1]; });
        const items = (Array.isArray(val) ? val : []).map(x => (x.t || "") + (x.c && chipMap[x.c] ? "（" + chipMap[x.c] + "）" : ""));
        if (items.length) pairs.push([f.label, items]);
      } else if (f.type === "checklist") {
        const rows = collectRows(f, sc);
        const ans = val || {};
        rows.forEach((row, ri) => {
          pairs.push([f.label + "：" + (row.t || ""), ans["i" + ri] ? "✔ 满意" : "未勾选"]);
        });
      } else if (f.type === "triplist") {
        const rows = (Array.isArray(val) ? val : []).filter(x => (x.a || "").trim() || (x.b || "").trim() || (x.c || "").trim());
        if (rows.length) pairs.push([f.label, rows.map(x => (x.a || "") + "：事前 " + (x.b || "—") + " → 基准 " + (x.c || "—"))]);
      } else if (f.type === "vtgroup") {
        const outs = (Array.isArray(sv.outside_views) ? sv.outside_views : []).filter(x => (x.t || "").trim()).map(x => x.t);
        const ins = (Array.isArray(sv.inside_views) ? sv.inside_views : []).filter(x => (x.t || "").trim()).map(x => x.t);
        if (outs.length) pairs.push(["外视角 · " + gname, outs]);
        if (ins.length) pairs.push(["内视角 · " + gname, ins]);
      } else if (f.type === "calgroup") {
        (f.subs || []).forEach(sf => {
          const v0 = sv[sf.key];
          if (v0 != null && String(v0).trim()) pairs.push([(sf.reportLabel != null ? sf.reportLabel : sf.label) + " · " + gname, v0]);
        });
      } else if (f.type === "viewtrack") {
        const outs = (Array.isArray(sv.outside_views) ? sv.outside_views : []).filter(x => (x.t || "").trim()).map(x => x.t);
        const ins = (Array.isArray(sv.inside_views) ? sv.inside_views : []).filter(x => (x.t || "").trim()).map(x => x.t);
        if (outs.length) pairs.push(["外视角" + (gname ? " · " + gname : ""), outs]);
        if (ins.length) pairs.push(["内视角" + (gname ? " · " + gname : ""), ins]);
      } else if (f.type === "pctrows") {
        const rows = Array.isArray(sc[f.source]) ? sc[f.source] : [];
        rows.forEach((x, j) => {
          if (!(x.t || "").trim()) return;
          pairs.push(["「" + trunc(x.t, 12) + "」发生的可能性", fmtPct(sc[f.prefix + j]) || "未评估"]);
        });
      } else if (f.type === "pcttable") {
        (f.groups || []).forEach(g => {
          const items = [];
          (Array.isArray(sc[g.fail]) ? sc[g.fail] : []).filter(x => (x.t || "").trim())
            .forEach(x => items.push("失败 · " + x.t + " — " + (fmtPct(x.p) || "未评估")));
          (Array.isArray(sc[g.succ]) ? sc[g.succ] : []).filter(x => (x.t || "").trim())
            .forEach(x => items.push("成功 · " + x.t + " — " + (fmtPct(x.p) || "未评估")));
          if (items.length) pairs.push(["决策表 · " + g.label, items]);
        });
      } else if (f.type === "strattable") {
        const items = (Array.isArray(sc[f.source]) ? sc[f.source] : []).filter(x => (x.t || "").trim())
          .map(x => x.t + "（" + (fmtPct(x.p) || "未评估") + "）→ " + ((x[f.rk] || "").trim() || "未填策略"));
        if (items.length) pairs.push([String(f.label || "").split("：")[0], items]);
      } else if (f.type === "otree") {
        const items = (Array.isArray(val) ? val : []).filter(x => (x.t || "").trim())
          .map((x, ri) => (ri + 1) + ". " + (x.t || ""));
        if (items.length) pairs.push(["潜在结果（按偏好排序）", items]);
      } else {
        if (val != null && val !== "" && (!Array.isArray(val) || val.length)) pairs.push([rvLabel(f) + (gname ? " · " + gname : ""), val]);
      }
    });
    return pairs;
  }

  function section_text(L2, name, pairs) {
    L2.push("【" + name + "】");
    pairs.forEach(([label, val]) => {
      if (val == null || val === "" || (Array.isArray(val) && val.length === 0)) return;
      if (Array.isArray(val)) {
        L2.push(label + "：");
        val.forEach(x => L2.push("  - " + (typeof x === "object" ? (x.t || "") : x)));
      } else L2.push(label + "：" + val);
    });
    L2.push("");
  }
}

/* 复盘阶段的文字导出（第三处字段实现，随复盘工具箱移植） */
function rvTextTo(L, v) {
  RV_PHASES.forEach((ph, pi) => {
    const buf = [];
    RV_STEPS.forEach((st, si) => {
      if (st.phase !== pi) return;
        const pairs = [];
        RV_FIELDS(st.id, v).forEach(f => {
          if (f.type === "note" || f.type === "dtex") return;
          if (f.type === "subtitle") { if (f.rv) pairs.push(["§" + f.label, ""]); return; }
          if (f.showIf && !f.showIf(v)) return;
          const val = v[f.key];
          if (f.type === "radio") {
            const opt = (f.options || []).find(o => o[0] === val);
            if (opt) pairs.push([f.label, opt[1]]);
          } else if (f.type === "score") {
            if (val != null && val !== "") pairs.push([f.label, val + " / 5"]);
          } else if (f.type === "assess") {
            const rows = (f.sources || []).reduce((acc, k) => acc.concat((Array.isArray(v[k]) ? v[k] : []).filter(x => (x.t || "").trim())), []);
            const ans = val || {};
            const itemsOf = key => (Array.isArray(v[key]) ? v[key] : []).filter(x => (x.t || "").trim()).map(x => x.t);
            rows.forEach((row, ri) => {
              const a = ans["i" + ri];
              if (!a) return;
              const opt = (f.options || []).find(o => o[0] === a);
              pairs.push(["" + (row.t || ""), opt ? opt[1] : ""]);
              if (a === "yes" || a === "part") { const it = itemsOf(f.knownKey + "_" + ri); if (it.length) pairs.push(["　└ 当时合理可知的信号", it]); }
              if (a === "part" || a === "no") { const it = itemsOf(f.hindKey + "_" + ri); if (it.length) pairs.push(["　└ 只是事后才显得必然", it]); }
            });
          } else if (f.type === "chipslist") {
            const chipMap = {};
            (f.chips || []).forEach(ch => { chipMap[ch[0]] = ch[1]; });
            const items = (Array.isArray(val) ? val : []).map(x => (x.t || "") + (x.c && chipMap[x.c] ? "（" + chipMap[x.c] + "）" : ""));
            if (items.length) pairs.push([f.label, items]);
          } else if (f.type === "triplist") {
            const rows = (Array.isArray(val) ? val : []).filter(r2 => (r2.a || "").trim() || (r2.b || "").trim() || (r2.c || "").trim());
            if (rows.length) pairs.push([f.label, rows.map(r2 => (r2.a || "") + "：事前 " + (r2.b || "—") + " → 基准 " + (r2.c || "—"))]);
          } else if (f.type === "viewtrack_multi") {
            const groups = Array.isArray(val) ? val : [];
            groups.forEach((g, gi) => {
              const title = (g.name || "").trim() ? g.name : "观点追踪 " + (gi + 1);
              const outs = (Array.isArray(g.out) ? g.out : []).filter(x => (x.t || "").trim()).map(x => x.t);
              const ins = (Array.isArray(g.in) ? g.in : []).filter(x => (x.t || "").trim()).map(x => x.t);
              if (outs.length) pairs.push([title + "：外视角", outs]);
              if (ins.length) pairs.push([title + "：内视角", ins]);
            });
          } else if (f.type === "calgroup") {
            const groups = Array.isArray(v[f.groupsKey || ("vt_" + f.index)]) ? v[f.groupsKey || ("vt_" + f.index)] : [];
            const cals = Array.isArray(val) ? val : [];
            const n2 = Math.max(groups.length, cals.length);
            for (let gi = 0; gi < n2; gi++) {
              const g = groups[gi] || {};
              const c = cals[gi] || {};
              const title = (g.name || "").trim() ? g.name : "观点追踪 " + (gi + 1);
              if ((c.same || "").trim()) pairs.push([title + "：完全相同的地方", c.same]);
              if ((c.deviate || "").trim()) pairs.push([title + "：偏离分析", c.deviate]);
              if ((c.cal || "").trim()) pairs.push([title + "：校准后的判断", c.cal]);
            }
          } else if (f.type === "quadpick") {
            const t = quadText(v, f.key);
            if (t) pairs.push([f.label, t]);
          } else if (f.type === "quadpair") {
            const fin = val || v.quadrant;
            let t = quadText({ quadrant: fin }, "quadrant");
            if (v.quadrant && QUADS[v.quadrant]) {
              t += (val && val !== v.quadrant) ? "（初步判断：" + QUADS[v.quadrant].name + "，已修正）" : "（与初步判断一致）";
            }
            if (t) pairs.push([f.label, t]);
          } else if (f.type === "yesno") {
            const ans = val || {};
            const items = [];
            f.items.forEach((qtext, i) => {
              const a = ans["i" + i];
              if (!a) return;
              let line = qtext + "：" + (a === "yes" ? "是" : "否");
              if (a === "yes" && ans["n" + i]) line += "（" + ans["n" + i] + "）";
              items.push(line);
            });
            if (items.length) pairs.push([f.label, items]);
            if (f.extraList && Array.isArray(v[f.extraList.key]) && v[f.extraList.key].length) pairs.push([f.extraList.label, v[f.extraList.key]]);
          } else if (f.type === "pairs") {
            const rows = (Array.isArray(val) ? val : []).filter(x => (x.d || "").trim() || (x.r || "").trim());
            const items = rows.map(x => (x.d || "（未填）") + " → " + (x.r || "（未填）"));
            if (items.length) pairs.push([f.label, items]);
          } else if (f.type === "dtree") {
            const idx = f.index;
            const p2 = decPairs(v)[idx] || {};
            const alts = Array.isArray(v["alts_" + idx]) ? v["alts_" + idx] : [];
            const items = [];
            const act2 = v["actual_" + idx] || {};
            if ((p2.r || "").trim()) items.push("实际发生（已同步）：" + p2.r + ((act2.p || "").trim() ? "（概率 " + act2.p + "）" : "") + (act2.c && EVAL_LABELS[act2.c] ? "（" + EVAL_LABELS[act2.c] + "）" : ""));
            alts.forEach(a => { if ((a.t || "").trim()) items.push(a.t + (a.p ? "（概率 " + a.p + "）" : "") + (a.c && EVAL_LABELS[a.c] ? "（" + EVAL_LABELS[a.c] + "）" : "")); });
            if (items.length) pairs.push(["决策树 " + (idx + 1) + "：" + (p2.d || ""), items]);
          } else if (f.type === "betterpick") {
            const idx = f.index;
            const alts = Array.isArray(v["alts_" + idx]) ? v["alts_" + idx] : [];
            const ans = val || {};
            const items = [];
            alts.forEach((row, ri) => { if ((row.t || "").trim() && ans["i" + ri]) items.push(row.t + (row.p ? "（概率 " + row.p + "）" : "")); });
            if (items.length) pairs.push([f.label, items]);
          } else if (f.type === "betterscore") {
            const idx = f.index;
            const alts = Array.isArray(v["alts_" + idx]) ? v["alts_" + idx] : [];
            const ans = val || {};
            const repeatMap2 = { yes: "会", no: "不会", unsure: "不确定" };
            const luckMap2 = { luck: "主要靠运气", half: "运气与决策各半", skill: "主要靠决策质量" };
            const sv2 = v[f.scoreKey];
            if (sv2 != null && sv2 !== "") pairs.push(["① 决策质量评分", sv2 + " / 5"]);
            const items = [];
            alts.forEach((row, ri) => { if ((row.t || "").trim() && ans["i" + ri]) items.push(row.t + (row.p ? "（概率 " + row.p + "）" : "")); });
            if (items.length) pairs.push(["② 比实际更好的潜在结果", items]);
            const rp2 = v[f.repeatKey];
            if (rp2 && repeatMap2[rp2]) pairs.push(["③ 重来一次是否同样决策", repeatMap2[rp2]]);
            if (v[f.reasonKey]) pairs.push(["③ 原因", v[f.reasonKey]]);
            const lk3 = v[f.luckKey];
            if (lk3 && luckMap2[lk3]) pairs.push(["④ 这个实际结果更多由什么决定", luckMap2[lk3]]);
            if (v[f.respKey]) pairs.push(["④ 对自身责任的看法", v[f.respKey]]);
          } else if (f.type === "ktflow") {
            const idx = f.index;
            const p3 = decPairs(v)[idx] || {};
            const kb = (Array.isArray(v["known_before_" + idx]) ? v["known_before_" + idx] : []).filter(x => (x.t || "").trim());
            const la = (Array.isArray(v["learned_after_" + idx]) ? v["learned_after_" + idx] : []).filter(x => (x.t || "").trim());
            if (kb.length) pairs.push(["① 做决策前就知道的事", kb]);
            if ((p3.d || "").trim()) pairs.push(["② 决策", p3.d]);
            if ((p3.r || "").trim()) pairs.push(["③ 结果", p3.r]);
            if (la.length) pairs.push(["④ 结果出来后才知道的事", la]);
          } else {
            if (val != null && val !== "" && (!Array.isArray(val) || val.length)) pairs.push([f.label, val]);
          }
        });
        /* 空分组（分组行后没有任何答案）不输出 */
        const pairsF = pairs.filter((pr, i) => !(pr[0].charAt(0) === "§" && (i === pairs.length - 1 || pairs[i + 1][0].charAt(0) === "§")));
        if (pairsF.length) section_text(buf, (si + 1) + ". " + st.title, pairsF);
    });
    if (buf.length) {
      L.push("════ " + ph.name + " ════");
      buf.forEach(x => L.push(x));
      L.push("");
    }
  });
  return L;

  function section_text(L2, name, pairs) {
    L2.push("【" + name + "】");
    pairs.forEach(function (pv2) {
      const label = pv2[0], val = pv2[1];
      if (label.charAt(0) === "§") { L2.push("── " + label.slice(1) + " ──"); return; }
      if (val == null || val === "" || (Array.isArray(val) && val.length === 0)) return;
      if (Array.isArray(val)) {
        L2.push(label + "：");
        val.forEach(x => L2.push("  - " + (typeof x === "object" ? (x.t || "") : x)));
      } else L2.push(label + "：" + val);
    });
    L2.push("");
  }
}

/* =====================================================================
 * 一个工具，两个平行入口：「辅助决策」与「决策复盘」在时间上分离
 *   辅助决策会话 = 起始步（决策名 + 勾选决策模块）+ 决策阶段（dp → ss → pv → pm，按勾选顺序）
 *   决策复盘会话 = 起始步（只起名）+ 复盘阶段（幸运箱 → 决策质量 → 重建决策树 → 再判断，12 步）
 *   从待复盘记录开始复盘 = 复盘聚焦会话：路径保留决策阶段（供右栏回顾/编辑与自动同步），
 *   顶部流程条只显示复盘阶段。决策与复盘保存后合并为同一份报告。
 *   两阶段共用一份事实：names / 决策清单 / 决策前的已知信息 / 内外视角，
 *   决策阶段填过的内容自动同步到复盘对应环节（只填空，随时可改，可重新同步）。
 * ===================================================================== */

const RV_COLOR = "#0e7490";
const RV_PHASE_DESC = [

  "只凭当时掌握的信息评判决策质量：按「决策前所知 → 决策 → 结果 → 事后才知」重建知识流程，逐条检验「我早就知道」是不是后视偏差，再把内外视角对照校准。结果不能倒灌记忆，这一步就是防波堤。",
  "把实际结果放回当初的所有可能之中：为每个决策重建决策树，补齐当时同样可能发生的潜在结果与概率，逐决策打分、勾选更好的反事实、回答「重来一次会怎样」，最后归因——这次结果里，运气与实力各占多少。",

];

let rvDecIdx = 0;      // 复盘阶段「当前第几个决策」（决策切换器）
let rvVtTab = 0;       // 复盘阶段视角校准「当前第几组观点追踪」
let auxTab = null;     // 右栏页签：null = 自动（第 1 步看基准，之后看回顾）
let baseSubTab = "lb"; // 基准页签内的子页签：lb 幸运箱 / kt 知识追踪 / pv 内外视角
let baseFrom = "home"; // 进入基准库前的视图，用于返回

/* 复盘阶段的数据都落在 values.rv 这个作用域里（与模块作用域 m:xx 并列） */
function rvV() {
  if (!values.rv || typeof values.rv !== "object") values.rv = {};
  return values.rv;
}
/* 本次流程是否包含复盘阶段（起始步默认包含；旧报告里没有这个字段） */
function rvInFlow(o) {
  o = o || values;
  if (o.doReview === "no") return false;
  if (o.doReview === "yes") return true;
  return hasRv(o);   /* 旧数据没有这个字段：按有没有复盘内容判断 */
}
/* 判断一份报告是否已有「实质复盘内容」：rv 存在且至少有一个关键字段非空。
   不能只看 rv 键是否存在——开始复盘 / 决策→复盘同步都会先建出 rv 骨架
   （事项名称 title 是自动同步的，不算实质内容）。 */
function hasRv(r) {
  const rv = r && r.rv;
  if (!rv || typeof rv !== "object") return false;
  const nz = x => x != null && String(x).trim() !== "";
  const rowHas = row => Object.keys(row || {}).some(k => {
    const val = row[k];
    if (Array.isArray(val)) return val.some(y => (y && typeof y === "object") ? rowHas(y) : nz(y));
    if (val && typeof val === "object") return rowHas(val);
    return nz(val);
  });
  return Object.keys(rv).some(k => {
    if (k === "title" || k.charAt(0) === "_") return false;
    const val = rv[k];
    if (Array.isArray(val)) return val.some(row => (row && typeof row === "object") ? rowHas(row) : nz(row));
    if (val && typeof val === "object") return rowHas(val);
    return nz(val);
  });
}
/* 观点追踪组名（与复盘工具箱同一口径） */
function rvGrpName(g, i) {
  const n = String((g && g.name) || "").trim();
  return n || ("观点追踪 " + (i + 1));
}
function rvStepTitle(entry, maxLen) {
  const t = (entry && entry.step && entry.step.title) || "";
  return maxLen && t.length > maxLen ? t.slice(0, maxLen) + "…" : t;
}

/* ---------- 决策阶段 → 复盘阶段：同源内容自动带入 ---------- */

/* 复盘第 1 步「决策 → 实际结果」的决策侧：完整照搬决策阶段的决策清单，
   不再只取「最终选择」；同时带出它在六步决策里的下标，供「决策前就知道的事」逐条对齐。 */
function rvSyncDecisionList() {
  const list = [];
  const push = (t, si) => {
    t = String(t || "").replace(/\s+/g, " ").trim();
    if (!t) return;
    list.push({ t: t, si: si });
  };
  const sel = selOf(values);
  const ss = (values.mods && values.mods.ss) || {};
  if (sel.indexOf("ss") >= 0) {
    decisionsOf(ss).forEach((d, i) => push(d.t, i));
  } else if (sel.indexOf("dp") >= 0) {
    push(dpDecisionText(), -1);
  }
  /* 六步决策没填出决策时，退回决策速度的决策陈述 */
  if (!list.length && sel.indexOf("dp") >= 0) push(dpDecisionText(), -1);
  if (!list.length && sel.length) {
    /* 再退回事前验尸要验的计划，最后退回会话名（只做复盘时不猜） */
    const pm = (values.mods && values.mods.pm) || {};
    if (String(pm.goal_desc || "").trim()) push(pm.goal_desc, -1);
    else push(values.title, -1);
  }
  return list;
}
/* 把决策清单合并进复盘的「决策 → 实际结果」：
   - 已有的结果按决策文字保留，不因补齐条目而丢失；
   - 清单里新增的决策插到对应位置；
   - 决策阶段没有的额外行（用户手动加的）保留在末尾。 */
function mergeReviewPairs(rows, list, force) {
  const norm = s => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
  const used = rows.map(() => false);
  const next = list.map(x => {
    const key = norm(x.t);
    let hit = -1;
    for (let i = 0; i < rows.length; i++) {
      if (!used[i] && norm(rows[i] && rows[i].d) === key) { hit = i; break; }
    }
    if (hit >= 0) {
      used[hit] = true;
      const old = rows[hit] || {};
      return { d: force ? x.t : (String(old.d || "").trim() || x.t), r: old.r || "" };
    }
    return { d: x.t, r: "" };
  });
  rows.forEach((row, i) => {
    if (used[i]) return;
    if (String((row && row.d) || "").trim() || String((row && row.r) || "").trim()) next.push(row);
  });
  return next;
}
/* 内外视角：pv 模块的多组观点追踪 / 多组校准 → 复盘的两套结构 */
function rvPvGroups(vt) {
  return pvVtGroups(vt).map(g => ({
    name: String(g.name || ""),
    out: (Array.isArray(g.outside_views) ? g.outside_views : []).filter(x => (x.t || "").trim()).map(x => ({ t: x.t })),
    in: (Array.isArray(g.inside_views) ? g.inside_views : []).filter(x => (x.t || "").trim()).map(x => ({ t: x.t }))
  })).filter(g => g.name || g.out.length || g.in.length);
}
function rvPvCals(vt) {
  pvNorm(vt);
  return (vt.cal_groups || []).map(g => ({
    same: String((g && g.same_way) || ""),
    deviate: String((g && g.deviate) || ""),
    cal: String((g && g.calibrated) || "")
  })).filter(c => c.same || c.deviate || c.cal);
}
/* 事前验尸的承诺 / 对冲逐条汇总成一段文本 */
function rvStrategyText(pm, key, rk) {

/* 哪些复盘步骤用了决策阶段的内容（用于就地提示与重新同步入口） */
const RV_SYNC_STEPS = {
  s1: "事项名称、决策清单、最初的期待",
  s3: "潜在结果与概率（来自六步决策的「可能结果 / 评估概率」）",

function rvSyncNote(stepId) {
